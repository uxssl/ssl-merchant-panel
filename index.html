    }

    // =====================================================================
    // Digital EMI
    // =====================================================================
    let emiTab = 'requests';
    const emiCalc = { amount: '50000', bank: EMI_BANKS[2].name };
    const EMI_REQ_STATUSES = ['Requested', 'Processing', 'Initial', 'Declined'];
    const EMI_BANK_STATUSES = ['Approved', 'Sent', 'Not Sent', 'Cancel'];
    const EMI_CLS = { Requested: 'bg-amber-50 text-amber-600', Declined: 'bg-rose-50 text-rose-600', Processing: 'bg-blue-50 text-blue-600', Initial: 'bg-slate-100 text-slate-500' };
    const EMI_BANK_CLS = { Approved: 'bg-emerald-50 text-emerald-600', Cancel: 'bg-rose-50 text-rose-600', Sent: 'bg-blue-50 text-blue-600', 'Not Sent': 'bg-slate-100 text-slate-500' };
    const emiBadge = (s) => `<span class="${STATUS_BADGE} ${EMI_CLS[s]}">${s}</span>`;
    const emiBankBadge = (s) => `<span class="${STATUS_BADGE} ${EMI_BANK_CLS[s]}">${s}</span>`;
    const titleCase = (s) => s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase());

    function emiRows(s, withStatus = true) {
      const q = s.search.trim().toLowerCase();
      return EMI_REQUESTS.filter(e =>
        (s.store === 'all' || e.store === s.store) &&
        (s.bank === 'all' || e.bank === s.bank) &&
        (s.bstatus === 'all' || e.bankStatus === s.bstatus) &&
        inRange(e, s.range) &&
        (!q || e.ref.toLowerCase().includes(q) || e.txn.id.toLowerCase().includes(q)) &&
        (!withStatus || s.status === 'all' || e.status === s.status)
      );
    }

    function emiRequestsTab(s) {
      const base = emiRows(s, false);
      const rows = emiRows(s);
      const { totalPages, start, pageRows } = paginate(s, rows);
      const statusOpts = [{ label: 'All Status', value: 'all' }, ...EMI_REQ_STATUSES.map(v => ({ label: v, value: v }))];
      const bankStatusOpts = [{ label: 'All', value: 'all' }, ...EMI_BANK_STATUSES.map(v => ({ label: v, value: v }))];
      const bankOpts = [{ label: 'All Banks', value: 'all' }, ...EMI_BANKS.map(b => ({ label: titleCase(b.name), value: b.name }))];
      const cols = [
        { label: 'Requested On', cell: e => dateCell(e.date) },
        { label: 'EMI Ref. Id', cell: e => `${idCell(e.ref)}<div class="2xl:hidden text-[11px] text-slate-500 font-mono">${e.txn.id}</div>` },
        { label: 'Store', cls: 'hidden xl:table-cell', cell: e => esc(e.storeName) },
        { label: 'Transaction ID', cls: 'hidden 2xl:table-cell', cell: e => `<span class="font-mono text-xs">${e.txn.id}</span>` },
        { label: 'TXN Amount', right: true, cell: e => `<span class="font-semibold text-slate-900 whitespace-nowrap">${fmtBDT(e.txn.amount)}</span>` },
        { label: 'EMI Amount', right: true, cell: e => `<div class="font-medium text-slate-800 whitespace-nowrap">${fmtBDT(e.charge)}</div><div class="text-xs text-slate-500">${e.tenure} months · ${titleCase(e.bank).replace(/ Limited$/, '')}</div>` },
        { label: 'Status', cell: e => `${emiBadge(e.status)}<div class="xl:hidden mt-1">${emiBankBadge(e.bankStatus)}</div>` },
        { label: 'Bank Status', cls: 'hidden xl:table-cell', cell: e => emiBankBadge(e.bankStatus) },
      ];
      return `
        <div class="flex flex-col">
          ${listFilterBar(s, 'EMI Ref ID or Transaction ID',
            selectPill('list', 'status', 'Request Status', statusOpts, s.status, 'circle-dot') +
            selectPill('list', 'bstatus', 'Bank Status', bankStatusOpts, s.bstatus, 'landmark') +
            selectPill('list', 'bank', 'EMI Issuer Bank', bankOpts, s.bank, 'building-2'))}
          <div class="flex flex-col gap-4 pt-4">
            <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              ${metricCard({ title: 'Total Requests', value: base.length.toLocaleString(), status: 'all', selected: s.status === 'all' && s.bstatus === 'all' })}
              ${metricCard({ title: 'Approved', value: base.filter(e => e.bankStatus === 'Approved').length.toLocaleString(), status: 'Approved', key: 'bstatus', selected: s.bstatus === 'Approved' })}
              ${metricCard({ title: 'Declined', value: base.filter(e => e.status === 'Declined').length.toLocaleString(), status: 'Declined', selected: s.status === 'Declined' })}
              ${metricCard({ title: 'EMI Amount (BDT)', value: fmtBDTShort(base.reduce((n, e) => n + e.charge, 0)) })}
            </div>
          </div>
          <div class="space-y-4 pt-6">
            ${listToolbar(rows.length, 'EMI requests', s)}
            ${dataTable({ cols, rows: pageRows, rowAttrs: e => `data-action="open-emi" data-value="${e.ref}"`, emptyTitle: 'No EMI requests found' })}
            ${pager(s, rows.length, start, pageRows.length, totalPages)}
          </div>
        </div>`;
    }

    function emiCalcResult() {
      const amount = Number(emiCalc.amount) || 0;
      const bank = EMI_BANKS.find(b => b.name === emiCalc.bank);
      if (amount < 5000) return `<p class="text-xs text-slate-500">Enter an amount of ৳5,000 or more (mock minimum).</p>`;
      return miniTable(['Tenure', 'Customer pays / month', 'Your EMI charge', 'You receive'],
        bank.tenures.map(m => [`${m} months`, fmtBDT(amount / m), `${fmtBDT(amount * bank.rates[m] / 100)} <span class="text-slate-400">(${bank.rates[m].toFixed(1)}%)</span>`, fmtBDT(amount - amount * bank.rates[m] / 100)]),
        { right: [1, 2, 3] });
    }

    function emiPlansTab() {
      return `
        <div class="space-y-6">
          <div class="bg-white rounded-lg border border-slate-200 shadow-sm">
            ${cardHead('EMI Availability', 'Stores where customers can choose EMI at checkout')}
            <div class="p-5 flex flex-wrap gap-3">
              ${STORES.map(st => `
                <div class="flex items-center gap-2 px-3 py-2 rounded-lg border ${EMI_STORES[st.id] ? 'border-emerald-200 bg-emerald-50/50' : 'border-slate-200 bg-slate-50'}">
                  ${ic(EMI_STORES[st.id] ? 'circle-check' : 'circle-minus', `w-4 h-4 ${EMI_STORES[st.id] ? 'text-emerald-600' : 'text-slate-400'}`)}
                  <span class="text-sm font-medium text-slate-800">${esc(st.name)}</span>
                  <span class="text-xs ${EMI_STORES[st.id] ? 'text-emerald-600' : 'text-slate-500'}">${EMI_STORES[st.id] ? 'Enabled' : 'Not enabled'}</span>
                </div>`).join('')}
              <p class="basis-full text-xs text-slate-500">To enable EMI for another store or change rates, contact your KAM.</p>
            </div>
          </div>

          <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
            ${cardHead('EMI Configuration', 'Store Rate by bank and tenure — the charge deducted from your settlement for each EMI payment')}
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 border-b border-slate-200"><tr>
                <th class="h-10 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Bank</th>
                ${EMI_TENURES.map(m => `<th class="h-10 px-2 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right whitespace-nowrap">${m}m</th>`).join('')}
              </tr></thead>
              <tbody class="divide-y divide-slate-100">
                ${EMI_BANKS.map(b => `<tr class="hover:bg-slate-50">
                  <td class="px-4 py-2.5 font-medium text-slate-800">${titleCase(b.name)}</td>
                  ${EMI_TENURES.map(m => `<td class="px-2 py-2.5 text-right tabular-nums ${b.tenures.includes(m) ? 'text-slate-700' : 'text-slate-300'}">${b.tenures.includes(m) ? `${b.rates[m].toFixed(1)}%` : '—'}</td>`).join('')}
                </tr>`).join('')}
              </tbody>
            </table>
            <p class="px-4 py-3 text-[11px] text-slate-500 border-t border-slate-100">Rates follow the KAM panel's EMI configuration and are mock values. Bank rates are not shown to merchants.</p>
          </div>

          <div class="bg-white rounded-lg border border-slate-200 shadow-sm">
            ${cardHead('EMI Calculator', 'What your customer pays each month and what you receive')}
            <div class="p-5 space-y-4">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-xl">
                ${field('Product Price (BDT)', `<input id="emi-calc-amount" type="number" min="0" value="${esc(emiCalc.amount)}" class="${INPUT}">`)}
                ${field('Bank', `<select id="emi-calc-bank" class="${INPUT}">${options(EMI_BANKS.map(b => [b.name, titleCase(b.name)]), emiCalc.bank)}</select>`)}
              </div>
              <div id="emi-calc-result">${emiCalcResult()}</div>
            </div>
          </div>
        </div>`;
    }

    function renderDigitalEmi() {
      const s = pageState();
      const tab = (value, label, icon) => `<button data-action="emi-tab" data-value="${value}" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ${emiTab === value ? 'bg-primary-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'}">${ic(icon, 'w-4 h-4')}${label}</button>`;
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Digital EMI</h1>
              <p class="text-slate-500 text-sm">Let card customers pay in monthly instalments through partner banks.</p>
            </div>
            <div class="inline-flex p-1 bg-white border border-slate-200 rounded-full shadow-sm">
              ${tab('requests', 'EMI Requests', 'list')}${tab('plans', 'EMI Plans & Rates', 'percent')}
            </div>
          </div>
          ${emiTab === 'requests' ? emiRequestsTab(s) : emiPlansTab()}
        </div>`;
    }

    function emiDrawer(e) {
      const t = e.txn;
      const after = (h) => new Date(Math.min(NOW.getTime(), e.date.getTime() + h * 3600e3));
      const steps = [{ label: 'EMI requested at checkout', at: e.date, tone: 'blue' }];
      if (e.bankStatus !== 'Not Sent') steps.push({ label: `Sent to ${titleCase(e.bank)}`, at: after(26), tone: 'amber' });
      if (e.bankStatus === 'Approved') steps.push({ label: 'Approved by bank — instalments started', at: after(70), tone: 'emerald' });
      if (e.bankStatus === 'Cancel') steps.push({ label: 'Declined by bank — charged as a regular payment', at: after(70), tone: 'rose' });
      if (e.bankStatus === 'Not Sent') steps.push({ label: 'Waiting to be sent to bank', note: 'Usually within one working day (mock)', tone: 'slate' });
      return drawerShell({
        title: 'EMI Details',
        sub: `<span class="font-mono text-xs">${e.ref}</span>${emiBadge(e.status)}${emiBankBadge(e.bankStatus)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('TXN Amount', fmtBDT(t.amount))}
            ${statBox('EMI Charge', fmtBDT(e.charge), 'text-rose-600')}
            ${statBox('Customer / Month', fmtBDT(t.amount / e.tenure))}
          </div>
          ${section('Information Details', kvGrid([
            kv('Store Name', esc(e.storeName)),
            kv('Store Id', e.store, true),
            kv('EMI Issuer Bank', titleCase(e.bank)),
            kv('EMI Tenure', `${e.tenure} Months`),
            kv('EMI Charge', `${fmtBDT(e.charge)} (${e.rate.toFixed(1)}%)`),
            kv('EMI Reference ID', e.ref, true),
            kv('Transaction Id', linkBtn('open-txn', t.id, t.id)),
            kv('Transaction Date', `${fmtDate(t.date)}, ${fmtTime(t.date, true)}`),
            kv('Card', t.account, true),
            kv('Requested On', `${fmtDate(e.date)}, ${fmtTime(e.date, true)}`),
            kv('Requested Remarks', e.remarks),
          ]))}
          ${section('Progress', timeline(steps))}
          ${PCI_NOTE}`,
        footer: `<button data-action="open-txn" data-value="${t.id}" class="${BTN_SECONDARY}">${ic('receipt', 'w-4 h-4')}View Transaction</button>`,
      });
    }

    // =====================================================================
    // Analytics & Reports — shared pieces
    // =====================================================================
    const AN = {
      business: '/analytics/business-analytics', share: '/analytics/market-share', geo: '/analytics/geographic-analytics',
      operators: '/analytics/mobile-operators', devices: '/analytics/browsers-devices', issuer: '/analytics/issuer-location',
      saved: '/analytics/saved-card-analytics',
    };
    const an = { preset: '30d', store: 'all' };
    const AN_PRESETS = [{ value: '7d', label: '7 Days' }, { value: '30d', label: '30 Days' }, { value: 'this_month', label: 'This Month' }, { value: 'all', label: 'All Time' }];
    // Categorical order checked with the dataviz palette validator (light surface): KAM primary first.
    const SERIES = ['#295cab', '#eb6834', '#1baf7a', '#eda100', '#e87ba4', '#6250d6'];
    const SEQ = ['#cde2fb', '#9ec5f4', '#6da7ec', '#3987e5', '#256abf', '#184f95', '#0d366b'];
    const CHANNELS = ['Card', 'Mobile Banking', 'QR', 'Wallet', 'Internet Banking'];
    let chartQueue = [];
    let anExport = null;
    const queueChart = (id, config) => chartQueue.push({ id, config });

    function setChartDefaults() {
      Chart.defaults.font.family = 'Inter, sans-serif';
      Chart.defaults.font.size = 11;
      Chart.defaults.color = '#64748b';
    }

    const anRange = () => {
      const r = presetRange(an.preset);
      return an.preset === 'all' ? { from: startOfDay(TXNS[TXNS.length - 1].date), to: r.to } : r;
    };
    const anTxns = () => {
      const { from, to } = anRange();
      return TXNS.filter(t => (an.store === 'all' || t.store === an.store) && t.date >= from && t.date <= to);
    };
    const pct = (a, b) => b ? a / b * 100 : 0;
    const fmtPct = (n) => `${n.toFixed(1)}%`;
    const okList = (list) => list.filter(t => t.status === 'success');
    const salesOf = (list) => okList(list).reduce((s, t) => s + t.amount, 0);
    const rateOf = (list) => pct(okList(list).length, list.length);

    function groupRows(list, key, order) {
      const groups = new Map();
      for (const t of list) {
        const k = typeof key === 'function' ? key(t) : t[key];
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(t);
      }
      const totalSales = salesOf(list) || 1;
      const rows = [...groups].map(([name, items]) => ({
        name, items, count: items.length, share: pct(items.length, list.length),
        sales: salesOf(items), salesShare: salesOf(items) / totalSales * 100,
        rate: rateOf(items), avg: okList(items).length ? salesOf(items) / okList(items).length : 0,
      }));
      return order ? order.map(n => rows.find(r => r.name === n)).filter(Boolean) : rows.sort((a, b) => b.count - a.count);
    }

    function anBuckets() {
      const { from, to } = anRange();
      const days = Math.round((startOfDay(to) - startOfDay(from)) / 864e5) + 1;
      const step = days > 35 ? 7 : 1;
      const out = [];
      for (let d = startOfDay(from); d <= to; d = addDays(d, step)) {
        out.push({ label: step === 7 ? `Wk ${fmtShort(d)}` : fmtShort(d), from: d, to: endOfDay(addDays(d, step - 1)) });
      }
      return { buckets: out, weekly: step === 7 };
    }
    const bucketize = (list, buckets, fn) => buckets.map(b => fn(list.filter(t => t.date >= b.from && t.date <= b.to)));

    const anCard = (title, sub, body, cls = '', right = '') => `
      <div class="bg-white rounded-lg border border-slate-200 shadow-sm ${cls}">
        ${cardHead(title, sub, right)}
        <div class="p-5">${body}</div>
      </div>`;

    // Ranked bars in one hue — magnitude only, so no categorical colours needed.
    function rankBars(rows, { value, label, sub, max }) {
      const m = max ?? Math.max(...rows.map(value), 1);
      if (!rows.length) return '<p class="text-sm text-slate-500">No data for this period.</p>';
      return `<div class="space-y-3">${rows.map(r => `
        <div>
          <div class="flex items-center justify-between gap-3 text-sm"><span class="font-medium text-slate-700 truncate">${esc(r.name)}</span><span class="font-semibold text-slate-900 tabular-nums whitespace-nowrap">${label(r)}</span></div>
          <div class="mt-1.5 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-primary-600" style="width:${Math.max(1.5, value(r) / m * 100)}%"></div></div>
          ${sub ? `<p class="text-[11px] text-slate-500 mt-1">${sub(r)}</p>` : ''}
        </div>`).join('')}</div>`;
    }

    // Donut + legend list. Colour follows the entity's slot in the fixed order, never its rank.
    function donut(id, rows, order, { value = r => r.count, label = r => fmtPct(r.share), sub = r => `${r.count.toLocaleString()} txns` } = {}) {
      const colorOf = (name) => SERIES[order.indexOf(name)];
      queueChart(id, {
        type: 'doughnut',
        data: { labels: rows.map(r => r.name), datasets: [{ data: rows.map(value), backgroundColor: rows.map(r => colorOf(r.name)), borderColor: '#ffffff', borderWidth: 2, hoverOffset: 4 }] },
        options: {
          maintainAspectRatio: false, cutout: '64%',
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${label(rows[c.dataIndex])} · ${c.label}` } } },
        },
      });
      return `
        <div class="flex items-center gap-6 flex-wrap">
          <div class="w-36 h-36 shrink-0"><canvas id="${id}" role="img" aria-label="Share chart; values listed alongside"></canvas></div>
          <ul class="flex-1 min-w-[170px] space-y-2.5">
            ${rows.map(r => `<li class="flex items-center gap-2 text-sm">
              <span class="w-2.5 h-2.5 rounded-sm shrink-0" style="background:${colorOf(r.name)}"></span>
              <span class="flex-1 min-w-0"><span class="block text-slate-700 truncate">${esc(r.name)}</span><span class="block text-[11px] text-slate-500">${sub(r)}</span></span>
              <span class="font-semibold text-slate-900 tabular-nums">${label(r)}</span>
            </li>`).join('')}
          </ul>
        </div>`;
    }

    function barChart(id, labels, data, { label, fmt = (v) => v, max } = {}) {
      queueChart(id, {
        type: 'bar',
        data: { labels, datasets: [{ label, data, backgroundColor: '#295cab', hoverBackgroundColor: '#4a75ba', borderRadius: 4, maxBarThickness: 28 }] },
        options: {
          maintainAspectRatio: false,
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${fmt(c.raw)} · ${label}` } } },
          scales: { x: { grid: { display: false } }, y: { grid: { color: '#f1f5f9' }, beginAtZero: true, max, ticks: { callback: (v) => fmt(v) } } },
        },
      });
      return `<div class="h-64"><canvas id="${id}" role="img" aria-label="${esc(label)} chart; values in the table below"></canvas></div>`;
    }

    function lineChart(id, labels, data, { label, fmt = (v) => v, min, max } = {}) {
      queueChart(id, {
        type: 'line',
        data: { labels, datasets: [{ label, data, borderColor: '#295cab', backgroundColor: '#295cab', borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: .3, spanGaps: true }] },
        options: {
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: (c) => ` ${fmt(c.raw)} · ${label}` } } },
          scales: { x: { grid: { display: false } }, y: { grid: { color: '#f1f5f9' }, min, max, ticks: { callback: (v) => fmt(v) } } },
        },
      });
      return `<div class="h-56"><canvas id="${id}" role="img" aria-label="${esc(label)} trend"></canvas></div>`;
    }

    function stackedBar(id, labels, series, order) {
      queueChart(id, {
        type: 'bar',
        data: { labels, datasets: series.map(s => ({ label: s.name, data: s.data, backgroundColor: SERIES[order.indexOf(s.name)], borderColor: '#ffffff', borderWidth: { top: 2 }, maxBarThickness: 32 })) },
        options: {
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10 } }, tooltip: { callbacks: { label: (c) => ` ${fmtBDT0(c.raw)} · ${c.dataset.label}` } } },
          scales: { x: { stacked: true, grid: { display: false } }, y: { stacked: true, grid: { color: '#f1f5f9' }, ticks: { callback: (v) => v >= 1e5 ? `${v / 1e5}L` : v >= 1e3 ? `${v / 1e3}k` : v } } },
        },
      });
      return `<div class="h-72"><canvas id="${id}" role="img" aria-label="Sales by channel over time; values in the table below"></canvas></div>`;
    }

    // Main table of each page doubles as the chart's table view and the CSV export.
    function anTable(name, header, rows, { right = [] } = {}) {
      anExport = { name, header, rows: rows.map(r => r.map(c => String(c).replace(/<[^>]+>/g, ''))) };
      return miniTable(header, rows, { right });
    }
    const exportBtn = `<button data-action="an-export" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-600 bg-white border border-slate-200 rounded-md hover:bg-slate-50 shadow-sm">${ic('download', 'w-3.5 h-3.5')}Export CSV</button>`;
    const insight = (text) => `<div class="flex items-start gap-2 rounded-lg border border-primary-100 bg-primary-50 px-3 py-2.5 text-sm text-primary-800">${ic('lightbulb', 'w-4 h-4 mt-0.5 shrink-0')}<span>${text}</span></div>`;
    const mockNote = (text) => `<p class="flex items-start gap-1.5 text-[11px] text-slate-500">${ic('info', 'w-3.5 h-3.5 mt-px shrink-0')}${text}</p>`;

    function analyticsShell(title, sub, body) {
      const list = anTxns();
      const { from, to } = anRange();
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">${title}</h1>
              <p class="text-slate-500 text-sm">${sub}</p>
            </div>
            <div class="flex items-center gap-3">
              ${selectPill('an', 'store', 'All Stores', STORE_OPTS, an.store, 'store')}
              <div class="inline-flex p-1 bg-white border border-slate-200 rounded-full shadow-sm">
                ${AN_PRESETS.map(p => `<button data-action="an-preset" data-value="${p.value}" class="px-3 py-1 rounded-full text-xs font-semibold transition-colors ${an.preset === p.value ? 'bg-primary-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'}">${p.label}</button>`).join('')}
              </div>
            </div>
          </div>
          <p class="text-xs text-slate-500 -mt-3">${fmtDate(from)} – ${fmtDate(to)} · ${list.length.toLocaleString()} transactions${an.store !== 'all' ? ` · ${esc(STORES.find(s => s.id === an.store).name)}` : ''}</p>
          ${body(list)}
        </div>`;
    }

        const ok = okList(list);

        const repeat = customers.filter(c => c.count > 1).length;
        const { buckets, weekly } = anBuckets();
        const daily = bucketize(list, buckets, (l) => ({ count: l.length, ok: okList(l).length, sales: salesOf(l), rate: l.length ? rateOf(l) : null }));
        const stores = groupRows(list, 'storeName');

            ${metricCard({ title: 'Gross Sales', value: fmtBDTShort(salesOf(list)) })}

            ${metricCard({ title: 'Success Rate', value: fmtPct(rateOf(list)) })}
            ${metricCard({ title: 'Avg. Ticket', value: fmtBDT0(ok.length ? salesOf(list) / ok.length : 0) })}
            ${metricCard({ title: 'Unique Customers', value: customers.length.toLocaleString() })}

            ${anCard('Sales by Store', 'Share of successful sales', rankBars(stores, { value: r => r.sales, label: r => fmtBDTShort(r.sales), sub: r => `${fmtPct(r.salesShare)} of sales · ${fmtPct(r.rate)} success` }))}
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

            ${anCard('Top Failure Reasons', `${reasons.reduce((s, r) => s + r.count, 0)} failed payments`, rankBars(reasons, { value: r => r.count, label: r => r.count, sub: r => `${fmtPct(r.share)} of failures` }))}
          </div>
          ${anCard('When Customers Pay', 'Successful payments by weekday and hour — darker means busier', `
            <div class="grid gap-[2px] items-center" style="grid-template-columns:36px repeat(24,minmax(0,1fr))">
              <span></span>${Array.from({ length: 24 }, (_, h) => `<span class="text-[10px] text-slate-400 text-center">${h % 3 === 0 ? pad(h) : ''}</span>`).join('')}
              ${grid.map((row, i) => `<span class="text-[11px] text-slate-500">${DAY_LABEL[DAY_ORDER[i]]}</span>${row.map((n, h) => `<span class="h-6 rounded-sm hover:ring-2 hover:ring-slate-900/30" style="background:${level(n)}" title="${DAY_LABEL[DAY_ORDER[i]]} ${pad(h)}:00–${pad(h)}:59 · ${n} payments"></span>`).join('')}`).join('')}

            { right: [1, 2, 3, 4] }), '', exportBtn)}`;
      });
    }

        return `
          <div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-5 gap-4">
            ${metricCard({ title: 'Saved-card Payments', value: saved.length.toLocaleString(), sub: fmtBDTShort(salesOf(saved)) })}
            ${metricCard({ title: 'Share of Card Payments', value: fmtPct(pct(saved.length, cards.length)) })}
            ${metricCard({ title: 'Success Rate', value: fmtPct(rateOf(saved)), sub: `${fmtPct(rateOf(fresh))} with a new card` })}
            ${metricCard({ title: 'Avg. Time to Pay', value: `${Math.round(avgTime(saved))} s`, sub: `${Math.round(avgTime(fresh))} s with a new card` })}
            ${metricCard({ title: 'Cards Saved', value: newTokens.toLocaleString(), sub: `${repeat} repeat customers` })}
          </div>
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            ${anCard('Saved-card Share', `Share of card payments per ${weekly ? 'week' : 'day'}`, lineChart('an-saved', buckets.map(b => b.label), trend, { label: 'Saved-card share', fmt: (v) => `${Math.round(v)}%`, min: 0, max: 60 }), 'lg:col-span-2')}
            ${anCard('Saved Cards by Scheme', 'Share of saved-card payments', rankBars(schemes, { value: r => r.count, label: r => fmtPct(r.share), sub: r => `${r.count} payments` }))}
          </div>
          ${anCard('Saved vs New Card', 'Card payments on online checkout', anTable('saved-card-analytics',
            ['Card', 'Payments', 'Success Rate', 'Avg. Ticket', 'Avg. Time to Pay'],
            [row('Saved card', saved), row('New card', fresh)],
            { right: [1, 2, 3, 4] }), '', exportBtn)}
          ${mockNote('Cards are tokenized and stored by SSLCOMMERZ under PCI-DSS — your store never sees or keeps card numbers. Time to pay and all figures are mock data.')}`;
      });
    }

    // =====================================================================
    // Campaigns — shared
    // =====================================================================
    const CMP = { partner: '/campaigns/partnership-campaigns', merchant: '/campaigns/merchant-campaigns', calendar: '/campaigns/campaign-calendar' };
    const PARTICIPATION_CLS = { 'Not joined': 'bg-slate-100 text-slate-500', 'Created': 'bg-slate-100 text-slate-600', 'KAM Approved': 'bg-blue-50 text-blue-600', 'Bank Approved': 'bg-emerald-50 text-emerald-600', 'Rejected': 'bg-rose-50 text-rose-600', 'Closed': 'bg-rose-50 text-rose-600' };
    const MC_CLS = { Running: 'bg-emerald-50 text-emerald-600', Pending: 'bg-amber-50 text-amber-600', Created: 'bg-slate-100 text-slate-500', Closed: 'bg-rose-50 text-rose-600' };
    const PHASE_CLS = { Upcoming: 'bg-blue-50 text-blue-600', Running: 'bg-emerald-50 text-emerald-600', Ended: 'bg-slate-100 text-slate-500' };
    const pBadge = (s) => `<span class="${STATUS_BADGE} ${PARTICIPATION_CLS[s]}">${s === 'Created' ? 'Requested' : s}</span>`;
    const mcBadge = (s) => `<span class="${STATUS_BADGE} ${MC_CLS[s]}">${s}</span>`;
    const phaseOf = (c) => NOW < c.start ? 'Upcoming' : NOW > c.end ? 'Ended' : 'Running';
    const phaseBadge = (c) => `<span class="${STATUS_BADGE} ${PHASE_CLS[phaseOf(c)]}">${phaseOf(c)}</span>`;
    const periodText = (c) => `${fmtShort(c.start)} – ${fmtDate(c.end)}`;
    const daysLeft = (d) => Math.ceil((d - NOW) / 864e5);
    const canJoin = (c) => c.participation === 'Not joined' && c.canOnboard === 'Yes' && NOW <= c.confirm && phaseOf(c) !== 'Ended';
    const JOINED = ['Created', 'KAM Approved', 'Bank Approved'];
    const storeNames = (ids) => ids.map(id => STORES.find(s => s.id === id).name);

    function partnerPerf(c) {
      if (c.participation !== 'Bank Approved') return { txns: [], sales: 0, discount: 0 };
      const txns = TXNS.filter(t => t.status === 'success' && c.stores.includes(t.store) && t.date >= c.start && t.date <= c.end && t.amount >= c.minOrder &&
        (c.kind === 'MFS' ? t.method === c.match : t.issuerLocation === 'Local' && t.issuerBank === c.match));
      return { txns, sales: txns.reduce((s, t) => s + t.amount, 0), discount: txns.reduce((s, t) => s + Math.min(c.max, t.amount * c.pct / 100), 0) };
    }
    const mcDiscountOf = (c, t) => c.type === 'Percentage' ? Math.min(c.max, t.amount * c.value / 100) : Math.min(c.value, t.amount);
    function merchantPerf(c) {
      if (!['Running', 'Closed'].includes(c.status)) return { txns: [], sales: 0, discount: 0 };
      const txns = TXNS.filter(t => t.status === 'success' && c.stores.includes(t.store) && t.date >= c.start && t.date <= c.end && t.amount >= c.minOrder &&
        ((t.issuerLocation === 'Local' && c.banks.includes(t.issuerBank)) || c.mfs.includes(t.method) || c.ib.includes(t.method)));
      return { txns, sales: txns.reduce((s, t) => s + t.amount, 0), discount: txns.reduce((s, t) => s + mcDiscountOf(c, t), 0) };
    }
    const offerText = (c) => `${c.pct}% off up to ${fmtBDT0(c.max)}`;
    const mcOfferText = (c) => c.type === 'Percentage' ? `${c.value}% off up to ${fmtBDT0(c.max)}` : `${fmtBDT0(c.value)} off`;

    // =====================================================================
    // Partnership Campaigns
    // =====================================================================
    let partnerTab = 'open';
    let joinDraft = null;

    function partnerCard(c) {
      const perf = partnerPerf(c);
      const left = daysLeft(c.confirm);
      return `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col overflow-hidden">
          <div class="px-5 py-4 bg-gradient-to-br from-primary-700 to-primary-500 text-white">
            <p class="text-[11px] font-semibold uppercase tracking-wider opacity-80">${esc(c.partner)} · ${c.kind === 'MFS' ? 'MFS' : 'Bank'} partner</p>
            <p class="text-2xl font-bold mt-1">${c.pct}% OFF</p>
            <p class="text-xs opacity-90">up to ${fmtBDT0(c.max)} · min. order ${fmtBDT0(c.minOrder)}</p>
          </div>
          <div class="p-5 space-y-3 flex-1">
            <div class="flex items-start justify-between gap-2">
              <h3 class="text-sm font-semibold text-slate-900">${esc(c.partner)} ${esc(c.name)}</h3>
              ${phaseBadge(c)}
            </div>
            <dl class="grid grid-cols-2 gap-2 text-xs">
              <div><dt class="text-slate-500">Campaign period</dt><dd class="text-slate-800 font-medium">${periodText(c)}</dd></div>
              <div><dt class="text-slate-500">Enroll by</dt><dd class="font-medium ${canJoin(c) && left <= 3 ? 'text-rose-600' : 'text-slate-800'}">${fmtDate(c.confirm)}${canJoin(c) ? ` · ${left <= 0 ? 'today' : `${left}d left`}` : ''}</dd></div>
              <div class="col-span-2"><dt class="text-slate-500">Eligible</dt><dd class="text-slate-800">${esc(c.cards)}</dd></div>
              <div class="col-span-2"><dt class="text-slate-500">Sectors</dt><dd class="text-slate-800">${esc(c.sectors)}</dd></div>
            </dl>
            ${perf.txns.length ? `<p class="text-xs text-emerald-700 bg-emerald-50 rounded px-2 py-1.5">${perf.txns.length} payments · ${fmtBDTShort(perf.sales)} sales · ${fmtBDTShort(perf.discount)} discount given</p>` : ''}
            ${c.canOnboard === 'No' && c.participation === 'Not joined' ? '<p class="text-xs text-slate-500 bg-slate-50 rounded px-2 py-1.5">Not open to your sector</p>' : ''}
          </div>
          <div class="px-5 py-3 border-t border-slate-100 flex items-center justify-between gap-2">
            ${pBadge(c.participation)}
            <div class="flex gap-2">
              <button data-action="open-partner" data-value="${c.id}" class="px-3 py-1.5 text-xs font-medium text-slate-700 bg-white border border-slate-200 rounded hover:bg-slate-50">Details</button>
              ${canJoin(c) ? `<button data-action="join-partner" data-value="${c.id}" class="px-3 py-1.5 text-xs font-semibold text-white bg-primary-600 rounded hover:bg-primary-700">Join</button>` : ''}
            </div>
          </div>
        </div>`;
    }

    function renderPartnerCampaigns() {
      const open = PARTNER_CAMPAIGNS.filter(canJoin);
      const mine = PARTNER_CAMPAIGNS.filter(c => JOINED.includes(c.participation) && phaseOf(c) !== 'Ended');
      const past = PARTNER_CAMPAIGNS.filter(c => phaseOf(c) === 'Ended');
      const discount = PARTNER_CAMPAIGNS.reduce((s, c) => s + partnerPerf(c).discount, 0);
      const lists = { open, mine, all: PARTNER_CAMPAIGNS, past };
      const list = lists[partnerTab];
      const tab = (value, label, n) => `<button data-action="partner-tab" data-value="${value}" class="inline-flex items-center gap-1.5 px-4 py-1.5 rounded-full text-sm font-semibold transition-colors ${partnerTab === value ? 'bg-primary-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-50'}">${label}<span class="text-[11px] ${partnerTab === value ? 'opacity-80' : 'text-slate-400'}">${n}</span></button>`;
      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Partnership Campaigns</h1>
            <p class="text-slate-500 text-sm">Bank and MFS offers you can join — the partner shares the discount cost with you.</p>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
            ${metricCard({ title: 'Open to Join', value: open.length, sub: open.length ? `Next deadline ${fmtShort(open.map(c => c.confirm).sort((a, b) => a - b)[0])}` : 'Nothing open right now' })}
            ${metricCard({ title: 'Joined', value: mine.length, sub: `${mine.filter(c => c.participation === 'Created').length} awaiting approval` })}
            ${metricCard({ title: 'Running Now', value: PARTNER_CAMPAIGNS.filter(c => phaseOf(c) === 'Running' && c.participation === 'Bank Approved').length, sub: 'with your stores' })}
            ${metricCard({ title: 'Discount Given', value: fmtBDTShort(discount), sub: 'across partner campaigns' })}
          </div>
          <div class="inline-flex p-1 bg-white border border-slate-200 rounded-full shadow-sm">
            ${tab('open', 'Open to Join', open.length)}${tab('mine', 'My Campaigns', mine.length)}${tab('all', 'All', PARTNER_CAMPAIGNS.length)}${tab('past', 'Past', past.length)}
          </div>
          ${list.length ? `<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${list.map(partnerCard).join('')}</div>` : `
            <div class="flex flex-col items-center justify-center py-14 text-center rounded-xl border border-dashed border-slate-300">
              ${ic('megaphone', 'w-6 h-6 text-slate-300')}
              <p class="text-sm font-semibold text-slate-900 mt-3">No campaigns here</p>
              <p class="text-xs text-slate-500">New partner offers appear in "Open to Join" when banks announce them.</p>
            </div>`}
        </div>`;
    }

    function partnerDrawer(c) {
      const perf = partnerPerf(c);
      const order = ['Created', 'KAM Approved', 'Bank Approved'];
      const reached = (s) => JOINED.includes(c.participation) && order.indexOf(c.participation) >= order.indexOf(s);
      const steps = [];
      if (c.participation === 'Not joined') steps.push({ label: 'Not joined yet', note: canJoin(c) ? `Enroll before ${fmtDate(c.confirm)}` : 'Enrollment is closed', tone: 'slate' });
      else {
        const reqAt = new Date(Math.min(NOW.getTime(), c.confirm.getTime() - 3 * 864e5));
        steps.push({ label: 'You requested to join', at: reqAt, tone: 'blue' });
        if (c.participation === 'Rejected') steps.push({ label: `Rejected — ${c.rejectReason}`, at: new Date(Math.min(NOW.getTime(), reqAt.getTime() + 864e5)), tone: 'rose' });
        else {
          steps.push(reached('KAM Approved') ? { label: 'Approved by your KAM', at: new Date(Math.min(NOW.getTime(), reqAt.getTime() + 864e5)), tone: 'amber' } : { label: 'Waiting for KAM approval', note: 'Usually within one working day (mock)', tone: 'slate' });
          steps.push(reached('Bank Approved') ? { label: `Approved by ${c.partner}`, at: new Date(Math.min(NOW.getTime(), reqAt.getTime() + 2 * 864e5)), tone: 'emerald' } : { label: `Waiting for ${c.partner} approval`, note: '', tone: 'slate' });
        }
      }
      const byStore = c.stores.map(id => { const l = perf.txns.filter(t => t.store === id); return [esc(STORES.find(s => s.id === id).name), l.length, fmtBDT0(l.reduce((s, t) => s + t.amount, 0)), fmtBDT0(l.reduce((s, t) => s + Math.min(c.max, t.amount * c.pct / 100), 0))]; });
      return drawerShell({
        wide: true,
        title: `${esc(c.partner)} ${esc(c.name)}`,
        sub: `<span class="font-mono text-xs">${c.tracking}</span>${phaseBadge(c)}${pBadge(c.participation)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Discount', offerText(c))}
            ${statBox('Cost Share', `You ${c.merchantShare}% · ${esc(c.partner)} ${100 - c.merchantShare}%`)}
            ${statBox('Enroll By', fmtDate(c.confirm))}
          </div>
          ${section('Campaign Information', kvGrid([
            kv('Campaign', `${esc(c.partner)} ${esc(c.name)}`),
            kv('Tracking Id', c.tracking, true),
            kv('Eligible Cards / Wallet', esc(c.cards)),
            kv('Sectors', esc(c.sectors)),
            kv('Start Date', fmtDate(c.start)),
            kv('End Date', fmtDate(c.end)),
            kv('Confirmation Expire', fmtDate(c.confirm)),
            kv('Can Onboard', c.canOnboard),
          ]))}
          ${section('Discount Terms', kvGrid([
            kv('Offer Modality %', `${c.pct}%`),
            kv('Fully Consumed by Merchant', c.merchantShare === 100 ? 'Yes' : 'No'),
            kv('Shared With Partners %', `${100 - c.merchantShare}%`),
            kv('Minimum Order Amount', fmtBDT0(c.minOrder)),
            kv('Max Discount Amount Per Transaction', fmtBDT0(c.max)),
            kv('Card Discount Amount', `${c.pct}% of order value`),
            kv('Recurrent Discount Limit Per User', `${c.perUser} time${c.perUser > 1 ? 's' : ''}`),
            kv('Remarks', c.kind === 'MFS' ? 'Applied at the MFS payment page' : 'Applied automatically at checkout for eligible cards'),
          ]))}
          ${section('Your Stores', c.stores.length ? `<div class="flex flex-wrap gap-2">${storeNames(c.stores).map(n => `<span class="px-2.5 py-1 rounded-full bg-slate-100 text-xs font-medium text-slate-700">${esc(n)}</span>`).join('')}</div>` : '<p class="text-sm text-slate-500">No stores enrolled.</p>')}
          ${perf.txns.length ? section('Performance', `
            <div class="grid grid-cols-3 gap-3 mb-3">${statBox('Payments', perf.txns.length)}${statBox('Sales', fmtBDTShort(perf.sales))}${statBox('Discount Given', fmtBDTShort(perf.discount), 'text-rose-600')}</div>
            ${miniTable(['Store', 'Payments', 'Sales', 'Discount'], byStore, { right: [1, 2, 3] })}
            <p class="text-[11px] text-slate-500 mt-2">You fund ${c.merchantShare}% of the discount: ${fmtBDT0(perf.discount * c.merchantShare / 100)} (mock).</p>`) : ''}
          ${section('Approval', timeline(steps))}`,
        footer: `
          ${c.participation === 'Created' ? `<button data-action="withdraw-partner" data-value="${c.id}" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-rose-600 bg-white border border-rose-200 rounded shadow-sm hover:bg-rose-50">${ic('x', 'w-4 h-4')}Withdraw Request</button>` : ''}
          ${canJoin(c) ? `<button data-action="join-partner" data-value="${c.id}" class="${BTN_PRIMARY}">${ic('circle-plus', 'w-4 h-4')}Join Campaign</button>` : ''}`,
      });
    }

    function joinDrawer() {
      const c = PARTNER_CAMPAIGNS.find(x => x.id === joinDraft.id);
      return drawerShell({
        title: `Join ${esc(c.partner)} ${esc(c.name)}`,
        sub: `<span>Enroll by ${fmtDate(c.confirm)}</span>`,
        body: `
          <div class="rounded-lg border border-slate-200 bg-slate-50 p-4 text-sm space-y-1">
            <p class="font-semibold text-slate-900">${offerText(c)} · min. order ${fmtBDT0(c.minOrder)}</p>
            <p class="text-slate-600">${esc(c.cards)} · ${periodText(c)}</p>
            <p class="text-slate-600">You fund <strong>${c.merchantShare}%</strong> of each discount; ${esc(c.partner)} funds ${100 - c.merchantShare}%.</p>
          </div>
          ${section('Stores to enroll', `<div class="space-y-2">
            ${STORES.map(st => `<label class="flex items-center gap-3 rounded-lg border border-slate-200 px-3 py-2.5 hover:bg-slate-50 cursor-pointer">
              <input type="checkbox" data-join-store="${st.id}" ${joinDraft.stores.includes(st.id) ? 'checked' : ''} class="rounded border-slate-300 text-primary-600">
              <span class="text-sm text-slate-800">${esc(st.name)}</span></label>`).join('')}
            ${formErrors.stores ? `<p class="text-[11px] font-medium text-rose-600">${formErrors.stores}</p>` : ''}
          </div>`)}
          <label class="flex items-start gap-2 text-sm text-slate-700">
            <input type="checkbox" data-join-agree ${joinDraft.agree ? 'checked' : ''} class="mt-0.5 rounded border-slate-300 text-primary-600">
            <span>I agree to fund ${c.merchantShare}% of the discount, deducted from my settlements for this campaign.</span>
          </label>
          ${formErrors.agree ? `<p class="text-[11px] font-medium text-rose-600 -mt-4">${formErrors.agree}</p>` : ''}
          <p class="text-xs text-slate-500">Your KAM reviews the request first, then ${esc(c.partner)} approves it.</p>`,
        footer: `
          <button data-action="close-drawer" class="${BTN_SECONDARY}">Cancel</button>
          <button data-action="submit-join" class="${BTN_PRIMARY}">${ic('send', 'w-4 h-4')}Send Request</button>`,
      });
    }

    // =====================================================================
    // Merchant Campaigns
    // =====================================================================
    const MC_STATUSES = ['Running', 'Pending', 'Created', 'Closed'];
    const methodSummary = (c) => [c.banks.length && `${c.banks.length} bank${c.banks.length > 1 ? 's' : ''}`, ...c.mfs, ...c.ib].filter(Boolean).join(' · ') || '—';

    function mcRows(s) {
      const q = s.search.trim().toLowerCase();
      return MERCHANT_CAMPAIGNS.filter(c =>
        (s.store === 'all' || c.stores.includes(s.store)) &&
        (s.status === 'all' || c.status === s.status) &&
        (!q || c.name.toLowerCase().includes(q) || c.tracking.toLowerCase().includes(q)) &&
        (s.range.preset === 'all' || (c.end >= s.range.from && c.start <= s.range.to)) // 'All Time' keeps upcoming campaigns
      ).sort((a, b) => b.start - a.start);
    }

    function renderMerchantCampaigns() {
      const s = pageState();
      const rows = mcRows(s);
      const all = MERCHANT_CAMPAIGNS.map(c => ({ c, perf: merchantPerf(c) }));
      const { totalPages, start, pageRows } = paginate(s, rows);
      const statusOpts = [{ label: 'All Status', value: 'all' }, ...MC_STATUSES.map(v => ({ label: v === 'Created' ? 'Created (draft)' : v, value: v }))];
      const cols = [
        { label: 'Campaign', cell: c => `<div class="font-medium text-slate-800">${esc(c.name)}</div><div class="text-[11px] font-mono text-slate-500">${c.tracking}</div>` },
        { label: 'Period', cell: c => { const p = phaseOf(c); const d = daysLeft(c.end); return `<div class="whitespace-nowrap">${periodText(c)}</div><div class="text-xs ${p === 'Running' ? 'text-emerald-600' : 'text-slate-500'}">${p === 'Running' ? `${d} day${d > 1 ? 's' : ''} left` : p === 'Upcoming' ? `Starts in ${daysLeft(c.start)} days` : 'Ended'}</div>`; } },
        { label: 'Discount', cell: c => `<div class="font-medium text-slate-800 whitespace-nowrap">${mcOfferText(c)}</div><div class="text-xs text-slate-500">min. ${fmtBDT0(c.minOrder)}</div>` },
        { label: 'Payment Methods', cls: 'hidden xl:table-cell', cell: c => `<span class="text-xs text-slate-600">${methodSummary(c)}</span>` },
        { label: 'Stores', cls: 'hidden lg:table-cell', cell: c => `<span class="text-xs text-slate-600">${c.stores.length === STORES.length ? 'All stores' : storeNames(c.stores).map(esc).join(', ')}</span>` },
        { label: 'Discount Given', right: true, cls: 'hidden xl:table-cell', cell: c => { const p = merchantPerf(c); return p.txns.length ? `<div class="font-semibold text-slate-900 whitespace-nowrap">${fmtBDT0(p.discount)}</div><div class="text-xs text-slate-500">${p.txns.length} payments</div>` : '<span class="text-slate-400">—</span>'; } },
        { label: 'Status', cell: c => mcBadge(c.status) },
      ];
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Merchant Campaigns</h1>
              <p class="text-slate-500 text-sm">Your own discounts on chosen cards, MFS and banks — funded by you, approved by your KAM.</p>
            </div>
            <button data-action="new-mc" class="${BTN_PRIMARY} shrink-0">${ic('plus', 'w-4 h-4')}Create Campaign</button>
          </div>
          <div class="flex flex-col">
            ${listFilterBar(s, 'Campaign name or Tracking Id', selectPill('list', 'status', 'Status', statusOpts, s.status, 'circle-dot'))}
            <div class="flex flex-col gap-4 pt-4">
              <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                ${metricCard({ title: 'Running', value: MERCHANT_CAMPAIGNS.filter(c => c.status === 'Running').length, status: 'Running', selected: s.status === 'Running' })}
                ${metricCard({ title: 'Pending Approval', value: MERCHANT_CAMPAIGNS.filter(c => c.status === 'Pending').length, status: 'Pending', selected: s.status === 'Pending' })}
                ${metricCard({ title: 'Discount Given', value: fmtBDTShort(all.reduce((n, x) => n + x.perf.discount, 0)), sub: `${all.reduce((n, x) => n + x.perf.txns.length, 0)} payments` })}
                ${metricCard({ title: 'Sales via Campaigns', value: fmtBDTShort(all.reduce((n, x) => n + x.perf.sales, 0)) })}
              </div>
            </div>
            <div class="space-y-4 pt-6">
              ${listToolbar(rows.length, 'campaigns', s)}
              ${dataTable({ cols, rows: pageRows, rowAttrs: c => `data-action="open-mc" data-value="${c.id}"`, emptyTitle: 'No campaigns found' })}
              ${pager(s, rows.length, start, pageRows.length, totalPages)}
            </div>
          </div>
        </div>`;
    }

    function mcDrawer(c) {
      const perf = merchantPerf(c);
      const chips = (title, list) => list.length ? `<div><p class="text-xs text-slate-500 mb-1.5">${title}</p><div class="flex flex-wrap gap-1.5">${list.map(n => `<span class="px-2 py-0.5 rounded-full bg-slate-100 text-xs text-slate-700">${esc(n)}</span>`).join('')}</div></div>` : '';
      const byStore = c.stores.map(id => { const l = perf.txns.filter(t => t.store === id); return [esc(STORES.find(s => s.id === id).name), l.length, fmtBDT0(l.reduce((s, t) => s + t.amount, 0)), fmtBDT0(l.reduce((s, t) => s + mcDiscountOf(c, t), 0))]; });
      const steps = [{ label: 'Campaign created', note: '', tone: 'slate' }];
      if (c.status !== 'Created') steps.push({ label: 'Submitted to KAM', note: '', tone: 'blue' });
      if (['Running', 'Closed'].includes(c.status)) steps.push({ label: 'Approved by KAM — live at checkout', at: c.start, tone: 'emerald' });
      if (c.status === 'Pending') steps.push({ label: 'Waiting for KAM approval', note: 'Usually within one working day (mock)', tone: 'amber' });
      if (c.status === 'Closed') steps.push({ label: 'Campaign closed', at: c.end < NOW ? c.end : NOW, tone: 'rose' });
      return drawerShell({
        wide: true,
        title: esc(c.name),
        sub: `<span class="font-mono text-xs">${c.tracking}</span>${mcBadge(c.status)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Discount', mcOfferText(c))}
            ${statBox('Payments', perf.txns.length)}
            ${statBox('Discount Given', fmtBDT0(perf.discount), perf.discount ? 'text-rose-600' : 'text-slate-900')}
          </div>
          ${section('Campaign Information', kvGrid([
            kv('Campaign Name', esc(c.name)),
            kv('Tracking Id', c.tracking, true),
            kv('Start Date', fmtDate(c.start)),
            kv('End Date', fmtDate(c.end)),
            kv('Minimum Order Amount', fmtBDT0(c.minOrder)),
            kv('Max Discount Per Transaction', fmtBDT0(c.max)),
            kv('Limit Per Customer', `${c.perUser} time${c.perUser > 1 ? 's' : ''}`),
            kv('Stores', storeNames(c.stores).map(esc).join(', ')),
            `<div class="col-span-2">${kv('Description', esc(c.description || '—'))}</div>`,
          ]))}
          ${section('Payment Methods', `<div class="space-y-3">${chips('Banks (cards)', c.banks)}${chips('Mobile Financial Services', c.mfs)}${chips('Internet Banking', c.ib)}</div>`)}
          ${perf.txns.length ? section('Performance by Store', miniTable(['Store', 'Payments', 'Sales', 'Discount'], byStore, { right: [1, 2, 3] })) : ''}
          ${section('Status', timeline(steps))}`,
        footer: `
          <button data-action="toast" data-msg="Prototype: duplicating is not wired up." class="${BTN_SECONDARY}">${ic('copy', 'w-4 h-4')}Duplicate</button>
          ${['Created', 'Pending'].includes(c.status) ? `<button data-action="toast" data-msg="Prototype: editing is not wired up." class="${BTN_SECONDARY}">${ic('pencil', 'w-4 h-4')}Edit</button>` : ''}
          ${c.status === 'Created' ? `<button data-action="mc-submit" data-value="${c.id}" class="${BTN_PRIMARY}">${ic('send', 'w-4 h-4')}Submit for Approval</button>` : ''}
          ${c.status === 'Running' ? `<button data-action="mc-close" data-value="${c.id}" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-rose-600 bg-white border border-rose-200 rounded shadow-sm hover:bg-rose-50">${ic('circle-stop', 'w-4 h-4')}Close Campaign</button>` : ''}`,
      });
    }

    let mcDraft = null;
    const MC_BANKS = ['BRAC Bank', 'City Bank', 'Dutch-Bangla Bank', 'Eastern Bank', 'Standard Chartered', 'Prime Bank'];
    const MC_MFS = ['bKash', 'Nagad', 'Rocket'];
    const MC_IB = ['City Touch'];
    const newMcDraft = () => ({ name: '', description: '', start: toDateInput(addDays(TODAY, 3)), end: toDateInput(addDays(TODAY, 17)), stores: [], banks: [], mfs: [], ib: [], type: 'Percentage', value: '', max: '', minOrder: '', perUser: '1' });

    function mcFormDrawer() {
      const d = mcDraft;
      const inp = (key, attrs = '') => `<input data-mc="${key}" value="${esc(d[key])}" class="${INPUT}" ${attrs}>`;
      const checks = (group, list, labelOf = (v) => v) => `<div class="flex flex-wrap gap-2">${list.map(v => `
        <label class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-xs cursor-pointer ${d[group].includes(v) ? 'border-primary-600 bg-primary-50 text-primary-700 font-semibold' : 'border-slate-200 text-slate-700 hover:bg-slate-50'}">
          <input type="checkbox" data-mc-check="${group}" value="${esc(v)}" ${d[group].includes(v) ? 'checked' : ''} class="sr-only">${d[group].includes(v) ? ic('check', 'w-3 h-3') : ''}${esc(labelOf(v))}</label>`).join('')}</div>`;
      return drawerShell({
        wide: true,
        title: 'Create Campaign',
        sub: '<span>Your KAM approves it before it goes live at checkout</span>',
        body: `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="sm:col-span-2">${field('Campaign Name', inp('name', 'placeholder="Enter campaign name"'), { required: true, error: formErrors.name })}</div>
            ${field('Start Date', inp('start', `type="date" min="${toDateInput(NOW)}"`), { required: true, error: formErrors.start })}
            ${field('End Date', inp('end', `type="date" min="${toDateInput(NOW)}"`), { required: true, error: formErrors.end })}
            <div class="sm:col-span-2">${field('Description', `<textarea data-mc="description" rows="2" class="${INPUT}" placeholder="Enter detailed description">${esc(d.description)}</textarea>`)}</div>
          </div>
          ${section('Stores', `${checks('stores', STORES.map(s => s.id), (id) => STORES.find(s => s.id === id).name)}${formErrors.stores ? `<p class="text-[11px] font-medium text-rose-600 mt-1">${formErrors.stores}</p>` : ''}`)}
          ${section('Discount', `<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            ${field('Discount Type', `<select data-mc="type" data-rerender class="${INPUT}">${options(['Percentage', 'Flat'], d.type)}</select>`)}
            ${field(d.type === 'Percentage' ? 'Discount (%)' : 'Discount (BDT)', inp('value', 'type="number" min="1"'), { required: true, error: formErrors.value })}
            ${d.type === 'Percentage' ? field('Max Discount Per Txn (BDT)', inp('max', 'type="number" min="1"'), { required: true, error: formErrors.max }) : '<div></div>'}
            ${field('Minimum Order (BDT)', inp('minOrder', 'type="number" min="0" placeholder="0"'))}
            ${field('Limit Per Customer', `<select data-mc="perUser" class="${INPUT}">${options([['1', 'Once'], ['2', '2 times'], ['3', '3 times'], ['5', '5 times']], d.perUser)}</select>`)}
          </div>`)}
          ${section('Payment Methods', `<div class="space-y-3">
            <div><p class="text-xs font-bold text-slate-700 mb-1.5">Banks (cards)</p>${checks('banks', MC_BANKS)}</div>
            <div><p class="text-xs font-bold text-slate-700 mb-1.5">Mobile Financial Services</p>${checks('mfs', MC_MFS)}</div>
            <div><p class="text-xs font-bold text-slate-700 mb-1.5">Internet Banking</p>${checks('ib', MC_IB)}</div>
            ${formErrors.methods ? `<p class="text-[11px] font-medium text-rose-600">${formErrors.methods}</p>` : ''}
          </div>`)}
          <p class="text-xs text-slate-500">The discount is funded by you and deducted from settlements for campaign payments.</p>`,
        footer: `
          <button data-action="close-drawer" class="${BTN_SECONDARY}">Cancel</button>
          <button data-action="save-mc" data-value="Created" class="${BTN_SECONDARY}">${ic('save', 'w-4 h-4')}Save as Draft</button>
          <button data-action="save-mc" data-value="Pending" class="${BTN_PRIMARY}">${ic('send', 'w-4 h-4')}Submit for Approval</button>`,
      });
    }

    function validateMc() {
      const d = mcDraft, e = {};
      if (!d.name.trim()) e.name = 'Enter a campaign name.';
      if (!d.start || d.start < toDateInput(NOW)) e.start = 'Pick today or a later date.';
      if (!d.end || d.end < d.start) e.end = 'End date must be on or after the start date.';
      if (!d.stores.length) e.stores = 'Choose at least one store.';
      const v = Number(d.value);
      if (!(v > 0) || (d.type === 'Percentage' && v > 90)) e.value = d.type === 'Percentage' ? 'Enter 1–90%.' : 'Enter an amount greater than 0.';
      if (d.type === 'Percentage' && !(Number(d.max) > 0)) e.max = 'Enter a maximum discount.';
      if (!d.banks.length && !d.mfs.length && !d.ib.length) e.methods = 'Choose at least one bank, MFS or internet banking option.';
      return e;
    }

    // =====================================================================
    // Campaign Calendar
    // =====================================================================
    const cal = { month: new Date(NOW.getFullYear(), NOW.getMonth(), 1), partner: true, merchant: true };
    const CAL_STYLE = {
      partner: 'background:#f0f4fa;border-left:3px solid #295cab',
      merchant: 'background:#fdf0ea;border-left:3px solid #eb6834',
    };

    function calendarItems() {
      return [
        ...(cal.partner ? PARTNER_CAMPAIGNS.filter(c => c.participation !== 'Rejected').map(c => ({ kind: 'partner', id: c.id, name: `${c.partner} ${c.name}`, start: c.start, end: c.end, sub: pBadge(c.participation), deadline: canJoin(c) ? c.confirm : null })) : []),
        ...(cal.merchant ? MERCHANT_CAMPAIGNS.map(c => ({ kind: 'merchant', id: c.id, name: c.name, start: c.start, end: c.end, sub: mcBadge(c.status), deadline: null })) : []),
      ].sort((a, b) => a.start - b.start);
    }

    function renderCampaignCalendar() {
      const first = cal.month;
      const offset = (first.getDay() + 1) % 7; // weeks start on Saturday
      const gridStart = addDays(first, -offset);
      const items = calendarItems();
      const DAYS = ['Sat', 'Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri'];
      const weeks = [];
      for (let w = 0; w < 6; w++) {
        const ws = addDays(gridStart, w * 7), we = endOfDay(addDays(ws, 6));
        if (w > 3 && ws.getMonth() !== first.getMonth()) break;
        const inWeek = items.filter(i => i.start <= we && i.end >= ws);
        const lanes = [];
        const bars = inWeek.map(i => {
          const s = Math.max(0, Math.round((startOfDay(i.start) - ws) / 864e5));
          const e = Math.min(6, Math.round((startOfDay(i.end) - ws) / 864e5));
          let lane = lanes.findIndex(end => end < s);
          if (lane === -1) { lane = lanes.length; lanes.push(e); } else lanes[lane] = e;
          return { ...i, s, e, lane };
        });
        weeks.push({ ws, bars, deadlines: items.filter(i => i.deadline && i.deadline >= ws && i.deadline <= we) });
      }
      const MAX_LANES = 3;
      const monthItems = items.filter(i => i.start <= endOfDay(new Date(first.getFullYear(), first.getMonth() + 1, 0)) && i.end >= first);
      const toggle = (key, label, color) => `<label class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-slate-200 bg-white text-xs font-medium text-slate-700 cursor-pointer hover:bg-slate-50">
        <input type="checkbox" data-cal-toggle="${key}" ${cal[key] ? 'checked' : ''} class="rounded border-slate-300 text-primary-600"><span class="w-2.5 h-2.5 rounded-sm" style="background:${color}"></span>${label}</label>`;
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Campaign Calendar</h1>
              <p class="text-slate-500 text-sm">Partner offers and your own campaigns on one timeline, with enrollment deadlines.</p>
            </div>
            <div class="flex items-center gap-2">${toggle('partner', 'Partnership', '#295cab')}${toggle('merchant', 'My campaigns', '#eb6834')}</div>
          </div>

          <div class="bg-white rounded-lg border border-slate-200 shadow-sm overflow-hidden">
            <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <button data-action="cal-nav" data-value="-1" class="p-1.5 rounded-md border border-slate-200 hover:bg-slate-50" title="Previous month">${ic('chevron-left', 'w-4 h-4')}</button>
                <button data-action="cal-nav" data-value="1" class="p-1.5 rounded-md border border-slate-200 hover:bg-slate-50" title="Next month">${ic('chevron-right', 'w-4 h-4')}</button>
                <h2 class="text-base font-semibold text-slate-900 ml-2">${['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][first.getMonth()]} ${first.getFullYear()}</h2>
              </div>
              <button data-action="cal-nav" data-value="0" class="px-3 py-1.5 text-xs font-medium text-slate-600 border border-slate-200 rounded-md hover:bg-slate-50">Today</button>
            </div>
            <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50">${DAYS.map(d => `<div class="px-2 py-2 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">${d}</div>`).join('')}</div>
            ${weeks.map(({ ws, bars, deadlines }) => `
              <div class="relative border-b border-slate-100 last:border-0">
                <div class="grid grid-cols-7">
                  ${Array.from({ length: 7 }, (_, i) => {
                    const day = addDays(ws, i);
                    const isToday = +startOfDay(day) === +TODAY;
                    const out = day.getMonth() !== first.getMonth();
                    const dl = deadlines.filter(x => +startOfDay(x.deadline) === +startOfDay(day));
                    const more = bars.filter(b => b.lane >= MAX_LANES && b.s <= i && b.e >= i).length;
                    return `<div class="min-h-[120px] border-r border-slate-100 last:border-0 p-1.5 ${out ? 'bg-slate-50/60' : ''}">
                      <div class="flex items-center justify-between">
                        <span class="text-xs font-semibold w-6 h-6 inline-flex items-center justify-center rounded-full ${isToday ? 'bg-primary-600 text-white' : out ? 'text-slate-300' : 'text-slate-700'}">${day.getDate()}</span>
                        ${dl.length ? `<span class="text-[10px] font-semibold text-amber-700 bg-amber-50 rounded px-1" title="${dl.map(x => `Enroll by today: ${esc(x.name)}`).join(', ')}">Enroll by</span>` : ''}
                      </div>
                      ${more ? `<p class="absolute bottom-1 text-[10px] text-slate-500" style="left:calc(${i} * 100% / 7 + 6px)">+${more} more</p>` : ''}
                    </div>`;
                  }).join('')}
                </div>
                <div class="absolute inset-x-0 top-8 grid grid-cols-7 gap-y-1 px-0.5 pointer-events-none">
                  ${bars.filter(b => b.lane < MAX_LANES).map(b => `
                    <button data-action="${b.kind === 'partner' ? 'open-partner' : 'open-mc'}" data-value="${b.id}"
                      class="pointer-events-auto mx-0.5 h-6 rounded text-left px-1.5 text-[11px] font-medium text-slate-800 truncate hover:brightness-95"
                      style="grid-column:${b.s + 1} / ${b.e + 2};grid-row:${b.lane + 1};${CAL_STYLE[b.kind]}" title="${esc(b.name)} · ${periodText(b)}">${esc(b.name)}</button>`).join('')}
                </div>
              </div>`).join('')}
          </div>

          ${anCard('This Month', `${monthItems.length} campaign${monthItems.length === 1 ? '' : 's'}`, monthItems.length ? `<div class="divide-y divide-slate-100 -my-2">${monthItems.map(i => `
            <button data-action="${i.kind === 'partner' ? 'open-partner' : 'open-mc'}" data-value="${i.id}" class="w-full flex items-center gap-3 py-2.5 text-left hover:bg-slate-50 rounded">
              <span class="w-1 self-stretch rounded" style="background:${i.kind === 'partner' ? '#295cab' : '#eb6834'}"></span>
              <span class="flex-1 min-w-0"><span class="block text-sm font-medium text-slate-800 truncate">${esc(i.name)}</span><span class="block text-xs text-slate-500">${periodText(i)} · ${i.kind === 'partner' ? 'Partnership' : 'My campaign'}${i.deadline ? ` · <span class="text-amber-700 font-medium">enroll by ${fmtShort(i.deadline)}</span>` : ''}</span></span>
              ${i.sub}${ic('chevron-right', 'w-4 h-4 text-slate-400')}
            </button>`).join('')}</div>` : '<p class="text-sm text-slate-500">No campaigns this month.</p>')}
        </div>`;
    }

    // =====================================================================
    // Support & Tickets — shared
    // =====================================================================
    const SUP = { txn: '/support/transaction-tickets', general: '/support/tickets-queries', service: '/support/service-delivery' };
    const TT_CLS = { Requested: 'bg-amber-50 text-amber-600', Solved: 'bg-emerald-50 text-emerald-600' };
    const GT_CLS = { Pending: 'bg-amber-50 text-amber-600', Processing: 'bg-blue-50 text-blue-600', Declined: 'bg-rose-50 text-rose-600', Completed: 'bg-emerald-50 text-emerald-600' };
    const SR_CLS = { Requested: 'bg-slate-100 text-slate-600', Approved: 'bg-blue-50 text-blue-600', 'In Progress': 'bg-amber-50 text-amber-600', Delivered: 'bg-emerald-50 text-emerald-600', Cancelled: 'bg-rose-50 text-rose-600' };
    const supBadge = (cls, s) => `<span class="${STATUS_BADGE} ${cls[s]}">${s}</span>`;
    const hoursText = (h) => h < 24 ? `${Math.round(h)} h` : `${(h / 24).toFixed(1)} days`;
    let ticketDraft = null;

    // Conversation shared by both ticket types; replies stay in page memory.
    function thread(kind, item, open) {
      return `
        <div class="space-y-3">
          ${item.messages.map(m => `
            <div class="flex ${m.from === 'merchant' ? 'justify-end' : 'justify-start'}">
              <div class="max-w-[85%] rounded-xl px-3.5 py-2.5 text-sm ${m.from === 'merchant' ? 'bg-primary-600 text-white rounded-br-sm' : 'bg-slate-100 text-slate-800 rounded-bl-sm'}">
                <p class="whitespace-pre-line">${esc(m.text)}</p>
                <p class="text-[10px] mt-1 ${m.from === 'merchant' ? 'text-white/70' : 'text-slate-500'}">${esc(m.name)} · ${fmtShort(m.at)}, ${fmtTime(m.at)}</p>
              </div>
            </div>`).join('')}
          ${open ? `
            <div class="pt-2">
              <textarea id="reply-text" rows="2" class="${INPUT}" placeholder="Write a reply to support…"></textarea>
              ${formErrors.reply ? `<p class="text-[11px] font-medium text-rose-600 mt-1">${formErrors.reply}</p>` : ''}
              <div class="flex justify-end mt-2"><button data-action="send-reply" data-kind="${kind}" data-value="${item.no}" class="${BTN_PRIMARY} py-1.5">${ic('send', 'w-4 h-4')}Send Reply</button></div>
            </div>` : '<p class="text-xs text-slate-500 text-center">This ticket is closed. Raise a new ticket if you need more help.</p>'}
        </div>`;
    }

    function kamCard() {
      return `
        <div class="bg-white rounded-lg border border-slate-200 shadow-sm p-5 flex items-center gap-4 flex-wrap">
          <div class="w-11 h-11 rounded-full bg-primary-50 text-primary-600 flex items-center justify-center">${ic('headset', 'w-5 h-5')}</div>
          <div class="flex-1 min-w-[200px]">
            <p class="text-sm font-semibold text-slate-900">Need help faster?</p>
            <p class="text-xs text-slate-500">Your KAM: Farzana (mock) · Support hotline [PLACEHOLDER] · Sat–Thu, 9 AM – 6 PM (mock)</p>
          </div>
          <a href="#/others/merchant-faq" class="text-xs font-semibold text-primary-600 hover:underline">Browse Merchant FAQ</a>
        </div>`;
    }

    // =====================================================================
    // Transaction Tickets
    // =====================================================================
    function ttRows(s, withStatus = true) {
      const q = s.search.trim().toLowerCase();
      return TXN_TICKETS.filter(t =>
        (s.store === 'all' || t.store === s.store) && inRange(t, s.range) &&
        (!q || t.no.toLowerCase().includes(q) || t.txn.id.toLowerCase().includes(q)) &&
        (!withStatus || s.status === 'all' || t.status === s.status));
    }

    function renderTxnTickets() {
      const s = pageState();
      const base = ttRows(s, false);
      const rows = ttRows(s);
      const { totalPages, start, pageRows } = paginate(s, rows);
      const solved = base.filter(t => t.status === 'Solved');
      const avgH = solved.length ? solved.reduce((n, t) => n + (t.feedbackOn - t.date) / 3600e3, 0) / solved.length : 0;
      const statusOpts = [{ label: 'All Status', value: 'all' }, { label: 'Requested', value: 'Requested' }, { label: 'Solved', value: 'Solved' }];
      const cols = [
        { label: 'Requested On', cell: t => dateCell(t.date) },
        { label: 'Ticket No', cell: t => idCell(t.no) },
        { label: 'Store', cls: 'hidden lg:table-cell', cell: t => esc(t.storeName) },
        { label: 'Transaction ID', cell: t => `<div class="font-mono text-xs text-slate-800">${t.txn.id}</div><div class="text-xs text-slate-500 whitespace-nowrap">${fmtBDT(t.txn.amount)} · ${t.txn.method}</div>` },
        { label: 'Query For', cls: 'hidden xl:table-cell', cell: t => `<div class="flex flex-wrap gap-1">${t.queries.map(q => `<span class="px-2 py-0.5 rounded bg-slate-100 text-[11px] text-slate-700">${q}</span>`).join('')}</div>` },
        { label: 'Status', cell: t => supBadge(TT_CLS, t.status) },
      ];
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Transaction Tickets</h1>
              <p class="text-slate-500 text-sm">Ask support about a specific payment — status, refund, settlement or a customer dispute.</p>
            </div>
            <button data-action="new-tt" class="${BTN_PRIMARY} shrink-0">${ic('plus', 'w-4 h-4')}Raise Ticket</button>
          </div>
          <div class="flex flex-col">
            ${listFilterBar(s, 'Ticket No or Transaction ID', selectPill('list', 'status', 'Status', statusOpts, s.status, 'circle-dot'))}
            <div class="flex flex-col gap-4 pt-4">
              <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                ${metricCard({ title: 'Total Tickets', value: base.length, status: 'all', selected: s.status === 'all' })}
                ${metricCard({ title: 'Pending Tickets', value: base.filter(t => t.status === 'Requested').length, status: 'Requested', selected: s.status === 'Requested' })}
                ${metricCard({ title: 'Solved Tickets', value: solved.length, status: 'Solved', selected: s.status === 'Solved' })}
                ${metricCard({ title: 'Avg. Resolution Time', value: solved.length ? hoursText(avgH) : '—' })}
              </div>
            </div>
            <div class="space-y-4 pt-6">
              ${listToolbar(rows.length, 'tickets', s)}
              ${dataTable({ cols, rows: pageRows, rowAttrs: t => `data-action="open-tt" data-value="${t.no}"`, emptyTitle: 'No tickets found' })}
              ${pager(s, rows.length, start, pageRows.length, totalPages)}
            </div>
          </div>
          ${kamCard()}
        </div>`;
    }

    function ttDrawer(t) {
      const x = t.txn;
      return drawerShell({
        wide: true,
        title: 'Transaction Ticket',
        sub: `<span class="font-mono text-xs">${t.no}</span>${supBadge(TT_CLS, t.status)}`,
        body: `
          <button data-action="open-txn" data-value="${x.id}" class="w-full flex items-center justify-between gap-3 rounded-lg border border-slate-200 px-4 py-3 text-left hover:bg-slate-50">
            <span><span class="block font-mono text-xs text-slate-800">${x.id}</span><span class="block text-xs text-slate-500">${fmtDate(x.date)}, ${fmtTime(x.date)} · ${x.method} <span class="font-mono">${x.account}</span></span></span>
            <span class="flex items-center gap-3"><span class="text-sm font-bold text-slate-900">${fmtBDT(x.amount)}</span>${badge(x.status)}${ic('chevron-right', 'w-4 h-4 text-slate-400')}</span>
          </button>

        (!withStatus || s.status === 'all' || (s.status === 'open' ? ['Pending', 'Processing'].includes(t.status) : t.status === s.status)));
    }

      const s = pageState();
      const base = gtRows(s, false);
      const rows = gtRows(s);
      const { totalPages, start, pageRows } = paginate(s, rows);
      const firstReply = base.filter(t => t.messages.length > 1).map(t => (t.messages[1].at - t.date) / 3600e3);

      const cols = [
        { label: 'Created On', cell: t => dateCell(t.date) },

        { label: 'Ticket No', cell: t => `<span class="font-mono text-xs text-slate-800">${t.no}</span>` },

        { label: 'Attachment', cls: 'hidden xl:table-cell', cell: t => t.attachment ? `<span class="inline-flex items-center gap-1 text-xs text-slate-600">${ic('paperclip', 'w-3.5 h-3.5')}${esc(t.attachment)}</span>` : '<span class="text-slate-400">—</span>' },

      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4">

              <h1 class="text-2xl font-bold text-slate-900">Tickets & Queries</h1>

              selectPill('list', 'stype', 'Issue Type', typeOpts, s.stype, 'tag'))}

              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">

                ${metricCard({ title: 'Completed', value: base.filter(t => t.status === 'Completed').length, status: 'Completed', selected: s.status === 'Completed' })}

      return drawerShell({

        sub: `<span class="font-mono text-xs">${t.no}</span>${supBadge(GT_CLS, t.status)}`,
        body: `
          ${section('Ticket', kvGrid([
            kv('Ticket No', t.no, true),
            kv('Title', esc(t.title)),
            kv('Issue Type', t.type),
            kv('Status', supBadge(GT_CLS, t.status)),

    function gtFormDrawer() {
      const d = ticketDraft;
      return drawerShell({
        title: 'New Ticket',
        sub: '<span>For questions about a specific payment, use Transaction Tickets</span>',
        body: `
          ${field('Title', `<input data-ticket="title" value="${esc(d.title)}" placeholder="Short summary" class="${INPUT}">`, { required: true, error: formErrors.title })}
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${field('Issue Type', `<select data-ticket="type" class="${INPUT}">${options([['', 'Select one'], ...ISSUE_TYPES.map(v => [v, v])], d.type)}</select>`, { required: true, error: formErrors.type })}
            ${field('Store', `<select data-ticket="store" class="${INPUT}">${options([['', 'All / not store-specific'], ...STORES.map(st => [st.id, st.name])], d.store)}</select>`)}

      });
