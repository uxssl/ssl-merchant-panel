    // =====================================================================
    // Service Delivery
    // =====================================================================
    const srOnTime = (r) => r.stage === 'Delivered' && r.stageAt[3] <= r.due;
    function srDue(r) {
      if (r.stage === 'Delivered') return srOnTime(r) ? { text: 'Delivered on time', cls: 'text-emerald-600' } : { text: 'Delivered late', cls: 'text-rose-600' };
      if (r.stage === 'Cancelled') return { text: 'Cancelled', cls: 'text-slate-500' };
      const d = Math.ceil((r.due - NOW) / 864e5);
      return d < 0 ? { text: `${-d} day${d < -1 ? 's' : ''} overdue`, cls: 'text-rose-600' } : { text: d === 0 ? 'Due today' : `${d} day${d > 1 ? 's' : ''} left`, cls: d <= 1 ? 'text-amber-600' : 'text-slate-500' };
    }
    const srDots = (r) => `<div class="flex items-center gap-1" title="${r.stage}">${SERVICE_STAGES.map((_, i) => `<span class="w-2 h-2 rounded-full ${r.stageIndex >= i ? (r.stageIndex === 3 ? 'bg-emerald-500' : 'bg-primary-600') : 'bg-slate-200'}"></span>`).join('')}</div>`;

    function srRows(s, withStatus = true) {
      const q = s.search.trim().toLowerCase();
      return SERVICE_REQUESTS.filter(r =>
        (s.store === 'all' || r.store === s.store) && (s.stype === 'all' || r.type === s.stype) && inRange(r, s.range) &&
        (!q || r.no.toLowerCase().includes(q) || r.type.toLowerCase().includes(q)) &&
        (!withStatus || s.status === 'all' || (s.status === 'open' ? ['Requested', 'Approved', 'In Progress'].includes(r.stage) : r.stage === s.status)));
    }

    function renderServiceDelivery() {
      const s = pageState();
      const base = srRows(s, false);
      const rows = srRows(s);
      const { totalPages, start, pageRows } = paginate(s, rows);
      const delivered = base.filter(r => r.stage === 'Delivered');
      const avgDays = delivered.length ? delivered.reduce((n, r) => n + (r.stageAt[3] - r.date) / 864e5, 0) / delivered.length : 0;
      const statusOpts = [{ label: 'All Status', value: 'all' }, { label: 'Open', value: 'open' }, ...Object.keys(SR_CLS).map(v => ({ label: v, value: v }))];
      const typeOpts = [{ label: 'All Services', value: 'all' }, ...SERVICE_TYPES.map(t => ({ label: t.v, value: t.v }))];
      const cols = [
        { label: 'Request No', cell: r => `<span class="font-mono text-xs text-slate-800">${r.no}</span>` },
        { label: 'Service', cell: r => `<div class="font-medium text-slate-800">${r.type}</div><div class="text-xs text-slate-500">${r.qty > 1 ? `Qty ${r.qty} · ` : ''}<span class="lg:hidden">${esc(r.storeName)}</span><span class="hidden lg:inline">${r.assignee}</span></div>` },
        { label: 'Store', cls: 'hidden lg:table-cell', cell: r => esc(r.storeName) },
        { label: 'Requested On', cls: 'hidden xl:table-cell', cell: r => dateCell(r.date) },
        { label: 'Due By', cell: r => { const d = srDue(r); return `<div class="whitespace-nowrap">${fmtDate(r.due)}</div><div class="text-xs font-medium ${d.cls}">${d.text}</div>`; } },
        { label: 'Progress', cell: r => `${srDots(r)}<div class="mt-1">${supBadge(SR_CLS, r.stage)}</div>` },
      ];
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Service Delivery</h1>
              <p class="text-slate-500 text-sm">Track service requests — QR standees, POS setup, store activation, integration help — against their delivery time.</p>
            </div>
            <button data-action="new-sr" class="${BTN_PRIMARY} shrink-0">${ic('plus', 'w-4 h-4')}Request Service</button>
          </div>
          <div class="flex flex-col">
            ${listFilterBar(s, 'Request No or Service',
              selectPill('list', 'status', 'Status', statusOpts, s.status, 'circle-dot') +
              selectPill('list', 'stype', 'Service', typeOpts, s.stype, 'package'))}
            <div class="flex flex-col gap-4 pt-4">
              <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                ${metricCard({ title: 'Open Requests', value: base.filter(r => ['Requested', 'Approved', 'In Progress'].includes(r.stage)).length, status: 'open', selected: s.status === 'open' })}
                ${metricCard({ title: 'Delivered', value: delivered.length, status: 'Delivered', selected: s.status === 'Delivered' })}
                ${metricCard({ title: 'On-time Delivery', value: delivered.length ? fmtPct(pct(delivered.filter(srOnTime).length, delivered.length)) : '—', sub: 'within the promised time' })}
                ${metricCard({ title: 'Avg. Delivery Time', value: delivered.length ? `${avgDays.toFixed(1)} days` : '—' })}
              </div>
            </div>
            <div class="space-y-4 pt-6">
              ${listToolbar(rows.length, 'requests', s)}
              ${dataTable({ cols, rows: pageRows, rowAttrs: r => `data-action="open-sr" data-value="${r.no}"`, emptyTitle: 'No service requests found' })}
              ${pager(s, rows.length, start, pageRows.length, totalPages)}
            </div>
          </div>
          ${anCard('Promised Delivery Time', 'Working days from request (mock)', `<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-3">${SERVICE_TYPES.map(t => statBox(t.v, `${t.sla} days`)).join('')}</div>`)}
        </div>`;
    }

    function srDrawer(r) {
      const d = srDue(r);
      const steps = r.stage === 'Cancelled'
        ? [{ label: 'Requested', at: r.date, tone: 'blue' }, { label: 'Request cancelled', note: 'Contact your KAM to request again', tone: 'rose' }]
        : SERVICE_STAGES.map((label, i) => r.stageIndex >= i
          ? { label: i === 3 ? `Delivered${srOnTime(r) ? '' : ' (late)'}` : label, at: r.stageAt[i], tone: i === 3 ? (srOnTime(r) ? 'emerald' : 'rose') : 'blue' }
          : { label, note: 'Pending', tone: 'slate' });
      const stars = (n) => [1, 2, 3, 4, 5].map(i => `<button data-action="rate-sr" data-value="${r.no}" data-rating="${i}" ${r.rating ? 'disabled' : ''} class="p-0.5 ${i <= (n || 0) ? 'text-amber-500' : 'text-slate-300'} ${r.rating ? '' : 'hover:text-amber-400'}" title="${i} star${i > 1 ? 's' : ''}">${ic('star', 'w-5 h-5')}</button>`).join('');
      return drawerShell({
        title: r.type,
        sub: `<span class="font-mono text-xs">${r.no}</span>${supBadge(SR_CLS, r.stage)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Promised', `${r.sla} days`)}
            ${statBox('Due By', fmtShort(r.due))}
            ${statBox('Status', `<span class="text-sm ${d.cls}">${d.text}</span>`)}
          </div>
          ${section('Request', kvGrid([
            kv('Request No', r.no, true),
            kv('Service', r.type),
            kv('Store', esc(r.storeName)),
            kv('Quantity', r.qty),
            kv('Requested On', `${fmtDate(r.date)}, ${fmtTime(r.date)}`),

          ${section('Progress', timeline(steps))}
          ${r.stage === 'Delivered' ? section('Rate this service', `<div class="flex items-center gap-1">${stars(r.rating)}<span class="ml-2 text-xs text-slate-500">${r.rating ? `You rated ${r.rating} of 5` : 'How was the delivery?'}</span></div>`) : ''}`,
        footer: `
          ${['Requested', 'Approved'].includes(r.stage) ? `<button data-action="cancel-sr" data-value="${r.no}" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-rose-600 bg-white border border-rose-200 rounded shadow-sm hover:bg-rose-50">${ic('x', 'w-4 h-4')}Cancel Request</button>` : ''}
          <button data-action="close-drawer" class="${BTN_SECONDARY}">Close</button>`,
      });
    }

    function srFormDrawer() {
      const d = ticketDraft;
      const sla = SERVICE_TYPES.find(t => t.v === d.type)?.sla;

          ${field('Store', `<select data-ticket="store" class="${INPUT}">${options(STORES.map(st => [st.id, st.name]), d.store)}</select>`, { required: true })}
          ${['QR Standee Delivery', 'Branding Materials'].includes(d.type) ? field('Quantity', `<input data-ticket="qty" type="number" min="1" max="50" value="${esc(d.qty)}" class="${INPUT}">`, { error: formErrors.qty }) : ''}
          ${field('Notes', `<textarea data-ticket="text" rows="3" class="${INPUT}" placeholder="(optional) Contact person, preferred time…">${esc(d.text)}</textarea>`)}
          ${sla ? `<p class="text-xs text-slate-600 bg-slate-50 border border-slate-100 rounded px-3 py-2">Expected by <strong>${fmtDate(addDays(TODAY, sla))}</strong> (${sla} days, mock).</p>` : ''}`,

    // =====================================================================
    // Account & Settings
    // =====================================================================
    const ACC = { myStores: '/account/my-stores', storeList: '/account/store-list', groups: '/account/store-groups', users: '/account/user-management', password: '/account/change-password' };
    const accStore = (id) => ACCOUNT_STORES.find(s => s.id === id);
    const groupOf = (id) => STORE_GROUPS.find(g => g.id === id);
    const storeTypeIcon = (type) => type === 'Only QR' ? 'qr-code' : type === 'Only Online' ? 'globe' : 'store';
    let groupDraft = null;
    let userDraft = null;

    function storeStats(id) {
      const ok = TXNS.filter(t => t.store === id && t.status === 'success');
      const monthStart = new Date(NOW.getFullYear(), NOW.getMonth(), 1);
      const last30 = TXNS.filter(t => t.store === id && t.date >= addDays(TODAY, -29));
      const lastPaid = SETTLEMENTS.find(x => x.store === id && x.status === 'Paid');
      return {
        today: ok.filter(t => t.date >= TODAY).reduce((s, t) => s + t.amount, 0),
        month: ok.filter(t => t.date >= monthStart).reduce((s, t) => s + t.amount, 0),
        rate: last30.length ? pct(last30.filter(t => t.status === 'success').length, last30.length) : null,
        lastPaid,
      };
    }

    // ----- My Stores --------------------------------------------------------
    function renderMyStores() {
      const active = ACCOUNT_STORES.filter(s => s.status === 'Active');
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">My Stores</h1>

              return `
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col">
                  <div class="px-5 py-4 border-b border-slate-100 flex items-start gap-3">
                    <span class="w-10 h-10 rounded-lg bg-primary-50 text-primary-600 flex items-center justify-center shrink-0">${ic(storeTypeIcon(st.type), 'w-5 h-5')}</span>
                    <div class="min-w-0 flex-1">
                      <p class="text-sm font-semibold text-slate-900 truncate">${esc(st.name)}</p>
                      <p class="text-xs text-slate-500"><span class="font-mono">${st.id}</span> · ${st.type} · ${st.currency}</p>
                    </div>
                    ${activeBadge(true)}
                  </div>

    function validateUser() {
      const d = userDraft, e = {};
      if (!d.name.trim()) e.name = 'Enter the user name.';
      if (!/^01[3-9]\d{8}$/.test(d.mobile.trim())) e.mobile = 'Enter an 11-digit mobile number starting with 01.';
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) e.email = 'Enter a valid email address.';
      if (!/^[a-z0-9_]{4,30}$/.test(d.login.trim())) e.login = 'Use 4–30 lowercase letters, numbers or _.';
      else if (USERS.some(u => u.login === d.login.trim())) e.login = 'This login name is already taken.';
      if (!d.role) e.role = 'Choose a role.';
      const ips = d.ips.split(',').map(x => x.trim()).filter(Boolean);
      if (ips.some(ip => !/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}$/.test(ip))) e.ips = 'Enter IPv4 addresses separated by commas.';
      return e;
    }

    // ----- Change Password -------------------------------------------------
    // Rules from the KAM panel's Password Character Policy. "Repeated characters" is read as
    // the same character twice in a row (e.g. "aa") — confirm with the security team.
    const PASSWORD_RULES = [
      { text: 'Password length must be more/equal to 12 characters', test: (p) => p.length >= 12 },
      { text: 'It must contain minimum a character is UPPERCASE [A-Z]', test: (p) => /[A-Z]/.test(p) },
      { text: 'It must contain minimum a character is LOWERCASE [a-z]', test: (p) => /[a-z]/.test(p) },
      { text: 'It must contain minimum a NUMBER [1-0]', test: (p) => /\d/.test(p) },
      { text: 'It must contain minimum a special character, except ` and ^ and Space', test: (p) => /[^A-Za-z0-9`^\s]/.test(p) && !/[`^\s]/.test(p) },
      { text: 'It must not contain repeated characters.', test: (p) => p.length > 0 && !/(.)\1/.test(p) },
    ];
    const PASSWORD_CHANGE_POLICY = [
      'Password must be changed within 90 days.',
      'From 80th to 90th, user will get alert to change password.',

    // Updates the rule checklist and meter in place; passwords are only read from the inputs, never stored.
    function syncPasswordRules() {
      const p = $('#pw-new')?.value || '';
      let passed = 0;
      document.querySelectorAll('#pw-rules [data-rule]').forEach(li => {
        const ok = PASSWORD_RULES[Number(li.dataset.rule)].test(p);
        if (ok) passed++;
        li.classList.toggle('text-emerald-700', ok);
        li.classList.toggle('text-slate-600', !ok);
        const icon = li.querySelector('[data-rule-icon]');
        icon.className = `mt-0.5 shrink-0 ${ok ? 'text-emerald-600' : 'text-slate-300'}`;
        icon.innerHTML = ic(ok ? 'circle-check' : 'circle', 'w-3.5 h-3.5');
      });
      lucide.createIcons();
      const levels = [['—', '#e2e8f0'], ['Weak', '#f43f5e'], ['Weak', '#f43f5e'], ['Fair', '#f59e0b'], ['Fair', '#f59e0b'], ['Good', '#3987e5'], ['Strong', '#059669']];
      const [label, color] = p ? levels[passed] : levels[0];
      $('#pw-meter').style.width = `${p ? passed / PASSWORD_RULES.length * 100 : 0}%`;
      $('#pw-meter').style.background = color;
      $('#pw-meter-label').textContent = `Strength: ${label} · ${passed} of ${PASSWORD_RULES.length} rules met`;
    }

      const el = document.createElement('div');

      el.innerHTML = `${ic(type === 'success' ? 'circle-check' : 'info', `w-4 h-4 ${type === 'success' ? 'text-emerald-600' : 'text-primary-600'}`)}<span>${esc(msg)}</span>`;
      $('#toast-root').appendChild(el);
      lucide.createIcons();
      setTimeout(() => el.remove(), 2800);

      'cal-nav': (el) => {
        const step = Number(el.dataset.value);
        cal.month = step === 0 ? new Date(NOW.getFullYear(), NOW.getMonth(), 1) : new Date(cal.month.getFullYear(), cal.month.getMonth() + step, 1);
        render();
      },
      'open-link': (el) => { drawer = { kind: 'link', item: PAYMENT_LINKS.find(l => l.ref === el.dataset.value) }; renderDrawer(); },
      'open-invoice': (el) => { drawer = { kind: 'invoice', item: INVOICES.find(i => i.no === el.dataset.value) }; renderDrawer(); },
      'open-emi': (el) => { drawer = { kind: 'emi', item: EMI_REQUESTS.find(e => e.ref === el.dataset.value) }; renderDrawer(); },
      'new-link': () => { linkDraft = newLinkDraft(); formErrors = {}; drawer = { kind: 'link-new', item: null }; renderDrawer(); },
      'save-link': () => {
        const d = linkDraft;
        formErrors = {};
        if (!d.name.trim()) formErrors.name = 'Enter a payment name.';
        if (d.amountType === 'Fixed' && !(Number(d.amount) > 0)) formErrors.amount = 'Enter an amount greater than 0.';
        if (d.convOn && !(Number(d.convFee) > 0 && Number(d.convFee) <= 10)) formErrors.convFee = 'Enter a fee between 0.1 and 10.';
        if (Object.keys(formErrors).length) { renderDrawer(); return; }
        const store = STORES.find(st => st.id === d.store);
        const link = {
          ref: alnum(13), name: d.name.trim(), store: store.id, storeName: store.name, date: new Date(NOW), // NOW keeps it inside 'All Time'
          payType: 'Payment Link', paymentType: d.paymentType, amountType: d.amountType,
          amount: d.amountType === 'Fixed' ? Number(d.amount) : null, amountText: d.amountText,
          convFee: d.convOn ? Number(d.convFee) : 0, buttonName: d.buttonName || 'Pay Now',
          productDetails: d.productDetails, topMessage: d.topMessage, buttonMessage: d.buttonMessage,
          domainUrl: '', colors: { ...d.colors }, active: true, payments: [],
        };
        PAYMENT_LINKS.unshift(link);
        linkDraft = null;
        drawer = { kind: 'link', item: link };
        renderDrawer(); render();
        toast('Payment link created (prototype — saved in this page only)', 'success');
      },
      'link-toggle': (el) => {
        const l = PAYMENT_LINKS.find(x => x.ref === el.dataset.value);
        l.active = !l.active;
        renderDrawer(); render();
        toast(`Link ${l.active ? 'activated' : 'deactivated'} (prototype)`, 'success');
      },
      'new-invoice': () => { invDraft = newInvoiceDraft(); formErrors = {}; drawer = { kind: 'invoice-new', item: null }; renderDrawer(); },
      'inv-add-item': () => { invDraft.items.push({ desc: '', qty: '1', price: '' }); renderDrawer(); },
      'inv-remove-item': (el) => { invDraft.items.splice(Number(el.dataset.value), 1); renderDrawer(); },
      'save-invoice': (el) => {
        formErrors = validateInvoice();
        if (Object.keys(formErrors).length) { renderDrawer(); return; }
        const d = invDraft;
        const store = STORES.find(st => st.id === d.store);
        const phone = d.phone.trim();
        const email = d.email.trim();
        const inv = {
          no: `INV-${NOW.getFullYear()}-${1040 + INVOICES.length}`, ref: alnum(13), store: store.id, storeName: store.name,
          // Only masked contact details are kept, the same as the rest of the portal.
          customer: d.customer.trim(), phone: `01•••••${phone.slice(-3)}`, email: email ? `${email[0]}•••••@${email.split('@')[1]}` : '—',
          date: new Date(NOW), due: endOfDay(new Date(`${d.due}T00:00`)), vatRate: Number(d.vatRate) || 0, notes: d.notes.trim(),
          items: d.items.filter(it => it.desc.trim() && Number(it.qty) > 0 && Number(it.price) > 0).map(it => ({ desc: it.desc.trim(), qty: Number(it.qty), price: Number(it.price) })),
          status: el.dataset.value, viewed: false,
        };
        INVOICES.unshift(inv);
        invDraft = null; formErrors = {};
        drawer = { kind: 'invoice', item: inv };
        renderDrawer(); render();
        toast(inv.status === 'Sent' ? 'Invoice created — prototype, no SMS or email was sent' : 'Invoice saved as draft (prototype)', 'success');
      },
      'invoice-send': (el) => {
        const inv = INVOICES.find(i => i.no === el.dataset.value);
        inv.status = NOW > inv.due ? 'Overdue' : 'Sent';
        renderDrawer(); render();
        toast('Marked as sent — prototype, no SMS or email was sent', 'success');
      },
      'invoice-cancel': (el) => {
        INVOICES.find(i => i.no === el.dataset.value).status = 'Cancelled';
        renderDrawer(); render();
        toast('Invoice cancelled (prototype)', 'success');
      },
      'qr-generate': () => {
        qrGen.store = $('#qr-store').value;
        qrGen.amount = $('#qr-amount').value;
        const amount = Number(qrGen.amount);
        qrGen.error = amount >= 1 && amount <= 500000 ? '' : 'Enter an amount between ৳1 and ৳500,000.';
        qrGen.result = qrGen.error ? null : { store: qrGen.store, amount, ref: `DQR${alnum(8)}`, at: new Date() };
        render();
      },
      'qr-txns': (el) => {
        Object.assign(txnState('bangla-qr'), { search: '', status: 'all', store: el.dataset.value, range: makeRange('today'), page: 1 });
        location.hash = '#/transactions/bangla-qr';
      },
      'an-preset': (el) => { an.preset = el.dataset.value; render(); },
      'an-export': () => { if (anExport) downloadCsv(anExport.name, anExport.header, anExport.rows); },
      'emi-tab': (el) => { emiTab = el.dataset.value; openDD = null; render(); },
      'track': () => { tracking.query = $('#track-input').value; runTracking(); render(); },
      'track-sample': (el) => { tracking.query = el.dataset.value; runTracking(); render(); },
      'cb-needs-response': () => {
        const s = pageState();
        Object.assign(s, { status: 'action', range: makeRange('all'), page: 1 });
        render();
      },
      'goto-list': (el) => {
        const s = (listStates[el.dataset.path] ||= defaultListState('30d'));
        Object.assign(s, { search: '', status: el.dataset.status, range: makeRange('all'), page: 1 });
        location.hash = '#' + el.dataset.path;
      },
      'dash-preset': (el) => { dash.preset = el.dataset.value; render(); },
      'goto-txn': (el) => {
        const s = txnState('all');
        Object.assign(s, { search: '', range: makeRange(dash.preset), status: el.dataset.status, method: 'all', store: dash.store, page: 1 });
        location.hash = '#/transactions/all';
      },
    };

    document.addEventListener('click', (e) => {
      const el = e.target.closest('[data-action]');
      if (el && actions[el.dataset.action]) actions[el.dataset.action](el, e);
    });

    document.addEventListener('mousedown', (e) => {
      if (openDD && !e.target.closest('[data-dd-root]')) { openDD = null; dtDraft = null; render(); }
      if (userMenuOpen && !e.target.closest('[data-user-root]')) { userMenuOpen = false; renderHeader(); lucide.createIcons(); }
    });

    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'track-input') tracking.query = t.value;
      if (t.id === 'qr-amount') qrGen.amount = t.value;
      if (t.id === 'emi-calc-amount') { emiCalc.amount = t.value; $('#emi-calc-result').innerHTML = emiCalcResult(); }
      if (t.dataset.link && linkDraft && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
        linkDraft[t.dataset.link] = t.value;
        $('#link-preview').innerHTML = payPagePreview(linkDraft);
      }
      if (t.dataset.linkColor && linkDraft) { linkDraft.colors[t.dataset.linkColor] = t.value; $('#link-preview').innerHTML = payPagePreview(linkDraft); }
      if (t.dataset.inv && invDraft && t.tagName !== 'SELECT') invDraft[t.dataset.inv] = t.value;
      if (t.dataset.mc && mcDraft && t.tagName !== 'SELECT') mcDraft[t.dataset.mc] = t.value;
      if (t.dataset.group && groupDraft) groupDraft[t.dataset.group] = t.value;
      if (t.dataset.other && otherDraft) otherDraft[t.dataset.other] = t.value;
      if (t.id === 'fx-amount') { fx.amount = t.value; $('#fx-result').innerHTML = fxResult(); }
      if (t.id === 'faq-search') { faqState.q = t.value; faqState.open = null; $('#faq-list').innerHTML = faqList(); lucide.createIcons(); }
      if (t.id === 'learn-search') { learn.q = t.value; render(); }
      if (t.dataset.user && userDraft && t.tagName !== 'SELECT') userDraft[t.dataset.user] = t.value;
      if (t.id === 'pw-new') syncPasswordRules();
      if (['pw-old', 'pw-new', 'pw-confirm'].includes(t.id)) setPwError(t.id, '');
      if (t.dataset.ticket && ticketDraft && t.tagName !== 'SELECT') {
        ticketDraft[t.dataset.ticket] = t.value;
        if (t.dataset.ticket === 'txnId') $('#tt-lookup').innerHTML = ttLookup(t.value);
      }
      if (t.dataset.invItem && invDraft) {
        const [i, key] = t.dataset.invItem.split(':');
        invDraft.items[Number(i)][key] = t.value;
        syncInvoiceTotals();
      }
      if (e.target.id === 'txn-search' || e.target.id === 'list-search') {
        const s = pageState();
        s.search = e.target.value; s.page = 1;
        render();
      }
    });

    document.addEventListener('change', (e) => {
      const t = e.target;
      if (t.dataset.dt && dtDraft) {
        dtDraft[t.dataset.dt] = t.value;
        // Changing the daily window keeps the chosen days; anything else is a custom range.
        if (dtDraft.mode !== 'daily' || t.type === 'date') dtDraft.preset = 'custom';
        syncDtPopover();
      }
      if (t.dataset.change === 'page-size') { const s = pageState(); s.pageSize = Number(t.value); s.page = 1; render(); }
      if (t.id === 'qr-store') qrGen.store = t.value;
      if (t.id === 'emi-calc-bank') { emiCalc.bank = t.value; $('#emi-calc-result').innerHTML = emiCalcResult(); }
      if (t.dataset.link && linkDraft && (t.type === 'checkbox' || t.tagName === 'SELECT')) {
        linkDraft[t.dataset.link] = t.type === 'checkbox' ? t.checked : t.value;
        if (t.hasAttribute('data-rerender')) renderDrawer(); else $('#link-preview').innerHTML = payPagePreview(linkDraft);
      }
      if (t.dataset.inv && invDraft && t.tagName === 'SELECT') { invDraft[t.dataset.inv] = t.value; syncInvoiceTotals(); }
      if (t.dataset.mc && mcDraft && t.tagName === 'SELECT') { mcDraft[t.dataset.mc] = t.value; if (t.hasAttribute('data-rerender')) renderDrawer(); }
      if (t.dataset.mcCheck && mcDraft) {
        const list = mcDraft[t.dataset.mcCheck];
        t.checked ? list.push(t.value) : list.splice(list.indexOf(t.value), 1);
        renderDrawer();
      }
      if (t.dataset.joinStore && joinDraft) {
        const list = joinDraft.stores;
        t.checked ? list.push(t.dataset.joinStore) : list.splice(list.indexOf(t.dataset.joinStore), 1);
      }
      if (t.hasAttribute('data-join-agree') && joinDraft) joinDraft.agree = t.checked;
      if (t.dataset.calToggle) { cal[t.dataset.calToggle] = t.checked; render(); }
      if (t.dataset.user && userDraft && t.tagName === 'SELECT') userDraft[t.dataset.user] = t.value;
      if (t.id === 'fx-code') { fx.code = t.value; $('#fx-result').innerHTML = fxResult(); }
      if (t.dataset.otherRadio && otherDraft) { otherDraft[t.dataset.otherRadio] = t.value; renderDrawer(); }
      if (t.id === 'sms-alert') { sms.lowAlert = t.checked; render(); }
      if (t.id === 'sms-threshold') { sms.threshold = Number(t.value); render(); }
      if (t.dataset.groupStore && groupDraft) {
        const list = groupDraft.stores;
        t.checked ? list.push(t.dataset.groupStore) : list.splice(list.indexOf(t.dataset.groupStore), 1);
      }
      if (t.dataset.ticket && ticketDraft && t.tagName === 'SELECT') { ticketDraft[t.dataset.ticket] = t.value; if (t.hasAttribute('data-rerender')) renderDrawer(); }
      if (t.hasAttribute('data-ticket-query') && ticketDraft) {
        t.checked ? ticketDraft.queries.push(t.value) : ticketDraft.queries.splice(ticketDraft.queries.indexOf(t.value), 1);
      }
      if (t.hasAttribute('data-ticket-file') && ticketDraft) { ticketDraft.attachment = t.files[0]?.name || null; renderDrawer(); }
    });

    document.addEventListener('keydown', (e) => {
      const t = e.target;
      if (e.key === 'Enter' && t.id === 'track-input') { tracking.query = t.value; runTracking(); render(); return; }
      if ((e.key === 'Enter' || e.key === ' ') && t.getAttribute?.('role') === 'button' && t.dataset.action) { e.preventDefault(); t.click(); return; }
      if (e.key === 'Tab' && drawer) {
        // Keep focus inside the open drawer.
        const items = [...$('#drawer-panel').querySelectorAll('button:not([disabled]), a[href], input:not([disabled]), select, textarea, [tabindex="0"]')].filter(x => x.offsetParent !== null);
        if (!items.length) return;
        const first = items[0], last = items[items.length - 1];
        if (!$('#drawer-panel').contains(document.activeElement)) { e.preventDefault(); first.focus(); }
        else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
        return;
      }
      if (e.key !== 'Escape') return;
      if (drawer) closeDrawer();
      else if (openDD) { const key = openDD; openDD = null; dtDraft = null; render(); document.querySelector(`[data-key="${key}"]`)?.focus(); }
      else if (userMenuOpen) { userMenuOpen = false; renderHeader(); lucide.createIcons(); }
      else if (mobileNav) { mobileNav = false; renderSidebar(); }
    });

    window.addEventListener('hashchange', () => {
      openDD = null; dtDraft = null; userMenuOpen = false; mobileNav = false;
      if (drawer) { drawerReturnFocus = null; closeDrawer(); }
      expanded = activeParent(currentPath());
      render();
      $('#page').scrollTop = 0;
      window.scrollTo(0, 0);
    });

    let lastWidthClass = innerWidth < 768 ? 'phone' : innerWidth < 1024 ? 'tablet' : 'desktop';
    window.addEventListener('resize', () => {
      const cls = innerWidth < 768 ? 'phone' : innerWidth < 1024 ? 'tablet' : 'desktop';
      if (cls === lastWidthClass) return;
      lastWidthClass = cls;
      collapsed = cls === 'tablet';
      mobileNav = false;
      render();
    });

    expanded = activeParent(currentPath());
    render();
  </script>
</body>

</html>
