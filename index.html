  <title>SSLCOMMERZ Merchant Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.min.js"></script>

  <!-- Same design tokens as the KAM panel (src/index.css) -->
  <style type="text/tailwindcss">
    @theme {
      --color-primary-50: #f0f4fa;
      --color-primary-100: #dde6f4;
      --color-primary-200: #c1d2eb;
      --color-primary-300: #99b5df;
      --color-primary-400: #6c93ce;
      --color-primary-500: #4a75ba;
      --color-primary-600: #295cab;
      --color-primary-700: #264f8f;
      --color-primary-800: #234475;
      --color-primary-900: #223a60;
      --color-primary-950: #17253d;
      --color-primary: var(--color-primary-600);
      --font-sans: "Inter", "sans-serif";
    }
  </style>

  <style>
    body { font-size: 14px; }
    .anim-pop { animation: pop .16s ease-out; }
    .anim-fade { animation: fade .2s ease-out; }
    .anim-drawer { animation: drawer-in .28s cubic-bezier(.2, .8, .2, 1); }
    @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes drawer-in { from { transform: translateX(100%); } to { transform: none; } }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { scrollbar-width: none; }
    [data-action]:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid #295cab; outline-offset: 2px; border-radius: 6px; }
    tr[data-action]:focus-visible { outline-offset: -2px; }
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="time"]::-webkit-calendar-picker-indicator { opacity: .5; cursor: pointer; }
    /* Same small-screen table sizing as the KAM panel (index.css, max-width: 1200px) */
    @media (max-width: 1200px) {
      table th, table td, table td *, table th * { font-size: 11px !important; }
    }
  </style>
</head>

      const [hh, mm] = time.split(':').map(Number);
      return isEnd ? new Date(y, m - 1, d, hh, mm, 59, 999) : new Date(y, m - 1, d, hh, mm, 0, 0);
    };
    const fmtNumber = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
    const fmtBDT = (n) => `৳${Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
    const fmtBDTShort = (n) => n >= 1e7 ? `৳${(n / 1e7).toFixed(2)} Cr` : n >= 1e5 ? `৳${(n / 1e5).toFixed(2)} Lac` : fmtBDT(n);

    // =====================================================================
    // Mock data (deterministic). Card / account numbers are masked — the
    // merchant portal never shows a full PAN (PCI-DSS).
    // =====================================================================
    function mulberry32(a) {
      return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rng = mulberry32(20261026);
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];
    const wpick = (arr) => {
      let r = rng() * arr.reduce((s, x) => s + x.w, 0);
      for (const x of arr) { if ((r -= x.w) < 0) return x; }
      return arr[arr.length - 1];
    };
    const digits = (n) => Array.from({ length: n }, () => Math.floor(rng() * 10)).join('');
    const alnum = (n) => Array.from({ length: n }, () => '0123456789ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(rng() * 34)]).join('');

    const STORES = [
      { id: 'demo_dhanmondi', name: 'Demo Store – Dhanmondi', w: 5 },
      { id: 'demo_gulshan', name: 'Demo Store – Gulshan', w: 3 },
      { id: 'demo_online', name: 'Demo Online Shop', w: 4 },
    ];
    const METHODS = [
      { name: 'VISA', type: 'Card', w: 20 },
      { name: 'Mastercard', type: 'Card', w: 13 },
      { name: 'AMEX', type: 'Card', w: 3 },
      { name: 'DBBL Nexus', type: 'Card', w: 3 },
      { name: 'bKash', type: 'Mobile Banking', w: 22 },
      { name: 'Nagad', type: 'Mobile Banking', w: 10 },
      { name: 'Rocket', type: 'Mobile Banking', w: 4 },
      { name: 'Bangla QR', type: 'QR', w: 14 },
      { name: 'Google Pay', type: 'Wallet', w: 6 },
      { name: 'City Touch', type: 'Internet Banking', w: 3 },
    ];
    const FEE_RATE = { 'Card': 0.02, 'Mobile Banking': 0.015, 'Internet Banking': 0.015, 'QR': 0.01, 'Wallet': 0.02 };
    const STATUSES = [
      { value: 'success', label: 'Success', w: 78 },
      { value: 'failed', label: 'Failed', w: 12 },
      { value: 'pending', label: 'Pending', w: 3 },
      { value: 'cancelled', label: 'Cancelled', w: 5 },
      { value: 'refunded', label: 'Refunded', w: 2 },
    ];
    const ISSUERS = ['BRAC Bank', 'City Bank', 'Dutch-Bangla Bank', 'Eastern Bank', 'Standard Chartered', 'Prime Bank'];
    const FAIL_REASONS = ['Insufficient balance', 'Declined by issuer', 'OTP verification failed', 'Session timeout at gateway', '3D Secure authentication failed'];
    const CUSTOMERS = ['Ayesha Rahman', 'Tanvir Hasan', 'Nusrat Jahan', 'Imran Hossain', 'Farhana Akter', 'Sabbir Ahmed', 'Mehedi Islam', 'Sadia Chowdhury', 'Rakib Uddin', 'Tasnim Kabir', 'Arif Mahmud', 'Shirin Sultana'];
    const HOUR_WEIGHTS = [1, .5, .3, .2, .2, .4, 1, 2, 3, 4, 5, 6, 7, 6.5, 6, 5, 5, 5.5, 6.5, 7.5, 8, 7, 4.5, 2.5].map((w, h) => ({ h, w }));

    // QA hook: open with ?now=2026-10-26T00:20 to see the portal at another time of day.
    const NOW = (() => {
      const q = new URLSearchParams(location.search).get('now');
      const d = q ? new Date(q) : null;
      return d && !Number.isNaN(d.getTime()) ? d : new Date();
    })();
    const TODAY = startOfDay(NOW);
    const DAYS = 70;
    const ALL_TIME_START = new Date(2020, 0, 1); // links and invoices can be older than the transaction mock data

    function maskAccount(method) {
      switch (method.type) {
        case 'Card': case 'Wallet': return `•••• ${digits(4)}`;
        case 'Mobile Banking': return `01•••••${digits(3)}`;
        case 'Internet Banking': return `A/C ••••${digits(4)}`;
        default: return `•••• ${digits(4)}`;
      }
    }

    const TXNS = [];
    for (let i = 0; i < 2600; i++) {
      const day = Math.floor(rng() * DAYS);
      if (rng() > 0.55 + 0.45 * (1 - day / DAYS)) continue; // gentle upward trend
      const h = wpick(HOUR_WEIGHTS).h;
      const date = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - day, h, Math.floor(rng() * 60), Math.floor(rng() * 60));
      if (date > NOW) continue;
      const method = wpick(METHODS);
      const store = wpick(STORES);
      const status = wpick(STATUSES).value;
      const amount = Math.round(Math.exp(5 + rng() * 4.8) / 10) * 10;
      const name = pick(CUSTOMERS);
      const ymd = `${String(date.getFullYear()).slice(2)}${pad(date.getMonth() + 1)}${pad(date.getDate())}`;
      TXNS.push({
        id: `TXN${ymd}${alnum(6)}`,
        valId: `VAL${alnum(10)}`,
        bankTranId: digits(14),
        date,
        store: store.id,
        storeName: store.name,
        customer: name,
        phone: `01•••••${digits(3)}`,
        email: `${name.split(' ')[0][0].toLowerCase()}•••••@example.com`,
        method: method.name,
        type: method.type,
        account: maskAccount(method),
        issuer: method.type === 'Card' ? pick(ISSUERS) : method.name,
        amount,
        fee: Math.round(amount * FEE_RATE[method.type] * 100) / 100,
        status,
        reason: status === 'failed' ? pick(FAIL_REASONS) : null,
        auth: 4 + Math.floor(rng() * 50),
      });
    }
    TXNS.sort((a, b) => b.date - a.date);

    // Refund and chargeback requests raised against the transactions above.
    const REFUND_REMARKS = ['Customer cancelled the order', 'Item out of stock', 'Duplicate payment by customer', 'Partial delivery', 'Service not availed'];
    const REQUESTERS = ['demo_merchant', 'manager_dhanmondi', 'manager_gulshan'];
    const REFUNDS = [];
    for (const t of TXNS) {
      const refunded = t.status === 'refunded';
      if (!refunded && !(t.status === 'success' && rng() < 0.025)) continue;
      const date = new Date(Math.min(NOW.getTime() - 60000, t.date.getTime() + (1 + rng() * 96) * 3600e3));
      const ageH = (NOW - date) / 3600e3;
      const status = refunded ? 'Success' : ageH < 24 ? pick(['Initiate', 'Processing']) : ageH < 96 ? pick(['Processing', 'Submit To Bank']) : 'Cancelled';
      const full = rng() < 0.7;
      REFUNDS.push({
        ref: `RF${alnum(10)}`, txn: t, date, status,
        requestedBy: pick(REQUESTERS),
        remarks: pick(REFUND_REMARKS),
        type: full ? 'Full' : 'Partial',
        amount: full ? t.amount : Math.max(10, Math.round(t.amount * (0.3 + rng() * 0.6) / 10) * 10),
        store: t.store, storeName: t.storeName,
      });
    }
    REFUNDS.sort((a, b) => b.date - a.date);

    const CB_REASONS = ['Goods or services not received', 'Unauthorized transaction', 'Duplicate charge', 'Product not as described', 'Credit not processed'];
    const CB_STAGES = [{ v: 'Retrieval Request', w: 3 }, { v: 'First Chargeback', w: 6 }, { v: 'Pre-Arbitration', w: 2 }, { v: 'Arbitration', w: 1 }];
    const CHARGEBACKS = [];
    for (const t of TXNS) {
      if (t.status !== 'success' || !['Card', 'Wallet'].includes(t.type) || rng() > 0.03) continue;
      const date = new Date(t.date.getTime() + (5 + rng() * 30) * 864e5);
      if (date > NOW) continue;
      const ageD = (NOW - date) / 864e5;
      const status = ageD < 2 ? 'Initial' : ageD < 7 ? pick(['Waiting', 'Waiting', 'Processing']) : pick(['Submit To Bank', 'Success', 'Cancel', 'Cancel']);
      CHARGEBACKS.push({
        ref: `CB${alnum(10)}`, txn: t, date, status,
        respondBy: addDays(date, 7),
        stage: wpick(CB_STAGES).v,
        reason: pick(CB_REASONS),
        amount: t.amount, bank: t.type === 'Card' ? t.issuer : pick(ISSUERS), // wallet cards are issued by a bank too
        store: t.store, storeName: t.storeName,
      });
    }
    CHARGEBACKS.sort((a, b) => b.date - a.date);

    const REFUND_BY_TXN = new Map(REFUNDS.map(r => [r.txn.id, r]));
    const CB_BY_TXN = new Map(CHARGEBACKS.map(c => [c.txn.id, c]));

    // Settlements: one payout per store per business day, paid next day at 11:00 AM (mock rule).
    // Held payouts are forwarded and added to the store's next settlement.
    const SETTLE_TYPE = { demo_dhanmondi: 'Both', demo_gulshan: 'Qr Payment', demo_online: 'Online' };
    const STORE_CODE = { demo_dhanmondi: 'DHN', demo_gulshan: 'GUL', demo_online: 'ONL' };
    const STORE_BANK = {
      demo_dhanmondi: { payee: 'Demo Merchant Ltd.', bank: 'City Bank', branch: 'Dhanmondi', account: `•••• •••• ${digits(4)}`, routing: `•••••${digits(4)}` },
      demo_gulshan: { payee: 'Demo Merchant Ltd.', bank: 'BRAC Bank', branch: 'Gulshan Avenue', account: `•••• •••• ${digits(4)}`, routing: `•••••${digits(4)}` },
      demo_online: { payee: 'Demo Merchant Ltd.', bank: 'Eastern Bank', branch: 'Motijheel', account: `•••• •••• ${digits(4)}`, routing: `•••••${digits(4)}` },
    };
    const HOLD_REASONS = [
      { reason: 'Returned by beneficiary bank — account name mismatch', bounce: true },
      { reason: 'Held for KYC document review', bounce: false },
    ];
    const SETTLEMENTS = [];
    {
      const groups = new Map();
      for (const t of TXNS) {
        if (t.status !== 'success' && t.status !== 'refunded') continue;
        const key = `${t.store}|${toDateInput(t.date)}`;
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(t);
      }
      const entries = [...groups.entries()]
        .map(([key, txns]) => ({ store: key.split('|')[0], day: startOfDay(txns[0].date), txns }))
        .sort((a, b) => a.day - b.day);
      const carry = {};
      let batch = 4100;
      for (const { store, day, txns } of entries) {
        const next = addDays(day, 1);
        const deducted = [
          ...REFUNDS.filter(r => r.status === 'Success' && r.store === store && r.date >= day && r.date < next).map(r => r.amount),
          ...CHARGEBACKS.filter(c => c.status === 'Success' && c.store === store && c.date >= day && c.date < next).map(c => c.amount),
        ].reduce((s, a) => s + a, 0);
        const summary = [...new Set(txns.map(t => t.type))].map(type => {
          const list = txns.filter(t => t.type === type);
          const fee = list.reduce((s, t) => s + t.fee, 0);
          return { type, count: list.length, ssl: fee * 0.4, bank: fee * 0.6, store: list.reduce((s, t) => s + t.amount - t.fee, 0), deduct: 0 };
        });
        if (deducted) summary.push({ type: 'Refund / Chargeback', count: 0, ssl: 0, bank: 0, store: 0, deduct: deducted });
        const payable = summary.reduce((s, r) => s + r.store - r.deduct, 0);
        const opening = carry[store] || 0;
        const settle = opening + payable;
        const date = new Date(day.getFullYear(), day.getMonth(), day.getDate() + 1, 11, 0);
        const hold = date <= NOW && rng() < 0.04 ? HOLD_REASONS[rng() < 0.35 ? 0 : 1] : null;
        const status = date > NOW ? 'Pending' : hold ? 'On Hold' : 'Paid';
        const paid = status === 'Paid' ? settle : 0;
        const fwd = status === 'On Hold' ? settle : 0;
        carry[store] = fwd;
        const bank = STORE_BANK[store];
        SETTLEMENTS.push({
          ref: `STL${toDateInput(date).slice(2).replace(/-/g, '')}${STORE_CODE[store]}${digits(4)}`,
          batch: batch++,
          date, day, store,
          storeName: STORES.find(s => s.id === store).name,
          type: SETTLE_TYPE[store],
          total: txns.reduce((s, t) => s + t.amount, 0),
          txnCount: txns.length,
          opening, payable, settle, paid, fwd, status,
          holdReason: hold?.reason || null,
          bounce: !!hold?.bounce,
          summary, bank,
          payments: status === 'Paid' ? [{ sl: 1, ref: `BEFTN${digits(10)}`, payee: bank.payee, amount: paid, bank: bank.bank }] : [],
        });
      }
      SETTLEMENTS.sort((a, b) => b.date - a.date || a.store.localeCompare(b.store));
    }

    // Financial years run 1 July – 30 June (Bangladesh / NBR tax year). Monthly figures are synthetic.
    const FY_STORE_SINCE = { demo_dhanmondi: new Date(2022, 0, 1), demo_gulshan: new Date(2023, 2, 1), demo_online: new Date(2024, 8, 1) };
    const FY_SHARE = { demo_dhanmondi: 0.42, demo_gulshan: 0.25, demo_online: 0.33 };
    const FY_SEASON = [1, 1, .95, 1.05, 1.1, 1.25, 1.05, .95, 1.1, 1.2, 1.3, 1.0]; // Jul → Jun
    const CURRENT_FY = NOW.getMonth() >= 6 ? NOW.getFullYear() : NOW.getFullYear() - 1;
    const FY_YEARS = [CURRENT_FY, CURRENT_FY - 1, CURRENT_FY - 2, CURRENT_FY - 3];
    const fyLabel = (y) => `${y}–${y + 1}`;

    function fyMonths(y, storeId) {
      const months = [];
      for (let m = 0; m < 12; m++) {
        const start = new Date(y, 6 + m, 1);
        if (start > NOW) break;
        const end = new Date(y, 7 + m, 0, 23, 59, 59);
        const active = start >= FY_STORE_SINCE[storeId] || end >= FY_STORE_SINCE[storeId];
        let gross = 0;
        if (active) {
          const r = mulberry32(y * 1000 + m * 10 + STORES.findIndex(s => s.id === storeId))();
          const years = (start - new Date(2023, 6, 1)) / (365 * 864e5);
          const elapsed = end > NOW ? (NOW - start) / (end - start) : 1;
          gross = Math.round(1.55e6 * Math.pow(1.3, years) * FY_SEASON[m] * FY_SHARE[storeId] * (0.9 + r * 0.2) * elapsed / 10) * 10;
        }
        const fees = gross * 0.017;
        const refunds = gross * 0.008;
        months.push({ start, txns: Math.round(gross / 3900), gross, fees, refunds, net: gross - fees - refunds });
      }
      return months;
    }

    function fyStatus(y, storeId) {
      if (y === CURRENT_FY) return 'In Progress';
      if (y === CURRENT_FY - 1 && storeId === 'demo_gulshan') return 'Processing';
      return 'Generated';
    }

    // Payment products (links, invoices, QR, EMI). Kept in memory so create / activate / send work in the prototype.
    const idHash = (s) => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
    const LINK_NAMES = ['Eid Collection Pre-order', 'Monthly Subscription Box', 'Workshop Registration', 'Gift Card', 'Custom Order Advance', 'Delivery Charge', 'Membership Renewal', 'Course Fee — Batch 7', 'Event Ticket', 'Corporate Order Deposit'];
    const DEFAULT_LINK_COLORS = { leftBg: '#ffffff', leftText: '#0f172a', btnBg: '#295cab', btnText: '#ffffff' };
    const linkUrl = (ref) => `https://uat-invoice.sslcommerz.com/invoice/pay?refer=${ref}`;
    const PAYMENT_LINKS = LINK_NAMES.map((name, i) => {
      const store = wpick(STORES);
      const fixed = rng() < 0.6;
      const amount = fixed ? Math.round((500 + rng() * 9500) / 50) * 50 : null;
      const paymentType = rng() < 0.75 ? 'Reusable' : 'One-time';
      const date = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - 2 - Math.floor(rng() * 110), 9 + Math.floor(rng() * 9), Math.floor(rng() * 60));
      let payments = TXNS.filter(t => t.store === store.id && t.status === 'success' && t.date > date && idHash(t.id) % LINK_NAMES.length === i)
        .map(t => ({ txn: t, date: t.date, amount: fixed ? amount : t.amount, customer: t.customer }));
      if (paymentType === 'One-time') payments = payments.slice(-1);
      return {
        ref: alnum(13), name, store: store.id, storeName: store.name, date,
        payType: 'Payment Link', paymentType,
        amountType: fixed ? 'Fixed' : 'Any', amount,
        amountText: fixed ? '' : 'Enter the amount you want to pay',
        convFee: rng() < 0.3 ? 1.5 : 0,
        buttonName: 'Pay Now', productDetails: '', topMessage: '', buttonMessage: '',
        domainUrl: store.id === 'demo_online' ? 'https://shop.example.com' : '',
        colors: { ...DEFAULT_LINK_COLORS },
        active: paymentType === 'One-time' ? payments.length === 0 : rng() > 0.15,
        payments,
      };
    }).sort((a, b) => b.date - a.date);

    const INVOICE_ITEMS = [['Website maintenance (monthly)', 15000], ['Logo design', 8000], ['Catering — per guest', 450], ['Bulk order — T-shirts', 650], ['Consultation hour', 2500], ['Annual service contract', 36000], ['Delivery charge', 120], ['Installation fee', 3000]];
    const invoiceTotals = (inv) => {
      const subtotal = inv.items.reduce((s, it) => s + it.qty * it.price, 0);
      const vat = Math.round(subtotal * inv.vatRate) / 100;
      return { subtotal, vat, total: subtotal + vat };
    };
    const INVOICES = Array.from({ length: 30 }, (_, i) => {
      const store = wpick(STORES);
      const issued = new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate() - Math.floor(rng() * 75), 10 + Math.floor(rng() * 8), Math.floor(rng() * 60));
      const date = issued > NOW ? new Date(NOW.getTime() - 30 * 60e3) : issued;
      const due = endOfDay(addDays(date, pick([7, 15, 30])));
      const items = Array.from({ length: 1 + Math.floor(rng() * 3) }, () => {
        const [desc, price] = pick(INVOICE_ITEMS);
        return { desc, qty: price > 5000 ? 1 : 1 + Math.floor(rng() * 20), price };
      });
      const name = pick(CUSTOMERS);
      const inv = {
        no: `INV-${date.getFullYear()}-${1040 + i}`, ref: alnum(13), store: store.id, storeName: store.name,
        customer: name, phone: `01•••••${digits(3)}`, email: `${name[0].toLowerCase()}•••••@example.com`,
        date, due, items, vatRate: pick([0, 0, 15]), notes: rng() < 0.4 ? 'Thank you for your business.' : '',
        viewed: rng() < 0.7,
      };
      const r = rng();
      const ageD = (NOW - date) / 864e5;
      if (ageD < 3 && r < 0.3) inv.status = 'Draft';
      else if (r < 0.05) inv.status = 'Cancelled';
      else if (r < 0.6 && ageD > 1) { inv.status = 'Paid'; inv.paidAt = new Date(Math.min(NOW.getTime(), date.getTime() + rng() * (due - date))); }
      else inv.status = NOW > due ? 'Overdue' : 'Sent';
      return inv;
    }).sort((a, b) => b.date - a.date);

    const QR_CODES = [
      { id: 'QR-DHN-01', store: 'demo_dhanmondi', label: 'Counter 1', terminal: `TID ••••${digits(4)}` },
      { id: 'QR-DHN-02', store: 'demo_dhanmondi', label: 'Counter 2', terminal: `TID ••••${digits(4)}` },
      { id: 'QR-GUL-01', store: 'demo_gulshan', label: 'Main counter', terminal: `TID ••••${digits(4)}` },
      { id: 'QR-ONL-01', store: 'demo_online', label: 'Delivery rider', terminal: `TID ••••${digits(4)}` },
    ];

    // EMI banks, tenures and store rates (% charged to the store) as configured in the KAM panel.
    const EMI_DEFAULT_RATE = { 3: 3.0, 6: 4.5, 9: 6.5, 12: 8.5, 18: 11.5, 24: 15.5, 30: 16.5, 36: 19.5 };
    const EMI_TENURES = [3, 6, 9, 12, 18, 24, 30, 36];
    const EMI_BANKS = [
      { name: 'BRAC BANK LIMITED', tenures: [3, 6, 9, 12, 18, 24] },
      { name: 'BANK ASIA LIMITED', tenures: [3, 6, 9, 12] },
      { name: 'CITY BANK LIMITED', tenures: [3, 6, 9, 12, 18, 24, 30, 36] },
      { name: 'DUTCH BANGLA BANK', tenures: [3, 6, 9, 12, 18, 24, 36] },
      { name: 'EASTERN BANK', tenures: [3, 6, 9, 12, 18, 24, 36] },
      { name: 'LANKABANGLA FINANCE', tenures: [3, 6, 9, 12, 18, 24, 36], rates: { 3: 3.5, 6: 4.5, 9: 6.5, 12: 8.5, 18: 11.5, 24: 15.5, 36: 19.5 } },
      { name: 'MUTUAL TRUST BANK', tenures: [3, 6, 9, 12, 18, 24, 36] },
      { name: 'PRIME BANK', tenures: [3, 6, 9, 12, 18, 24, 36] },
      { name: 'STANDARD CHARTERED BANK', tenures: [3, 6, 9, 12, 18, 24, 36], rates: { 3: 3.5, 6: 5.5, 9: 8.0, 12: 10.5, 18: 13.5, 24: 17.5, 36: 22.5 } },
      { name: 'UNITED COMMERCIAL BANK', tenures: [3, 6, 9, 12, 24] },
    ].map(b => ({ ...b, rates: b.rates || EMI_DEFAULT_RATE }));
    const EMI_STORES = { demo_dhanmondi: true, demo_gulshan: false, demo_online: true };
    const EMI_REQUESTS = [];
    for (const t of TXNS) {
      if (t.type !== 'Card' || t.status !== 'success' || t.amount < 5000 || !EMI_STORES[t.store] || rng() > 0.3) continue;
      const bank = pick(EMI_BANKS);
      const tenure = pick(bank.tenures);
      const ageD = (NOW - t.date) / 864e5;
      let status, bankStatus;
      if (ageD < 1) { status = 'Initial'; bankStatus = 'Not Sent'; }
      else if (ageD < 3) { status = 'Processing'; bankStatus = pick(['Not Sent', 'Sent']); }
      else if (rng() < 0.78) { status = 'Requested'; bankStatus = rng() < 0.85 ? 'Approved' : 'Sent'; }
      else { status = 'Declined'; bankStatus = 'Cancel'; }
      EMI_REQUESTS.push({
        ref: `EMI${alnum(9)}`, txn: t, date: new Date(t.date.getTime() + 90e3), store: t.store, storeName: t.storeName,
        bank: bank.name, tenure, rate: bank.rates[tenure], charge: Math.round(t.amount * bank.rates[tenure]) / 100,
        status, bankStatus, remarks: 'Customer opted for EMI at checkout',
      });
    }

    // Analytics attributes for each mock transaction: customer location, mobile operator, device,
    // card issuer and saved-card use. Uses its own random stream so the data above stays unchanged.
    const DIVISIONS = [
      { v: 'Dhaka', w: 48, districts: [{ v: 'Dhaka', w: 70 }, { v: 'Gazipur', w: 12 }, { v: 'Narayanganj', w: 10 }, { v: 'Tangail', w: 8 }] },

    }

    // =====================================================================
    // Transactions list
    // =====================================================================
    function baseTxns(s, view) {
      const q = s.search.trim().toLowerCase();
      return TXNS.filter(t =>
        (!view.lockMethod || t.method === view.lockMethod) &&
        (s.method === 'all' || t.method === s.method) &&
        (s.store === 'all' || t.store === s.store) &&
        inRange(t, s.range) &&
        (!q || t.id.toLowerCase().includes(q) || t.valId.toLowerCase().includes(q))
      );
    }

    function sortedRows(base, s) {
      const rows = s.status === 'all' ? [...base] : base.filter(t => t.status === s.status);
      const dir = s.sort.dir === 'asc' ? 1 : -1;
      rows.sort((a, b) => (s.sort.key === 'amount' ? a.amount - b.amount : a.date - b.date) * dir);
      return rows;
    }

    const TXN_COLS = [
      { key: 'date', label: 'Date & Time', sortable: true },
      { key: 'id', label: 'Transaction ID' },
      // Store and Customer drop out on narrower screens (still shown in the drawer),
      // so the table never needs a horizontal scroll.
      { key: 'store', label: 'Store', cls: 'hidden lg:table-cell' },
      { key: 'customer', label: 'Customer', cls: 'hidden xl:table-cell' },
      { key: 'method', label: 'Payment Method' },
      { key: 'amount', label: 'Amount', sortable: true, right: true },
      { key: 'status', label: 'Status' },
    ];

    function txnCell(key, t) {
      switch (key) {
        case 'date': return `<div class="text-slate-800 font-medium whitespace-nowrap">${fmtDate(t.date)}</div><div class="text-xs text-slate-500">${fmtTime(t.date, true)}</div>`;
        case 'id': return `<div class="flex items-center gap-1.5"><span class="font-mono text-xs text-slate-800">${t.id}</span><button data-action="copy" data-value="${t.id}" class="p-1 rounded text-slate-400 hover:text-slate-700 hover:bg-slate-100" title="Copy">${ic('copy', 'w-3.5 h-3.5')}</button></div>`;
        case 'store': return esc(t.storeName);
        case 'customer': return `<div>${esc(t.customer)}</div><div class="text-xs text-slate-500 font-mono">${t.phone}</div>`;
        case 'method': return `<div class="font-medium text-slate-800">${t.method} <span class="text-xs font-normal text-slate-500">${t.type}</span></div><div class="text-xs text-slate-500 font-mono whitespace-nowrap">${t.account}</div>`;
        case 'amount': return `<span class="font-semibold text-slate-900 whitespace-nowrap">${fmtBDT(t.amount)}</span>`;
        case 'status': return badge(t.status);
      }
    }

    function metricCard({ title, value, status, selected, sub, key = 'status' }) {
      return `
        <div ${status ? `data-action="overview-status" data-key="${key}" data-value="${status}"` : ''}
          class="metric-card-container bg-white p-4 rounded-xl border shadow-sm transition-all text-left ${status ? 'cursor-pointer hover:border-slate-300 hover:shadow-md' : ''} ${selected ? 'border-primary-600 ring-1 ring-primary-100' : 'border-slate-200'}">
          <p class="text-xs font-semibold text-slate-500 uppercase">${title}</p>
          <p class="text-2xl font-bold mt-2 text-slate-900">${value}</p>
          ${sub ? `<p class="text-xs text-slate-500 mt-1">${sub}</p>` : ''}
        </div>`;
    }

    function renderTransactions(view) {
      const s = txnState(view.key);
      const base = baseTxns(s, view);
      const rows = sortedRows(base, s);
      const totalPages = Math.max(1, Math.ceil(rows.length / s.pageSize));
      s.page = Math.min(s.page, totalPages);
      const start = (s.page - 1) * s.pageSize;
      const pageRows = rows.slice(start, start + s.pageSize);
      const cols = TXN_COLS.filter(c => !s.hidden.has(c.key));

      const success = base.filter(t => t.status === 'success');
      const failed = base.filter(t => t.status === 'failed');
      const successAmount = success.reduce((sum, t) => sum + t.amount, 0);
      const hasFilters = s.search || s.status !== 'all' || s.method !== 'all' || s.store !== 'all' || s.range.preset !== '7d';

      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">${view.title}</h1>
            <p class="text-slate-500 text-sm">${view.sub}</p>
          </div>

          <div class="flex flex-col">
            <div class="filter-bar-container flex items-center gap-3 flex-wrap">
              <div class="relative flex items-center">
                <span class="absolute left-3 text-slate-400 pointer-events-none">${ic('search', 'w-4 h-4')}</span>
                <input id="txn-search" type="text" placeholder="Transaction ID / Val ID" value="${esc(s.search)}"
                  class="py-1.5 pl-9 ${s.search ? 'pr-8' : 'pr-3'} bg-white border border-slate-200 rounded-full text-sm font-medium text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-100 focus:border-primary-500 transition-all"
                  style="width:${s.search ? 240 : 210}px">
                ${s.search ? `<button data-action="clear-search" class="absolute right-2.5 text-slate-400 hover:text-slate-600">${ic('x', 'w-3 h-3')}</button>` : ''}
              </div>
              ${dtPill(s.range)}
              ${selectPill('txn', 'status', 'Status', STATUS_OPTS, s.status, 'circle-dot')}
              ${view.lockMethod
                ? `<span class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full text-sm border border-slate-200 bg-slate-100 text-slate-600 font-medium">${ic('lock', 'w-3.5 h-3.5')}${view.lockMethod}</span>`
                : selectPill('txn', 'method', 'Payment Method', METHOD_OPTS, s.method, 'wallet')}
              ${selectPill('txn', 'store', 'Store', STORE_OPTS, s.store, 'store')}
              ${hasFilters ? `<button data-action="clear-filters" class="text-xs text-slate-500 hover:text-slate-800 font-medium px-2">Clear all</button>` : ''}
            </div>

            <div class="flex flex-col gap-4 pt-4">
              <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                ${metricCard({ title: 'Total Transactions', value: base.length.toLocaleString(), status: 'all', selected: s.status === 'all' })}
                ${metricCard({ title: 'Success Transactions', value: success.length.toLocaleString(), status: 'success', selected: s.status === 'success' })}
                ${metricCard({ title: 'Failed Transactions', value: failed.length.toLocaleString(), status: 'failed', selected: s.status === 'failed' })}
                ${metricCard({ title: 'Total Amount (Success)', value: fmtBDTShort(successAmount), sub: fmtBDT(successAmount) })}
              </div>
            </div>

            <div class="space-y-4 pt-6">
              <div class="data-table-toolbar flex items-center justify-between gap-3">
                <p class="text-sm text-slate-500"><span class="font-semibold text-slate-900">${rows.length.toLocaleString()}</span> transactions · ${ic(s.range.daily ? 'repeat' : 'calendar-clock', 'w-3.5 h-3.5 inline -mt-0.5')} ${rangeDetail(s.range)}</p>
                <div class="flex items-center gap-2">
                  <button data-action="export" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-md hover:bg-slate-50 transition-colors shadow-sm">${ic('download', 'w-4 h-4')}Export CSV</button>
                  <div class="relative" data-dd-root>
                    <button data-action="dd-toggle" data-key="txn:cols" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-md hover:bg-slate-50 transition-colors shadow-sm">${ic('settings-2', 'w-4 h-4')}View Column</button>
                    ${openDD === 'txn:cols' ? `
                      <div class="absolute right-0 top-full mt-1 w-52 bg-white border border-slate-200 rounded-lg shadow-lg z-50 p-1 anim-pop">
                        <div class="text-xs font-semibold text-slate-500 px-2 py-1">Toggle columns</div>
                        ${TXN_COLS.map(c => {
                          const on = !s.hidden.has(c.key);
                          return `<button data-action="col-toggle" data-value="${c.key}" class="w-full flex items-center gap-2 px-2 py-1.5 hover:bg-slate-50 rounded text-sm text-slate-700">
                            <span class="w-4 h-4 rounded border flex items-center justify-center ${on ? 'bg-primary-600 border-primary-600' : 'border-slate-300 bg-white'}">${on ? ic('check', 'w-2.5 h-2.5 text-white') : ''}</span>${c.label}</button>`;
                        }).join('')}
                      </div>` : ''}
                  </div>
                </div>
              </div>

              <div class="rounded-md border border-slate-200 bg-white shadow-sm overflow-hidden">
                <table class="w-full text-left text-sm">
                  <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                      ${cols.map(c => `
                        <th class="h-10 px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap ${c.right ? 'text-right' : ''} ${c.cls || ''}">
                          ${c.sortable ? `<button data-action="sort" data-value="${c.key}" class="inline-flex items-center gap-1 uppercase tracking-wider hover:text-slate-800 ${s.sort.key === c.key ? 'text-slate-800' : ''}">${c.label}${ic(s.sort.key === c.key ? (s.sort.dir === 'asc' ? 'arrow-up' : 'arrow-down') : 'arrow-up-down', 'w-3 h-3')}</button>` : c.label}
                        </th>`).join('')}
                      <th class="h-10 px-3 w-10"></th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${pageRows.length ? pageRows.map(t => `
                      <tr data-action="open-txn" data-value="${t.id}" class="hover:bg-slate-50 transition-colors cursor-pointer">
                        ${cols.map(c => `<td class="px-3 py-2 align-middle text-slate-700 ${c.right ? 'text-right' : ''} ${c.cls || ''}">${txnCell(c.key, t)}</td>`).join('')}
                        <td class="px-3 py-2 text-slate-400">${ic('chevron-right', 'w-4 h-4')}</td>
                      </tr>`).join('') : `
                      <tr><td colspan="${cols.length + 1}">
                        <div class="flex flex-col items-center justify-center py-12 px-4 text-center">
                          <div class="w-12 h-12 rounded-full bg-slate-50 flex items-center justify-center mb-4">${ic('search', 'w-6 h-6 text-slate-300')}</div>
                          <h3 class="text-sm font-semibold text-slate-900 mb-1">No transactions found</h3>
                          <p class="text-xs text-slate-500">Try a wider date &amp; time range or clear some filters.</p>
                        </div>
                      </td></tr>`}
                  </tbody>
                </table>
              </div>

              <div class="flex items-center justify-between px-2">
                <div class="flex items-center gap-3 text-sm text-slate-500">
                  <span>Showing ${rows.length ? start + 1 : 0}–${start + pageRows.length} of ${rows.length.toLocaleString()}</span>
                  <select data-change="page-size" class="px-2 py-1 bg-white border border-slate-200 rounded text-sm text-slate-600 focus:outline-none focus:border-primary-500">
                    ${[10, 20, 50, 100].map(n => `<option value="${n}" ${n === s.pageSize ? 'selected' : ''}>${n} / page</option>`).join('')}
                  </select>
                </div>
                <div class="flex items-center space-x-2">
                  <button data-action="page" data-value="-1" ${s.page <= 1 ? 'disabled' : ''} class="px-3 py-1 text-sm border border-slate-200 rounded bg-white hover:bg-slate-50 disabled:opacity-50">Previous</button>
                  <span class="text-sm text-slate-600">Page ${s.page} of ${totalPages}</span>
                  <button data-action="page" data-value="1" ${s.page >= totalPages ? 'disabled' : ''} class="px-3 py-1 text-sm border border-slate-200 rounded bg-white hover:bg-slate-50 disabled:opacity-50">Next</button>
                </div>
              </div>
            </div>
          </div>
        </div>`;
    }

    function exportCsv(view) {
      const s = txnState(view.key);
      const rows = sortedRows(baseTxns(s, view), s);
      if (!rows.length) { toast('Nothing to export for these filters'); return; }
      const cell = (v) => `"${String(v).replace(/"/g, '""')}"`;
      const lines = [
        ['Transaction ID', 'Date', 'Time', 'Store', 'Customer', 'Payment Method', 'Card / Account (masked)', 'Amount (BDT)', 'Status'].map(cell).join(','),
        ...rows.map(t => [t.id, fmtDate(t.date), fmtTime(t.date, true), t.storeName, t.customer, t.method, t.account, t.amount.toFixed(2), t.status].map(cell).join(',')),
      ];
      const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${view.key}-transactions-${toDateInput(NOW)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast(`Exported ${rows.length.toLocaleString()} rows (mock data)`, 'success');
    }

    // =====================================================================
    // Refund & chargeback statuses (labels as in the KAM panel)
    // =====================================================================
    const REFUND_STATUSES = ['Initiate', 'Processing', 'Submit To Bank', 'Success', 'Cancelled'];
    const REFUND_OPEN = new Set(['Initiate', 'Processing', 'Submit To Bank']);
    const REFUND_CLS = {
      'Initiate': 'bg-blue-50 text-blue-600',
      'Processing': 'bg-amber-50 text-amber-600',
      'Submit To Bank': 'bg-slate-100 text-slate-600',
      'Success': 'bg-emerald-50 text-emerald-600',
      'Cancelled': 'bg-rose-50 text-rose-600',
    };
    const CB_STATUSES = ['Initial', 'Waiting', 'Processing', 'Submit To Bank', 'Success', 'Cancel'];
    const CB_OPEN = new Set(['Initial', 'Waiting']); // the merchant still has to respond
    const CB_PENDING = new Set(['Initial', 'Waiting', 'Processing', 'Submit To Bank']);
    const CB_CLS = {
      'Initial': 'bg-blue-50 text-blue-600',
      'Waiting': 'bg-amber-50 text-amber-600',
      'Processing': 'bg-amber-50 text-amber-600',
      'Submit To Bank': 'bg-slate-100 text-slate-600',
      'Success': 'bg-emerald-50 text-emerald-600',
      'Cancel': 'bg-rose-50 text-rose-600',
    };
    const refundBadge = (s) => `<span class="${STATUS_BADGE} ${REFUND_CLS[s]}">${s}</span>`;
    const cbBadge = (s) => `<span class="${STATUS_BADGE} ${CB_CLS[s]}">${s}</span>`;

    function respondBy(c) {
      if (!CB_OPEN.has(c.status)) return null;
      const ms = c.respondBy - NOW;
      if (ms < 0) return { text: 'Overdue', cls: 'text-rose-600' };
      const days = Math.floor(ms / 864e5);
      return { text: days === 0 ? 'Less than a day left' : `${days} day${days > 1 ? 's' : ''} left`, cls: days <= 2 ? 'text-rose-600' : 'text-amber-600' };
    }

    // =====================================================================
    // Detail drawers (KAM Drawer.tsx)
    // =====================================================================
    const kv = (k, v, mono) => `<div><dt class="text-xs text-slate-500">${k}</dt><dd class="mt-0.5 font-medium text-slate-800 break-all ${mono ? 'font-mono text-xs' : ''}">${v}</dd></div>`;
    const kvGrid = (items) => `<dl class="grid grid-cols-2 gap-x-6 gap-y-3 text-sm">${items.join('')}</dl>`;
    const section = (title, body) => `<section><h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">${title}</h3>${body}</section>`;
    const statBox = (label, value, valueCls = 'text-slate-900') => `<div class="p-3 rounded border bg-slate-50 border-slate-100"><p class="text-[10px] text-slate-500 uppercase tracking-wide">${label}</p><p class="text-lg font-bold mt-1 ${valueCls}">${value}</p></div>`;
    const linkBtn = (action, value, text) => `<button data-action="${action}" data-value="${value}" class="font-mono text-xs text-primary-600 hover:underline">${text}</button>`;
    const DOT = { slate: 'bg-slate-300', emerald: 'bg-emerald-500', rose: 'bg-rose-500', amber: 'bg-amber-500', indigo: 'bg-indigo-500', blue: 'bg-blue-500' };
    const timeline = (steps) => `
      <ol class="relative border-l border-slate-200 ml-1.5 space-y-4">
        ${steps.map(st => `<li class="ml-4">
          <span class="absolute -left-[5px] mt-1.5 w-2.5 h-2.5 rounded-full ring-4 ring-white ${DOT[st.tone]}"></span>
          <p class="text-sm font-medium text-slate-800">${st.label}</p>
          <p class="text-xs text-slate-500">${st.at ? `${fmtDate(st.at)}, ${fmtTime(st.at, true)}` : st.note || ''}</p>
        </li>`).join('')}
      </ol>`;
    const BTN_SECONDARY = 'flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded shadow-sm hover:bg-slate-50';
    const BTN_PRIMARY = 'flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-primary-600 rounded shadow-sm hover:bg-primary-700';
    const PCI_NOTE = `<p class="flex items-center gap-1.5 text-[11px] text-slate-400">${ic('shield-check', 'w-3.5 h-3.5')}Card and account numbers are masked (PCI-DSS). Full card numbers are never shown in the merchant portal.</p>`;

    function drawerShell({ title, sub, body, footer, wide = false }) {
      return `
        <div class="fixed inset-0 z-[150] flex justify-end">
          <div data-action="close-drawer" data-backdrop aria-hidden="true" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm anim-fade"></div>
          <div id="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawer-title" class="relative h-full w-full ${wide ? 'max-w-2xl' : 'max-w-xl'} bg-white shadow-2xl flex flex-col anim-drawer">
            <div class="px-4 sm:px-6 py-4 border-b border-slate-100 flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 id="drawer-title" class="text-lg font-semibold text-slate-900">${title}</h2>
                <div class="text-sm text-slate-500 mt-1 flex items-center gap-2">${sub}</div>
              </div>
              <button data-action="close-drawer" data-drawer-close aria-label="Close" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-50 rounded-full transition-colors shrink-0">${ic('x', 'w-5 h-5')}</button>
            </div>
            <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">${body}</div>
            <div class="px-4 sm:px-6 py-4 border-t border-slate-100 flex flex-wrap justify-end gap-2">${footer}</div>
          </div>
        </div>`;
    }

    const txnSummary = (t) => kvGrid([
      kv('Transaction ID', linkBtn('open-txn', t.id, t.id)),
      kv('Transaction Date', `${fmtDate(t.date)}, ${fmtTime(t.date, true)}`),
      kv('Transaction Amount', fmtBDT(t.amount)),
      kv('Payment Method', `${t.method} <span class="text-slate-500 font-normal">· ${t.type}</span>`),
      kv('Card / Account', t.account, true),
      kv('Issuer', t.issuer),
    ]);
    const storeSummary = (x) => kvGrid([kv('Store Name', esc(x.storeName)), kv('Store ID', x.store, true)]);

    function txnDrawer(t) {
      const sec = (n) => new Date(t.date.getTime() + n * 1000);
      const steps = [
        { label: 'Payment initiated', at: t.date, tone: 'slate' },
        { label: `Customer redirected to ${t.method}`, at: sec(3), tone: 'slate' },
      ];
      if (t.status === 'success' || t.status === 'refunded') {
        steps.push({ label: 'Payment authorized', at: sec(t.auth), tone: 'emerald' }, { label: 'Validated by merchant (IPN)', at: sec(t.auth + 2), tone: 'emerald' });
      } else if (t.status === 'failed') {
        steps.push({ label: `Payment failed — ${t.reason}`, at: sec(t.auth), tone: 'rose' });
      } else if (t.status === 'cancelled') {
        steps.push({ label: 'Cancelled by customer', at: sec(t.auth), tone: 'slate' });
      } else {
        steps.push({ label: 'Awaiting confirmation from provider', at: sec(t.auth), tone: 'amber' });
      }
      const rf = REFUND_BY_TXN.get(t.id);
      const cb = CB_BY_TXN.get(t.id);
      const relatedRow = (action, value, icon, title, sub, badgeHtml) => `
        <button data-action="${action}" data-value="${value}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg border border-slate-200 hover:bg-slate-50 text-left">
          <span class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center shrink-0">${ic(icon, 'w-4 h-4')}</span>
          <span class="flex-1 min-w-0"><span class="block text-sm font-medium text-slate-800">${title}</span><span class="block text-xs text-slate-500 font-mono">${sub}</span></span>
          ${badgeHtml}${ic('chevron-right', 'w-4 h-4 text-slate-400')}
        </button>`;
      const related = [
        rf && relatedRow('open-refund', rf.ref, 'undo-2', 'Refund request', `${rf.ref} · ${fmtBDT(rf.amount)}`, refundBadge(rf.status)),
        cb && relatedRow('open-cb', cb.ref, 'shield-alert', 'Chargeback', `${cb.ref} · ${cb.stage}`, cbBadge(cb.status)),
      ].filter(Boolean);

      return drawerShell({
        title: 'Transaction Details',
        sub: `<span class="font-mono text-xs">${t.id}</span>${badge(t.status)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Amount', fmtBDT(t.amount))}
            ${statBox('Gateway Fee <span class="lowercase font-normal opacity-80">(mock)</span>', fmtBDT(t.fee))}
            ${statBox('Store Amount', fmtBDT(t.amount - t.fee))}
          </div>
          ${t.reason ? `<div class="flex items-start gap-2 rounded-lg border border-rose-100 bg-rose-50 px-3 py-2.5 text-sm text-rose-700">${ic('circle-alert', 'w-4 h-4 mt-0.5 shrink-0')}<span><span class="font-semibold">Failure reason:</span> ${t.reason}</span></div>` : ''}
          ${related.length ? section('Related Requests', `<div class="space-y-2">${related.join('')}</div>`) : ''}
          ${section('Payment Information', kvGrid([
            kv('Transaction ID', t.id, true),
            kv('Validation ID', t.valId, true),
            kv('Bank Transaction ID', t.bankTranId, true),
            kv('Date & Time', `${fmtDate(t.date)}, ${fmtTime(t.date, true)}`),
            kv('Payment Method', `${t.method} <span class="text-slate-500 font-normal">· ${t.type}</span>`),
            kv('Card / Account', t.account, true),
            kv('Issuer', t.issuer),
            kv('Currency', 'BDT'),
          ]))}
          ${section('Customer', kvGrid([kv('Name', esc(t.customer)), kv('Phone', t.phone, true), kv('Email', t.email)]))}
          ${section('Store', storeSummary(t))}
          ${section('Timeline', timeline(steps))}
          ${PCI_NOTE}`,
        footer: `
          <button data-action="new-tt" data-value="${t.id}" class="${BTN_SECONDARY}">${ic('life-buoy', 'w-4 h-4')}Raise Ticket</button>
          <button data-action="toast" data-msg="Prototype: receipt download is not wired up." class="${BTN_SECONDARY}">${ic('file-down', 'w-4 h-4')}Download Receipt</button>
          ${t.status === 'success' && !rf ? `<button data-action="toast" data-msg="Prototype: no refund request was submitted." class="${BTN_PRIMARY}">${ic('undo-2', 'w-4 h-4')}Request Refund</button>` : ''}`,
      });
    }

    function refundDrawer(r) {
      const t = r.txn;
      const after = (h) => new Date(Math.min(NOW.getTime(), r.date.getTime() + h * 3600e3));
      const order = ['Initiate', 'Processing', 'Submit To Bank', 'Success'];
      const reached = (s) => order.indexOf(r.status) >= order.indexOf(s);
      const steps = [{ label: `Refund requested by ${r.requestedBy}`, at: r.date, tone: 'blue' }];
      if (r.status === 'Cancelled') {
        steps.push({ label: 'Request cancelled', at: after(26), tone: 'rose' });
      } else {
        steps.push(reached('Processing')
          ? { label: 'Approved by SSLCOMMERZ', at: after(3), tone: 'amber' }
          : { label: 'Waiting for approval', note: 'Usually reviewed within one working day (mock)', tone: 'slate' });
        if (reached('Submit To Bank')) steps.push({ label: `Submitted to ${t.issuer}`, at: after(20), tone: 'amber' });
        if (reached('Success')) steps.push({ label: 'Refunded to customer', at: after(48), tone: 'emerald' });
        else steps.push({ label: 'Refund to customer', note: 'Pending', tone: 'slate' });
      }

      return drawerShell({
        title: 'Refund Details',
        sub: `<span class="font-mono text-xs">${r.ref}</span>${refundBadge(r.status)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Transaction Amount', fmtBDT(t.amount))}
            ${statBox('Refund Amount', fmtBDT(r.amount), 'text-rose-600')}
            ${statBox('Refund Type', r.type)}
          </div>
          ${section('Refund Information', kvGrid([
            kv('Refund Reference ID', r.ref, true),
            kv('Request Status', refundBadge(r.status)),
            kv('Requested On', `${fmtDate(r.date)}, ${fmtTime(r.date, true)}`),
            kv('Requested By', r.requestedBy, true),
            kv('Merchant\'s Remarks', esc(r.remarks)),
          ]))}
          ${section('Transaction Details', txnSummary(t))}
          ${section('Store', storeSummary(r))}
          ${section('Progress', timeline(steps))}
          ${PCI_NOTE}`,
        footer: `
          <button data-action="open-txn" data-value="${t.id}" class="${BTN_SECONDARY}">${ic('receipt', 'w-4 h-4')}View Transaction</button>
          ${r.status === 'Initiate' ? `<button data-action="toast" data-msg="Prototype: the refund request was not cancelled." class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-rose-600 bg-white border border-rose-200 rounded shadow-sm hover:bg-rose-50">${ic('x', 'w-4 h-4')}Cancel Request</button>` : ''}`,
      });
    }

    function cbDrawer(c) {
      const t = c.txn;
      const rb = respondBy(c);
      const after = (h) => new Date(Math.min(NOW.getTime(), c.date.getTime() + h * 3600e3));
      const steps = [
        { label: `Chargeback raised by ${c.bank}`, at: c.date, tone: 'blue' },
        { label: 'Merchant notified by email & portal', at: after(1), tone: 'slate' },
      ];
      if (CB_OPEN.has(c.status)) steps.push({ label: 'Waiting for your response', note: `Respond by ${fmtDate(c.respondBy)}, ${fmtTime(c.respondBy)}`, tone: 'amber' });
      if (['Processing', 'Submit To Bank', 'Success', 'Cancel'].includes(c.status)) steps.push({ label: 'Evidence received — under review', at: after(72), tone: 'amber' });
      if (['Submit To Bank', 'Success', 'Cancel'].includes(c.status)) steps.push({ label: `Submitted to ${c.bank}`, at: after(120), tone: 'amber' });
      if (c.status === 'Success') steps.push({ label: 'Chargeback accepted — amount adjusted from settlement', at: after(200), tone: 'rose' });
      if (c.status === 'Cancel') steps.push({ label: 'Chargeback cancelled — no amount adjusted', at: after(200), tone: 'emerald' });

      return drawerShell({
        title: 'Chargeback Information',
        sub: `<span class="font-mono text-xs">${c.ref}</span>${cbBadge(c.status)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Transaction Amount', fmtBDT(t.amount))}
            ${statBox('Chargeback Amount', fmtBDT(c.amount), 'text-rose-600')}
            ${statBox('Respond By', rb ? `${fmtShort(c.respondBy)}<span class="block text-[11px] font-semibold ${rb.cls}">${rb.text}</span>` : '—')}
          </div>
          ${rb ? `<div class="flex items-start gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2.5 text-sm text-amber-800">${ic('triangle-alert', 'w-4 h-4 mt-0.5 shrink-0')}<span>Upload delivery proof, invoice or customer communication before the deadline. Without a response the chargeback may be accepted automatically (mock rule).</span></div>` : ''}
          ${section('Key Information', kvGrid([
            kv('Chargeback Reference ID', c.ref, true),
            kv('Request Status', cbBadge(c.status)),
            kv('Chargeback Reason', c.reason),
            kv('Chargeback Stage', c.stage),
            kv('Bank Name', c.bank),
            kv('Requested On', `${fmtDate(c.date)}, ${fmtTime(c.date, true)}`),
          ]))}
          ${section('Transaction Details', txnSummary(t))}
          ${section('Store', storeSummary(c))}
          ${section('Progress', timeline(steps))}
          ${PCI_NOTE}`,
        footer: `
          <button data-action="open-txn" data-value="${t.id}" class="${BTN_SECONDARY}">${ic('receipt', 'w-4 h-4')}View Transaction</button>
          ${rb ? `<button data-action="toast" data-msg="Prototype: evidence upload is not wired up." class="${BTN_PRIMARY}">${ic('upload', 'w-4 h-4')}Submit Evidence</button>` : ''}`,
      });
    }

    let drawerReturnFocus = null;
    const FIELD_KEYS = ['id', 'data-link', 'data-link-color', 'data-inv', 'data-inv-item', 'data-mc', 'data-ticket', 'data-user', 'data-group', 'data-other', 'data-join-store', 'data-group-store'];
    // Remembers which field had focus so a re-render (validation, add item…) can put it back.
    function focusKey(el) {
      if (!el || el === document.body) return null;
      for (const k of FIELD_KEYS) if (el.hasAttribute?.(k)) return `[${k}="${CSS.escape(el.getAttribute(k))}"]`;
      return el.dataset?.action ? `[data-action="${el.dataset.action}"]${el.dataset.value ? `[data-value="${CSS.escape(el.dataset.value)}"]` : ''}` : null;
    }

    function renderDrawer() {
      const root = $('#drawer-root');
      const wasOpen = !!root.firstElementChild;
      if (!drawer) {
        root.innerHTML = '';
        document.body.style.overflow = '';
        if (wasOpen && drawerReturnFocus?.isConnected) drawerReturnFocus.focus();
        drawerReturnFocus = null;
        return;
      }
      const key = wasOpen ? focusKey(document.activeElement) : null;
      if (!wasOpen) drawerReturnFocus = document.activeElement;
      document.body.style.overflow = 'hidden';
      const render = { txn: txnDrawer, refund: refundDrawer, cb: cbDrawer, settlement: settlementDrawer, fy: fyDrawer, link: linkDrawer, 'link-new': linkFormDrawer, invoice: invoiceDrawer, 'invoice-new': invoiceFormDrawer, emi: emiDrawer, partner: partnerDrawer, 'partner-join': joinDrawer, mc: mcDrawer, 'mc-new': mcFormDrawer, tt: ttDrawer, 'tt-new': ttFormDrawer, gt: gtDrawer, 'gt-new': gtFormDrawer, sr: srDrawer, 'sr-new': srFormDrawer, store: storeDrawer, group: groupDrawer, 'group-new': groupFormDrawer, user: userDrawer, 'user-new': userFormDrawer, 'referral-new': referralFormDrawer, 'sms-buy': smsBuyDrawer, video: videoDrawer }[drawer.kind];
      root.innerHTML = render(drawer.item);
      lucide.createIcons();
      makeKeyboardReachable(root);
      const panel = $('#drawer-panel');
      const firstError = Object.keys(formErrors).length && panel.querySelector('.text-rose-600')?.closest('label, section, div')?.querySelector('input, select, textarea');
      const target = firstError || (key && panel.querySelector(key)) || (!wasOpen && (panel.querySelector('input:not([disabled]), select, textarea') || panel.querySelector('[data-drawer-close]')));
      target?.focus();
    }

    // Rows and cards that open something are divs/trs; give them a tab stop and a role.
    function makeKeyboardReachable(root) {
      root.querySelectorAll('[data-action]:not(button):not(a):not(input):not(select):not(textarea):not([data-backdrop])').forEach(el => {
        if (!el.hasAttribute('tabindex')) el.setAttribute('tabindex', '0');
        if (!el.hasAttribute('role')) el.setAttribute('role', 'button');
      });
    }

    function closeDrawer() {
      drawer = null;
      linkDraft = invDraft = joinDraft = mcDraft = ticketDraft = groupDraft = userDraft = otherDraft = null;
      formErrors = {};
      renderDrawer();
    }

    // =====================================================================
    // Dashboard
    // =====================================================================
    const DASH_PRESETS = [
      { value: 'today', label: 'Today' },
      { value: '7d', label: '7 Days' },
      { value: '30d', label: '30 Days' },
      { value: 'this_month', label: 'This Month' },
    ];

    function dashData() {
      const { from, to } = presetRange(dash.preset);
      const span = to - from;
      const prevFrom = new Date(from.getTime() - span), prevTo = new Date(from.getTime() - 1);
      const inStore = (t) => dash.store === 'all' || t.store === dash.store;
      const cur = TXNS.filter(t => inStore(t) && t.date >= from && t.date <= to);
      const prev = TXNS.filter(t => inStore(t) && t.date >= prevFrom && t.date <= prevTo);

      const summarize = (list) => {
        const success = list.filter(t => t.status === 'success');
        const sales = success.reduce((s, t) => s + t.amount, 0);
        return { total: list.length, success: success.length, sales, rate: list.length ? success.length / list.length * 100 : 0, avg: success.length ? sales / success.length : 0 };
      };

      const hourly = dash.preset === 'today';
      const buckets = [];
      if (hourly) {
        for (let h = 0; h <= NOW.getHours(); h++) buckets.push({ label: `${pad(h)}:00`, from: new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate(), h), to: new Date(TODAY.getFullYear(), TODAY.getMonth(), TODAY.getDate(), h, 59, 59, 999) });
      } else {
        for (let d = startOfDay(from); d <= to; d = addDays(d, 1)) buckets.push({ label: fmtShort(d), from: d, to: endOfDay(d) });
      }
      const series = buckets.map(b => ({ label: b.label, ...summarize(cur.filter(t => t.date >= b.from && t.date <= b.to)) }));

      const byHour = Array.from({ length: 24 }, (_, h) => cur.filter(t => t.date.getHours() === h).length);

      const success = cur.filter(t => t.status === 'success');
      const channelTypes = [...new Set(METHODS.map(m => m.type))];
      const totalSales = success.reduce((s, t) => s + t.amount, 0) || 1;
      const channels = channelTypes.map(type => {
        const list = success.filter(t => t.type === type);
        const amount = list.reduce((s, t) => s + t.amount, 0);
        return { type, amount, count: list.length, share: amount / totalSales * 100 };
      }).sort((a, b) => b.amount - a.amount);

      const stl = SETTLEMENTS.filter(x => inStore(x));
      const pending = stl.filter(x => x.status === 'Pending');
      const pendingSettlement = pending.reduce((s, x) => s + x.settle, 0);
      const nextPayout = pending.length ? new Date(Math.min(...pending.map(x => x.date))) : null;
      const lastPaid = stl.find(x => x.status === 'Paid');
      const lastSettledAt = lastPaid?.date || null;
      const lastSettled = stl.filter(x => x.status === 'Paid' && +x.date === +lastSettledAt).reduce((s, x) => s + x.paid, 0);

      return { from, to, cur, now: summarize(cur), prev: summarize(prev), series, byHour, channels, pendingSettlement, nextPayout, lastSettled, lastSettledAt };
    }

    function spark(values, color) {
      if (values.length < 2) return '';
      const max = Math.max(...values), min = Math.min(...values);
      const pts = values.map((v, i) => `${(i / (values.length - 1)) * 100},${38 - ((v - min) / ((max - min) || 1)) * 34}`).join(' ');
      return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" class="w-full h-full"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
    }

    function statCard({ title, value, cur, prev, series, pp }) {
      let delta = null;
      if (pp) delta = cur - prev;
      else if (prev) delta = (cur - prev) / prev * 100;
      const up = delta !== null && delta >= 0;
      const text = delta === null ? 'No data for previous period' : `${up ? '+' : ''}${delta.toFixed(1)}${pp ? ' pts' : '%'} vs previous period`;
      return `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 flex flex-col hover:shadow-md transition-shadow">
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1">${title}</p>
          <div class="flex items-end justify-between gap-3">
            <div class="min-w-0">
              <p class="text-2xl font-bold text-slate-900 truncate">${value}</p>
              <p class="text-xs mt-1 font-medium ${delta === null ? 'text-slate-400' : up ? 'text-emerald-600' : 'text-rose-600'}">${text}</p>
            </div>
            <div class="w-24 h-10 shrink-0">${spark(series, '#295cab')}</div>
          </div>
        </div>`;
    }

    const cardHead = (title, sub, right = '') => `
      <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between gap-3">
        <div><h3 class="text-sm font-semibold text-slate-900">${title}</h3>${sub ? `<p class="text-xs text-slate-500 mt-0.5">${sub}</p>` : ''}</div>${right}
      </div>`;

    function renderDashboard() {
      const d = dashData();
      const peak = d.byHour.indexOf(Math.max(...d.byHour));
      const failedCount = d.cur.filter(t => t.status === 'failed').length;
      const pendingCount = d.cur.filter(t => t.status === 'pending').length;
      const recent = d.cur.slice(0, 6);
      const hourLabel = (h) => `${pad(h % 12 || 12)} ${h >= 12 ? 'PM' : 'AM'}`;

      const attention = [
        { icon: 'circle-x', tone: 'text-rose-600 bg-rose-50', title: 'Failed transactions', sub: 'In the selected period', value: failedCount, action: `data-action="goto-txn" data-status="failed"` },
        { icon: 'clock', tone: 'text-amber-600 bg-amber-50', title: 'Pending transactions', sub: 'Waiting for provider confirmation', value: pendingCount, action: `data-action="goto-txn" data-status="pending"` },
        { icon: 'undo-2', tone: 'text-indigo-600 bg-indigo-50', title: 'Refund requests', sub: 'Open — in review or with the bank', value: REFUNDS.filter(r => REFUND_OPEN.has(r.status)).length, action: `data-action="goto-list" data-path="${REFUND_PATH}" data-status="pending"` },
        { icon: 'shield-alert', tone: 'text-slate-600 bg-slate-100', title: 'Chargebacks to respond', sub: 'Waiting for your evidence', value: CHARGEBACKS.filter(c => CB_OPEN.has(c.status)).length, action: `data-action="goto-list" data-path="${CB_PATH}" data-status="action"` },
      ];
      const quick = [
        { icon: 'link', label: 'Create Payment Link', to: '/products/payment-links' },
        { icon: 'qr-code', label: 'Generate Payment QR', to: '/products/payment-qr' },
        { icon: 'file-text', label: 'Create Digital Invoice', to: '/products/digital-invoices' },
      ];

      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4 flex-wrap">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Dashboard</h1>

    function mountDashboardCharts() {
      if (!window.Chart) return;

        data: {
          labels: d.series.map(x => x.label),

            { type: 'bar', label: 'Sales', data: d.series.map(x => x.sales), backgroundColor: '#295cab', hoverBackgroundColor: '#4a75ba', borderRadius: 4, maxBarThickness: 28 },
          ],
        },
        options: {
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: (c) => ` ${fmtBDT(c.raw)} · Sales`, afterLabel: (c) => ` ${d.series[c.dataIndex].success} successful of ${d.series[c.dataIndex].total} transactions` } },
          },
          scales: {
            x: { grid: { display: false } },

      }));

          datasets: [{ label: 'Transactions', data: d.byHour, backgroundColor: d.byHour.map(v => v === peak ? '#295cab' : '#c1d2eb'), borderRadius: 3 }],
        },

    // =====================================================================
    // Shared list-page pieces (Refund & Chargeback Requests)
    // =====================================================================
    const TRACKING_PATH = '/transactions/tracking';

    const dateCell = (d) => `<div class="text-slate-800 font-medium whitespace-nowrap">${fmtDate(d)}</div><div class="text-xs text-slate-500">${fmtTime(d, true)}</div>`;

      ${sub ? `<div class="text-[11px] text-slate-500 font-mono">${sub}</div>` : ''}`;

    function paginate(s, rows) {
      const totalPages = Math.max(1, Math.ceil(rows.length / s.pageSize));
      s.page = Math.min(s.page, totalPages);
      const start = (s.page - 1) * s.pageSize;
      return { totalPages, start, pageRows: rows.slice(start, start + s.pageSize) };
    }

    const LIST_FILTER_KEYS = ['status', 'store', 'stage', 'stype', 'bstatus', 'bank', 'currency', 'emi', 'role'];
    function listFilterBar(s, placeholder, pills, { noDate = false, noStore = false } = {}) {

    function listToolbar(count, noun, s) {

          <button data-action="export" class="flex items-center gap-2 px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-200 rounded-md hover:bg-slate-50 transition-colors shadow-sm shrink-0">${ic('download', 'w-4 h-4')}Export CSV</button>

    // Same look as the transactions table; no horizontal scroll (low-priority columns hide on narrow screens).
    function dataTable({ cols, rows, rowAttrs, emptyTitle }) {
      const cellCls = (c) => `${c.right ? 'text-right' : ''} ${c.cls || ''}`;
      return `
        <div class="rounded-md border border-slate-200 bg-white shadow-sm overflow-hidden">
          <table class="w-full text-left text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
              <tr>
                ${cols.map(c => `<th class="h-10 px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap ${cellCls(c)}">${c.label}</th>`).join('')}
                <th class="h-10 px-3 w-10"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              ${rows.length ? rows.map(r => `
                <tr ${rowAttrs(r)} class="hover:bg-slate-50 transition-colors cursor-pointer">
                  ${cols.map(c => `<td class="px-3 py-2 align-middle text-slate-700 ${cellCls(c)}">${c.cell(r)}</td>`).join('')}
                  <td class="px-3 py-2 text-slate-400">${ic('chevron-right', 'w-4 h-4')}</td>
                </tr>`).join('') : `
                <tr><td colspan="${cols.length + 1}">
                  <div class="flex flex-col items-center justify-center py-12 px-4 text-center">
