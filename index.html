  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
  <script src="https://unpkg.com/lucide@0.475.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>

  <!-- Same design tokens as the KAM panel (src/index.css) -->
  <style type="text/tailwindcss">
    @theme {
      --color-primary-50: #f0f4fa;
      --color-primary-100: #dde6f4;
      --color-primary-200: #c1d2eb;
      --color-primary-300: #99b5df;
      --color-primary-400: #6c93ce;
      --color-primary-500: #4a75ba;
      --color-primary-600: #295cab;
      --color-primary-700: #264f8f;
      --color-primary-800: #234475;
      --color-primary-900: #223a60;
      --color-primary-950: #17253d;
      --color-primary: var(--color-primary-600);
      --font-sans: "Inter", "sans-serif";
    }
  </style>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="no-anim font-sans antialiased text-slate-800 bg-white">
  <aside id="sidebar"></aside>

    <header id="header" class="h-16 bg-white border-b border-slate-200 flex items-center justify-between gap-3 px-4 md:px-6 sticky top-0 z-30"></header>
    <main id="page" class="flex-1 p-4 md:p-6 bg-slate-50 overflow-x-hidden"></main>
  </div>
  <div id="drawer-root"></div>
  <div id="toast-root" class="fixed top-4 right-4 z-[200] space-y-2"></div>

  <!-- Classic scripts (not modules) so they share one global scope and the page still
       opens straight from disk. Order matters: each file may use what earlier ones define. -->

  <script src="js/helpers.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>

  <script src="pages/products/payment-qr.js"></script>
  <script src="pages/products/digital-emi.js"></script>
