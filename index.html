    function pager(s, total, start, shown, totalPages) {
      return `
        <div class="flex items-center justify-between px-2">
          <div class="flex items-center gap-3 text-sm text-slate-500">
            <span>Showing ${total ? start + 1 : 0}–${start + shown} of ${total.toLocaleString()}</span>
            <select data-change="page-size" class="px-2 py-1 bg-white border border-slate-200 rounded text-sm text-slate-600 focus:outline-none focus:border-primary-500">
              ${[10, 20, 50, 100].map(n => `<option value="${n}" ${n === s.pageSize ? 'selected' : ''}>${n} / page</option>`).join('')}
            </select>
          </div>
          <div class="flex items-center space-x-2">
            <button data-action="page" data-value="-1" ${s.page <= 1 ? 'disabled' : ''} class="px-3 py-1 text-sm border border-slate-200 rounded bg-white hover:bg-slate-50 disabled:opacity-50">Previous</button>
            <span class="text-sm text-slate-600">Page ${s.page} of ${totalPages}</span>
            <button data-action="page" data-value="1" ${s.page >= totalPages ? 'disabled' : ''} class="px-3 py-1 text-sm border border-slate-200 rounded bg-white hover:bg-slate-50 disabled:opacity-50">Next</button>
          </div>
        </div>`;
    }

    function downloadCsv(name, header, rows) {
      if (!rows.length) { toast('Nothing to export for these filters'); return; }
      const cell = (v) => `"${String(v).replace(/"/g, '""')}"`;
      const lines = [header.map(cell).join(','), ...rows.map(r => r.map(cell).join(','))];
      const blob = new Blob(['﻿' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${name}-${toDateInput(NOW)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
      toast(`Exported ${rows.length.toLocaleString()} rows (mock data)`, 'success');
    }

    // =====================================================================
    // Transaction ID Tracking
    // =====================================================================
    function runTracking() {
      const ids = [...new Set(tracking.query.split(/[\s,;]+/).map(x => x.trim()).filter(Boolean))].slice(0, 20);
      tracking.results = ids.map(id => {
        const q = id.toLowerCase();
        return { id, txn: TXNS.find(t => t.id.toLowerCase() === q || t.valId.toLowerCase() === q || t.bankTranId === id) };
      });
    }

    const settlementTime = (t) => new Date(t.date.getFullYear(), t.date.getMonth(), t.date.getDate() + 1, 11, 0);

    function journey(t) {
      const at = (d) => `${fmtShort(d)}, ${fmtTime(d)}`;
      const sec = (n) => new Date(t.date.getTime() + n * 1000);
      const steps = [{ label: 'Initiated', sub: at(t.date), state: 'done' }];
      if (t.status === 'failed') return [...steps, { label: 'Payment failed', sub: t.reason, state: 'failed' }];
      if (t.status === 'cancelled') return [...steps, { label: 'Cancelled', sub: 'Cancelled by customer', state: 'failed' }];
      if (t.status === 'pending') {
        return [...steps,
          { label: 'Authorization', sub: 'Awaiting provider', state: 'current' },
          { label: 'Validated (IPN)', sub: '—', state: 'upcoming' },
          { label: 'Settlement', sub: '—', state: 'upcoming' }];
      }
      steps.push({ label: 'Authorized', sub: at(sec(t.auth)), state: 'done' }, { label: 'Validated (IPN)', sub: at(sec(t.auth + 2)), state: 'done' });
      const settleAt = settlementTime(t);
      steps.push(settleAt <= NOW
        ? { label: 'Settled', sub: at(settleAt), state: 'done' }
        : { label: 'Settlement', sub: `Expected ${at(settleAt)}`, state: 'current' });
      const rf = REFUND_BY_TXN.get(t.id);
      if (rf) steps.push({ label: `Refund · ${rf.status}`, sub: fmtBDT(rf.amount), state: rf.status === 'Success' ? 'done' : rf.status === 'Cancelled' ? 'failed' : 'current' });
      const cb = CB_BY_TXN.get(t.id);
      if (cb) steps.push({ label: `Chargeback · ${cb.status}`, sub: cb.stage, state: CB_PENDING.has(cb.status) ? 'current' : 'done' });
      return steps;
    }

    const STEP_CLS = {
      done: 'bg-emerald-50 text-emerald-600 ring-1 ring-emerald-200',
      current: 'bg-amber-50 text-amber-600 ring-1 ring-amber-200',
      failed: 'bg-rose-50 text-rose-600 ring-1 ring-rose-200',
      upcoming: 'bg-white text-slate-300 ring-1 ring-slate-200',
    };
    const STEP_ICON = { done: 'check', current: 'clock', failed: 'x', upcoming: 'circle' };

    function stepper(steps) {
      return `
        <ol class="flex items-start">
          ${steps.map((s, i) => `
            <li class="flex-1 min-w-0">
              <div class="flex items-center">
                <span class="w-7 h-7 rounded-full flex items-center justify-center shrink-0 ${STEP_CLS[s.state]}">${ic(STEP_ICON[s.state], 'w-3.5 h-3.5')}</span>
                ${i < steps.length - 1 ? `<span class="flex-1 h-0.5 mx-2 rounded ${s.state === 'done' ? 'bg-emerald-300' : 'bg-slate-200'}"></span>` : ''}
              </div>
              <p class="mt-2 text-xs font-semibold text-slate-800 pr-3">${s.label}</p>
              <p class="text-[11px] text-slate-500 pr-3">${s.sub}</p>
            </li>`).join('')}
        </ol>`;
    }

    function trackCard(t) {
      const rf = REFUND_BY_TXN.get(t.id);
      const cb = CB_BY_TXN.get(t.id);
      const chip = (action, value, icon, text, badgeHtml) => `<button data-action="${action}" data-value="${value}" class="inline-flex items-center gap-2 pl-2.5 pr-1.5 py-1 rounded-full bg-white border border-slate-200 hover:border-slate-300 text-xs text-slate-700">${ic(icon, 'w-3.5 h-3.5 text-slate-500')}${text}${badgeHtml}</button>`;
      const related = [
        rf && chip('open-refund', rf.ref, 'undo-2', `Refund <span class="font-mono">${rf.ref}</span>`, refundBadge(rf.status)),
        cb && chip('open-cb', cb.ref, 'shield-alert', `Chargeback <span class="font-mono">${cb.ref}</span>`, cbBadge(cb.status)),
      ].filter(Boolean);
      return `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm">
          <div class="px-5 py-4 border-b border-slate-100 flex items-start justify-between gap-4">
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap"><span class="font-mono text-sm font-semibold text-slate-900">${t.id}</span>${badge(t.status)}</div>
              <p class="text-xs text-slate-500 mt-1">${fmtDate(t.date)}, ${fmtTime(t.date, true)} · ${esc(t.storeName)} · ${t.method} <span class="font-mono">${t.account}</span></p>
            </div>
            <div class="text-right shrink-0">
              <p class="text-xl font-bold text-slate-900">${fmtBDT(t.amount)}</p>
              <button data-action="open-txn" data-value="${t.id}" class="text-xs font-medium text-primary-600 hover:text-primary-700 hover:underline">View details</button>
            </div>
          </div>
          <div class="px-5 py-5">${stepper(journey(t))}</div>
          ${related.length ? `<div class="px-5 py-3 border-t border-slate-100 bg-slate-50/50 rounded-b-xl flex flex-wrap items-center gap-2"><span class="text-xs text-slate-500">Related:</span>${related.join('')}</div>` : ''}
        </div>`;
    }

    function renderTracking() {
      const settled = TXNS.find(t => t.status === 'success' && settlementTime(t) < addDays(NOW, -1) && !REFUND_BY_TXN.has(t.id) && !CB_BY_TXN.has(t.id));
      const samples = [
        { label: 'Settled', t: settled },
        { label: 'Failed', t: TXNS.find(t => t.status === 'failed') },
        { label: 'With refund', t: REFUNDS[0]?.txn },
        { label: 'With chargeback', t: CHARGEBACKS[0]?.txn },
      ].filter(s => s.t);
      const res = tracking.results;
      const found = res ? res.filter(r => r.txn).length : 0;

      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Transaction ID Tracking</h1>
            <p class="text-slate-500 text-sm">Follow a payment from checkout to settlement — including any refund or chargeback on it.</p>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5">
            <label for="track-input" class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Transaction ID</label>
            <div class="mt-2 flex gap-2">
              <div class="relative flex-1">
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none">${ic('search', 'w-4 h-4')}</span>
                <input id="track-input" type="text" value="${esc(tracking.query)}" autocomplete="off"
                  placeholder="Transaction ID, Val ID or Bank Transaction ID — paste several to track them together"
                  class="w-full pl-10 pr-3 py-2.5 bg-white border border-slate-200 rounded-lg text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-100 focus:border-primary-500">
              </div>
              <button data-action="track" class="${BTN_PRIMARY} rounded-lg px-5">${ic('scan-search', 'w-4 h-4')}Track</button>
            </div>
            <p class="text-xs text-slate-500 mt-2">Separate multiple IDs with a comma or space (up to 20).</p>
            <div class="mt-3 flex flex-wrap items-center gap-2">
              <span class="text-xs text-slate-500">Try a sample:</span>
              ${samples.map(s => `<button data-action="track-sample" data-value="${s.t.id}" class="px-2.5 py-1 rounded-full text-[11px] font-medium border ${PILL_IDLE}">${s.label}</button>`).join('')}
              <button data-action="track-sample" data-value="${samples.map(s => s.t.id).join(', ')}" class="px-2.5 py-1 rounded-full text-[11px] font-medium border ${PILL_IDLE}">All ${samples.length} at once</button>
            </div>
          </div>

          ${!res ? `
            <div class="flex flex-col items-center justify-center py-14 px-4 text-center rounded-xl border border-dashed border-slate-300">
              <div class="w-12 h-12 rounded-full bg-white flex items-center justify-center mb-4 ring-1 ring-slate-200">${ic('route', 'w-6 h-6 text-slate-300')}</div>
              <h3 class="text-sm font-semibold text-slate-900 mb-1">Track a payment</h3>
              <p class="text-xs text-slate-500 max-w-sm">Enter an ID above to see each step — initiated, authorized, validated, settled — plus any refund or chargeback.</p>
            </div>` : `
            <div class="space-y-4">
              <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-slate-900">Results</h2>
                <p class="text-xs text-slate-500">${found} of ${res.length} ID${res.length > 1 ? 's' : ''} found</p>
              </div>
              ${res.map(r => r.txn ? trackCard(r.txn) : `
                <div class="bg-white rounded-xl border border-dashed border-slate-300 px-5 py-4 flex items-center gap-3">
                  <span class="w-9 h-9 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center shrink-0">${ic('search-x', 'w-4 h-4')}</span>
                  <div>
                    <p class="text-sm font-semibold text-slate-900">No transaction found for <span class="font-mono">${esc(r.id)}</span></p>
                    <p class="text-xs text-slate-500">Check the ID, or make sure it belongs to one of your stores.</p>
                  </div>
                </div>`).join('')}
            </div>`}
        </div>`;
    }

    // =====================================================================
    // Refund Requests
    // =====================================================================
    function refundRows(s, withStatus = true) {
      const q = s.search.trim().toLowerCase();
      return REFUNDS.filter(r =>
        (s.store === 'all' || r.store === s.store) &&
        inRange(r, s.range) &&
        (!q || r.ref.toLowerCase().includes(q) || r.txn.id.toLowerCase().includes(q)) &&
        (!withStatus || s.status === 'all' || (s.status === 'pending' ? REFUND_OPEN.has(r.status) : r.status === s.status))
      );
    }

    function renderRefunds() {
      const s = pageState();
      const base = refundRows(s, false);
      const rows = refundRows(s);
      const { totalPages, start, pageRows } = paginate(s, rows);
      const success = base.filter(r => r.status === 'Success');
      const refunded = success.reduce((sum, r) => sum + r.amount, 0);
      const statusOpts = [{ label: 'All Statuses', value: 'all' }, { label: 'Pending (open)', value: 'pending' }, ...REFUND_STATUSES.map(v => ({ label: v, value: v }))];
      const cols = [
        { label: 'Requested', cell: r => dateCell(r.date) },
        // Below xl the Transaction ID moves under the Refund Ref. ID so the table never scrolls sideways.
        { label: 'Refund Ref. ID', cell: r => `${idCell(r.ref)}<div class="xl:hidden text-[11px] text-slate-500 font-mono">${r.txn.id}</div>` },
        { label: 'Transaction ID', cls: 'hidden xl:table-cell', cell: r => idCell(r.txn.id) },
        { label: 'Store', cls: 'hidden lg:table-cell', cell: r => esc(r.storeName) },
        { label: 'Refund Amount', right: true, cell: r => `<div class="font-semibold text-slate-900 whitespace-nowrap">${fmtBDT(r.amount)}</div><div class="text-xs text-slate-500 whitespace-nowrap">${r.type}${r.type === 'Partial' ? ` of ${fmtBDT(r.txn.amount)}` : ''}</div>` },
        { label: 'Status', cell: r => refundBadge(r.status) },
      ];

      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Refund Requests</h1>
              <p class="text-slate-500 text-sm">Refunds you've requested for customers — from approval to the customer's account.</p>
            </div>
            <button data-action="toast" data-msg="Prototype: open a successful transaction and use Request Refund." class="${BTN_PRIMARY} shrink-0">${ic('plus', 'w-4 h-4')}New Refund Request</button>
          </div>

          <div class="flex flex-col">
            ${listFilterBar(s, 'Ref. ID or Transaction ID', selectPill('list', 'status', 'Status', statusOpts, s.status, 'circle-dot'))}

            <div class="flex flex-col gap-4 pt-4">
              <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                ${metricCard({ title: 'Total Requests', value: base.length.toLocaleString(), status: 'all', selected: s.status === 'all' })}
                ${metricCard({ title: 'Pending Requests', value: base.filter(r => REFUND_OPEN.has(r.status)).length.toLocaleString(), status: 'pending', selected: s.status === 'pending' })}
                ${metricCard({ title: 'Successful Refunds', value: success.length.toLocaleString(), status: 'Success', selected: s.status === 'Success' })}
                ${metricCard({ title: 'Refunded Amount', value: fmtBDTShort(refunded), sub: fmtBDT(refunded) })}
              </div>
            </div>

            <div class="space-y-4 pt-6">
              ${listToolbar(rows.length, 'refund requests', s)}
              ${dataTable({ cols, rows: pageRows, rowAttrs: r => `data-action="open-refund" data-value="${r.ref}"`, emptyTitle: 'No refund requests found' })}
              ${pager(s, rows.length, start, pageRows.length, totalPages)}
            </div>
          </div>
        </div>`;
    }

    // =====================================================================
    // Chargeback Requests
    // =====================================================================
    function cbRows(s, withStatus = true) {
      const q = s.search.trim().toLowerCase();
      const statusOk = (c) => s.status === 'all'
        || (s.status === 'action' ? CB_OPEN.has(c.status) : s.status === 'pending' ? CB_PENDING.has(c.status) : c.status === s.status);
      return CHARGEBACKS.filter(c =>
        (s.store === 'all' || c.store === s.store) &&
        (s.stage === 'all' || c.stage === s.stage) &&
        inRange(c, s.range) &&
        (!q || c.ref.toLowerCase().includes(q) || c.txn.id.toLowerCase().includes(q)) &&
        (!withStatus || statusOk(c))
      );
    }

    function renderChargebacks() {
      const s = pageState();
      const base = cbRows(s, false);
      const rows = cbRows(s);
      const { totalPages, start, pageRows } = paginate(s, rows);
      const success = base.filter(c => c.status === 'Success');
      const cbAmount = success.reduce((sum, c) => sum + c.amount, 0);
      const needAction = CHARGEBACKS.filter(c => CB_OPEN.has(c.status)).sort((a, b) => a.respondBy - b.respondBy);
      const statusOpts = [
        { label: 'All Statuses', value: 'all' },
        { label: 'Needs your response', value: 'action' },
        { label: 'Pending (open)', value: 'pending' },
        ...CB_STATUSES.map(v => ({ label: v, value: v })),
      ];
      const stageOpts = [{ label: 'All Stages', value: 'all' }, ...CB_STAGES.map(x => ({ label: x.v, value: x.v }))];
      const cols = [
        { label: 'Requested', cell: c => dateCell(c.date) },
        { label: 'Chargeback Ref. ID', cell: c => idCell(c.ref, c.txn.id) },
        { label: 'Store', cls: 'hidden lg:table-cell', cell: c => esc(c.storeName) },
        { label: 'Stage & Reason', cls: 'hidden xl:table-cell', cell: c => `<div class="font-medium text-slate-800">${c.stage}</div><div class="text-xs text-slate-500">${c.reason}</div>` },
        { label: 'Amount', right: true, cell: c => `<span class="font-semibold text-slate-900 whitespace-nowrap">${fmtBDT(c.amount)}</span>` },
        { label: 'Respond By', cell: c => { const rb = respondBy(c); return rb ? `<div class="whitespace-nowrap text-slate-800">${fmtDate(c.respondBy)}</div><div class="text-xs font-semibold ${rb.cls}">${rb.text}</div>` : '<span class="text-slate-400">—</span>'; } },
        { label: 'Status', cell: c => cbBadge(c.status) },
      ];

      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Chargeback Requests</h1>
            <p class="text-slate-500 text-sm">Disputes customers raised through their card issuer. Respond before the deadline with supporting documents.</p>
          </div>

          ${needAction.length ? `
            <div class="flex items-start gap-3 rounded-xl border border-amber-200 bg-amber-50 px-4 py-3">
              <span class="w-8 h-8 rounded-full bg-white text-amber-600 flex items-center justify-center shrink-0 ring-1 ring-amber-200">${ic('triangle-alert', 'w-4 h-4')}</span>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-amber-900">${needAction.length} chargeback${needAction.length > 1 ? 's need' : ' needs'} your response</p>
                <p class="text-xs text-amber-800 mt-0.5">Earliest deadline: ${fmtDate(needAction[0].respondBy)}, ${fmtTime(needAction[0].respondBy)}. Submit evidence such as delivery proof or an invoice before then (mock rule).</p>
              </div>
              <button data-action="cb-needs-response" class="shrink-0 px-3 py-1.5 text-xs font-semibold text-amber-900 bg-white border border-amber-200 rounded-full hover:bg-amber-100">Show them</button>
            </div>` : ''}

          <div class="flex flex-col">
            ${listFilterBar(s, 'Ref. ID or Transaction ID',
              selectPill('list', 'status', 'Status', statusOpts, s.status, 'circle-dot') +
              selectPill('list', 'stage', 'Stage', stageOpts, s.stage, 'layers'))}

            <div class="flex flex-col gap-4 pt-4">
              <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                ${metricCard({ title: 'Total Requests', value: base.length.toLocaleString(), status: 'all', selected: s.status === 'all' })}
                ${metricCard({ title: 'Pending Requests', value: base.filter(c => CB_PENDING.has(c.status)).length.toLocaleString(), status: 'pending', selected: s.status === 'pending' })}
                ${metricCard({ title: 'Successful Chargeback', value: success.length.toLocaleString(), status: 'Success', selected: s.status === 'Success' })}
                ${metricCard({ title: 'Chargeback Amount', value: fmtBDTShort(cbAmount), sub: fmtBDT(cbAmount) })}
              </div>
            </div>

            <div class="space-y-4 pt-6">
              ${listToolbar(rows.length, 'chargebacks', s)}
              ${dataTable({ cols, rows: pageRows, rowAttrs: c => `data-action="open-cb" data-value="${c.ref}"`, emptyTitle: 'No chargebacks found' })}
              ${pager(s, rows.length, start, pageRows.length, totalPages)}
            </div>
          </div>
        </div>`;
    }

    // =====================================================================
    // Settlement Report
    // =====================================================================
    const SETTLEMENT_PATH = '/settlements/settlement-report';
    const FY_PATH = '/settlements/financial-year-report';
    const SETTLE_STATUSES = ['Paid', 'Pending', 'On Hold'];
    const SETTLE_TYPES = ['Online', 'Physical', 'Qr Payment', 'Both'];
    const SETTLE_CLS = { 'Paid': 'bg-emerald-50 text-emerald-600', 'Pending': 'bg-amber-50 text-amber-600', 'On Hold': 'bg-rose-50 text-rose-600' };
    const settleBadge = (s) => `<span class="${STATUS_BADGE} ${SETTLE_CLS[s]}">${s}</span>`;
    const fmtBDT0 = (n) => `৳${Math.round(n).toLocaleString('en-US')}`;

    function miniTable(headers, rows, { right = [], total } = {}) {
      const al = (i) => right.includes(i) ? 'text-right' : '';
      return `
        <div class="rounded-md border border-slate-200 overflow-hidden">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 border-b border-slate-200"><tr>${headers.map((h, i) => `<th class="px-2.5 py-2 font-semibold text-slate-500 uppercase tracking-wider leading-tight ${al(i)}">${h}</th>`).join('')}</tr></thead>
            <tbody class="divide-y divide-slate-100">${rows.map(r => `<tr>${r.map((c, i) => `<td class="px-2.5 py-2 text-slate-700 tabular-nums whitespace-nowrap ${al(i)}">${c}</td>`).join('')}</tr>`).join('')}</tbody>
            ${total ? `<tfoot class="bg-slate-50 border-t border-slate-200"><tr>${total.map((c, i) => `<td class="px-2.5 py-2 font-semibold text-slate-900 tabular-nums whitespace-nowrap ${al(i)}">${c}</td>`).join('')}</tr></tfoot>` : ''}
          </table>
        </div>`;
    }

    function settlementRows(s, withStatus = true) {
      const q = s.search.trim().toLowerCase();
      return SETTLEMENTS.filter(x =>
        (s.store === 'all' || x.store === s.store) &&
        (s.stype === 'all' || x.type === s.stype) &&
        // Scheduled payouts are dated in the future, so match them on their business day instead.
        (inRange(x, s.range) || (x.status === 'Pending' && inRange({ date: x.day }, s.range))) &&
        (!q || x.ref.toLowerCase().includes(q) || String(x.batch).includes(q)) &&
        (!withStatus || s.status === 'all' || (s.status === 'bounce' ? x.bounce : x.status === s.status))
      );
    }

    function renderSettlements() {
      const s = pageState();
      const base = settlementRows(s, false);
      const rows = settlementRows(s);
      const { totalPages, start, pageRows } = paginate(s, rows);
      const sum = (list, key) => list.reduce((t, x) => t + x[key], 0);
      const paid = base.filter(x => x.status === 'Paid');
      const pending = base.filter(x => x.status === 'Pending');
      const held = base.filter(x => x.status === 'On Hold');
      const bounced = base.filter(x => x.bounce);
      const statusOpts = [{ label: 'All Status', value: 'all' }, ...SETTLE_STATUSES.map(v => ({ label: v, value: v })), { label: 'Bounced', value: 'bounce' }];
      const typeOpts = [{ label: 'All Settlement Type', value: 'all' }, ...SETTLE_TYPES.map(v => ({ label: v, value: v }))];
      const cols = [
        { label: 'Settlement Date', cell: x => dateCell(x.date) },
        { label: 'Reference No', cell: x => idCell(x.ref, `Batch ${x.batch}`) },
        { label: 'Store', cls: 'hidden lg:table-cell', cell: x => `${esc(x.storeName)}<div class="text-xs text-slate-500">${x.txnCount} transactions</div>` },
        { label: 'Bank Information', cls: 'hidden 2xl:table-cell', cell: x => `<div>${esc(x.bank.payee)}</div><div class="text-xs text-slate-500">${x.bank.bank} - ${x.bank.branch}</div><div class="text-xs text-slate-500 font-mono">${x.bank.account}</div>` },
        { label: 'Type', cls: 'hidden xl:table-cell', cell: x => x.type },
        {
          label: 'Amount', right: true, cell: x => `
            <div class="font-semibold text-slate-900 whitespace-nowrap">${fmtBDT(x.settle)}</div>
            <div class="text-xs whitespace-nowrap ${x.status === 'Paid' ? 'text-emerald-600' : 'text-amber-600'}">${x.status === 'Paid' ? `Paid ${fmtBDT(x.paid)}` : x.status === 'On Hold' ? `Fwd ${fmtBDT(x.fwd)}` : 'Scheduled'}</div>`
        },
        { label: 'Status', cell: x => `${settleBadge(x.status)}${x.bounce ? `<div class="text-[11px] font-semibold text-rose-600 mt-0.5">Bounced</div>` : ''}` },
      ];

      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Settlement Report</h1>
            <p class="text-slate-500 text-sm">Payouts to your bank account — one settlement per store per business day.</p>
          </div>

          ${held.length ? `
            <div class="flex items-start gap-3 rounded-xl border border-rose-200 bg-rose-50 px-4 py-3">
              <span class="w-8 h-8 rounded-full bg-white text-rose-600 flex items-center justify-center shrink-0 ring-1 ring-rose-200">${ic('circle-pause', 'w-4 h-4')}</span>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-rose-900">${fmtBDT(sum(held, 'fwd'))} is on hold across ${held.length} settlement${held.length > 1 ? 's' : ''}</p>
                <p class="text-xs text-rose-800 mt-0.5">Held amounts are forwarded to the store's next settlement once the issue is resolved. Check the bank account details or contact your KAM.</p>
              </div>
              <button data-action="overview-status" data-value="On Hold" class="shrink-0 px-3 py-1.5 text-xs font-semibold text-rose-900 bg-white border border-rose-200 rounded-full hover:bg-rose-100">Show them</button>
            </div>` : ''}

          <div class="flex flex-col">
            ${listFilterBar(s, 'Reference No or Batch No',
              selectPill('list', 'status', 'Settlement Status', statusOpts, s.status, 'circle-dot') +
              selectPill('list', 'stype', 'Settlement Type', typeOpts, s.stype, 'layers'))}

            <div class="flex flex-col gap-4 pt-4">
              <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                ${metricCard({ title: 'Settled Amount', value: fmtBDTShort(sum(paid, 'paid')), sub: `${paid.length} paid settlements`, status: 'Paid', selected: s.status === 'Paid' })}
                ${metricCard({ title: 'Pending Settlement', value: fmtBDTShort(sum(pending, 'settle')), sub: `${pending.length} scheduled`, status: 'Pending', selected: s.status === 'Pending' })}
                ${metricCard({ title: 'On Hold', value: fmtBDTShort(sum(held, 'fwd')), sub: `${held.length} held`, status: 'On Hold', selected: s.status === 'On Hold' })}
                ${metricCard({ title: 'Bounce Count', value: bounced.length.toLocaleString(), sub: `Bounce amount ${fmtBDT(sum(bounced, 'fwd'))}`, status: 'bounce', selected: s.status === 'bounce' })}
              </div>
            </div>

            <div class="space-y-4 pt-6">
              ${listToolbar(rows.length, 'settlements', s)}
              ${dataTable({ cols, rows: pageRows, rowAttrs: x => `data-action="open-settlement" data-value="${x.ref}"`, emptyTitle: 'No settlements found' })}
              ${pager(s, rows.length, start, pageRows.length, totalPages)}
            </div>
          </div>
        </div>`;
    }

    function settlementDrawer(x) {
      const line = (label, value, cls = 'text-slate-800') => `<div class="flex items-center justify-between py-1.5 text-sm"><span class="text-slate-500">${label}</span><span class="font-medium tabular-nums ${cls}">${value}</span></div>`;
      const totals = (key) => x.summary.reduce((s, r) => s + r[key], 0);
      return drawerShell({
        wide: true,
        title: 'Settlement Details',
        sub: `<span class="font-mono text-xs">${x.ref}</span>${settleBadge(x.status)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Settle Amount', fmtBDT(x.settle))}
            ${statBox('Paid Amount', fmtBDT(x.paid), 'text-emerald-600')}
            ${statBox('Forwarded', fmtBDT(x.fwd), x.fwd ? 'text-amber-600' : 'text-slate-900')}
          </div>
          ${x.holdReason ? `<div class="flex items-start gap-2 rounded-lg border border-rose-100 bg-rose-50 px-3 py-2.5 text-sm text-rose-700">${ic('circle-alert', 'w-4 h-4 mt-0.5 shrink-0')}<span><span class="font-semibold">${x.bounce ? 'Bounced' : 'On hold'}:</span> ${x.holdReason}. The amount will be forwarded to the next settlement.</span></div>` : ''}

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
            ${section('General Information', `<dl class="grid grid-cols-1 gap-y-3 text-sm">
              ${kv('Settlement Date', `${fmtDate(x.date)}, ${fmtTime(x.date)}`)}
              ${kv('Business Day', fmtDate(x.day))}
              ${kv('Reference No', x.ref, true)}
              ${kv('Batch No', x.batch, true)}
              ${kv('Store Name', esc(x.storeName))}
              ${kv('Settlement Type', x.type)}
              ${kv('Total Amount', fmtBDT(x.total))}
            </dl>`)}
            ${section('Amount Stacking', `<div class="rounded-lg border border-slate-200 px-4 py-2">
              ${line('Opening Amt', fmtBDT(x.opening))}
              ${line('+ Payable Amt', fmtBDT(x.payable))}
              <div class="border-t border-slate-200 mt-1 pt-1">${line('Settle Amt', fmtBDT(x.settle), 'text-slate-900 font-bold')}</div>
              ${line('Paid Amt', fmtBDT(x.paid), 'text-emerald-600')}
              ${line('Fwd Amt', fmtBDT(x.fwd), 'text-amber-600')}
            </div>`)}
          </div>

          ${section('Transaction Summary', miniTable(
            ['Type', 'No. of Trans', 'SSL Amt', 'Bank Amt', 'Store Amt', 'Deduct Amt'],
            x.summary.map(r => [r.type, r.count || '—', fmtBDT(r.ssl), fmtBDT(r.bank), fmtBDT(r.store), r.deduct ? `<span class="text-rose-600">${fmtBDT(r.deduct)}</span>` : fmtBDT(0)]),
            { right: [1, 2, 3, 4, 5], total: ['Total', x.txnCount, fmtBDT(totals('ssl')), fmtBDT(totals('bank')), fmtBDT(totals('store')), fmtBDT(totals('deduct'))] }))}

          ${section('Payment Information', x.payments.length
            ? miniTable(['Cheque SL', 'Cheque Ref', 'Acct Payee', 'Amount', 'Bank'], x.payments.map(p => [p.sl, `<span class="font-mono">${p.ref}</span>`, esc(p.payee), fmtBDT(p.amount), p.bank]), { right: [3] })
            : `<p class="text-sm text-slate-500 rounded-lg border border-dashed border-slate-300 px-3 py-3">No payment issued yet${x.status === 'Pending' ? ` — scheduled for ${fmtDate(x.date)}, ${fmtTime(x.date)}` : ''}.</p>`)}

          ${section('Bank Account Details', kvGrid([
            kv('Payee Name', esc(x.bank.payee)),
            kv('Bank Name', x.bank.bank),
            kv('Branch Name', x.bank.branch),
            kv('Account Number', x.bank.account, true),
            kv('Routing Number', x.bank.routing, true),
          ]))}
          <p class="flex items-center gap-1.5 text-[11px] text-slate-400">${ic('shield-check', 'w-3.5 h-3.5')}Bank account and routing numbers are masked. SSL Amt / Bank Amt split is mock data.</p>`,
        footer: `
          <button data-action="settlement-txns" data-value="${x.ref}" class="${BTN_SECONDARY}">${ic('list', 'w-4 h-4')}View Transactions</button>
          <button data-action="toast" data-msg="Prototype: settlement email was not resent." class="${BTN_SECONDARY}">${ic('mail', 'w-4 h-4')}Resend Email</button>
          <button data-action="toast" data-msg="Prototype: statement download is not wired up." class="${BTN_PRIMARY}">${ic('file-down', 'w-4 h-4')}Download Statement</button>`,
      });
    }

    // =====================================================================
    // Financial Year Report
    // =====================================================================
    const fyOpen = new Set([CURRENT_FY - 1]);
    const FY_CLS = {
      'Generated': 'bg-emerald-50 text-emerald-600 border border-emerald-100',
      'Processing': 'bg-amber-50 text-amber-600 border border-amber-100',
      'In Progress': 'bg-blue-50 text-blue-600 border border-blue-100',
    };
    const fyBadge = (s) => `<span class="px-2 py-1 rounded-full text-[10px] font-medium uppercase tracking-wide whitespace-nowrap ${FY_CLS[s]}">${s}</span>`;
    const fyStores = (y) => STORES.filter(st => fyMonths(y, st.id).some(m => m.gross > 0));
    const addMonths = (a, b) => a.map((m, i) => ({ ...m, txns: m.txns + b[i].txns, gross: m.gross + b[i].gross, fees: m.fees + b[i].fees, refunds: m.refunds + b[i].refunds, net: m.net + b[i].net }));
    function fyTotals(y, storeId = 'all') {
      const ids = storeId === 'all' ? STORES.map(s => s.id) : [storeId];
      const months = ids.map(id => fyMonths(y, id)).reduce(addMonths);
      const t = (k) => months.reduce((s, m) => s + m[k], 0);
      return { months, txns: t('txns'), gross: t('gross'), fees: t('fees'), refunds: t('refunds'), net: t('net') };
    }

    function fyCard(y) {
      const open = fyOpen.has(y);
      const tot = fyTotals(y);
      const stores = fyStores(y);
      const current = y === CURRENT_FY;
      const max = Math.max(...tot.months.map(m => m.gross), 1);
      const monthLabels = ['Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'];
      const downloadCell = (status, storeId) => status === 'Processing'
        ? `<span class="inline-flex items-center gap-1.5 text-xs text-amber-600 font-medium">${ic('loader', 'w-3.5 h-3.5')}Generating…</span>`
        : `<div class="inline-flex gap-1.5">
            <button data-action="toast" data-msg="Prototype: ${status === 'In Progress' ? 'provisional ' : ''}PDF statement is not wired up." class="px-2.5 py-1 text-xs font-medium text-slate-700 bg-white border border-slate-200 rounded hover:bg-slate-50 inline-flex items-center gap-1">${ic('file-down', 'w-3.5 h-3.5')}${status === 'In Progress' ? 'Provisional PDF' : 'PDF'}</button>
            ${status === 'Generated' ? `<button data-action="toast" data-msg="Prototype: Excel statement is not wired up." class="px-2.5 py-1 text-xs font-medium text-slate-700 bg-white border border-slate-200 rounded hover:bg-slate-50 inline-flex items-center gap-1">${ic('sheet', 'w-3.5 h-3.5')}Excel</button>` : ''}
          </div>`;
      const row = (storeId, name, sub, status) => `
        <tr class="hover:bg-slate-50/50 transition-colors">
          <td class="px-5 py-3"><div class="font-medium text-slate-900">${name}</div><div class="text-[11px] text-slate-500 font-mono">${sub}</div></td>
          <td class="px-5 py-3">${fyBadge(status)}</td>
          <td class="px-5 py-3 text-center"><button data-action="open-fy" data-year="${y}" data-store="${storeId}" class="text-xs font-medium text-primary-600 hover:text-primary-700 hover:underline">View</button></td>
          <td class="px-5 py-3 text-right">${downloadCell(status, storeId)}</td>
        </tr>`;
      const allStatus = current ? 'In Progress' : stores.some(st => fyStatus(y, st.id) === 'Processing') ? 'Processing' : 'Generated';

      return `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
          <button data-action="fy-toggle" data-value="${y}" class="w-full p-5 hover:bg-slate-50 transition-colors flex items-center justify-between gap-4 text-left">
            <div class="flex items-center gap-4 min-w-0">
              <span class="p-1.5 rounded-md ${open ? 'bg-slate-100' : 'bg-slate-50'}">${ic(open ? 'chevron-down' : 'chevron-right', 'w-4 h-4 text-slate-500')}</span>
              <div class="min-w-0">
                <h3 class="text-lg font-medium text-slate-900 flex items-center gap-2">FY ${fyLabel(y)} ${current ? fyBadge('In Progress') : ''}</h3>
                <p class="text-xs text-slate-500 font-medium mt-0.5">01 Jul ${y} – 30 Jun ${y + 1}${current ? ` · to date (${fmtShort(NOW)})` : ''} · Reports for ${stores.length} store${stores.length > 1 ? 's' : ''}</p>
              </div>
            </div>
            <div class="flex items-center gap-8 shrink-0">
              <div class="text-right hidden md:block"><p class="text-[11px] font-medium text-slate-500 uppercase tracking-tight">Gross Sales</p><p class="text-sm font-bold text-slate-900 tabular-nums">${fmtBDTShort(tot.gross)}</p></div>
              <div class="text-right"><p class="text-[11px] font-medium text-slate-500 uppercase tracking-tight">Net Settled</p><p class="text-sm font-bold text-slate-900 tabular-nums">${fmtBDTShort(tot.net)}</p></div>
            </div>
          </button>
          ${open ? `
            <div class="border-t border-slate-100 bg-slate-50/30 p-5 space-y-5">
              <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                ${statBox('Transactions', tot.txns.toLocaleString())}
                ${statBox('Gross Sales', fmtBDTShort(tot.gross))}
                ${statBox('Gateway Fees', fmtBDTShort(tot.fees))}
                ${statBox('Refunds & Chargebacks', fmtBDTShort(tot.refunds))}
                ${statBox('Net Settled', fmtBDTShort(tot.net), 'text-emerald-600')}
              </div>
              <div>
                <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Monthly gross sales</p>
                <div class="flex items-end gap-2 h-28 px-1">
                  ${monthLabels.map((label, i) => {
                    const m = tot.months[i];
                    const h = m ? Math.max(2, m.gross / max * 100) : 0;
                    return `<div class="flex-1 flex flex-col items-center justify-end h-full gap-1" title="${label}: ${m ? fmtBDT0(m.gross) : 'not started'}">
                      <div class="w-full rounded-t ${m ? 'bg-primary-600' : 'bg-slate-100 border border-dashed border-slate-300'}" style="height:${m ? h : 100}%"></div>
                      <span class="text-[10px] text-slate-500">${label}</span>
                    </div>`;
                  }).join('')}
                </div>
              </div>
              <div class="rounded-lg border border-slate-200 overflow-hidden bg-white">
                <table class="w-full text-sm text-left">
                  <thead><tr class="text-[11px] uppercase tracking-wider text-slate-500 font-medium border-b border-slate-200 bg-slate-50">
                    <th class="px-5 py-3">Store</th><th class="px-5 py-3">Status</th><th class="px-5 py-3 text-center">Details</th><th class="px-5 py-3 text-right">Download</th>
                  </tr></thead>
                  <tbody class="divide-y divide-slate-100">
                    ${row('all', 'All stores (consolidated)', `${stores.length} stores`, allStatus)}
                    ${stores.map(st => row(st.id, esc(st.name), st.id, fyStatus(y, st.id))).join('')}
                  </tbody>
                </table>
              </div>
            </div>` : ''}
        </div>`;
    }

    function renderFinancialYear() {
      const lifetime = FY_YEARS.reduce((s, y) => s + fyTotals(y).net, 0);
      return `
        <div class="space-y-6">
          <div>
            <h1 class="text-2xl font-bold text-slate-900">Financial Year Report</h1>
            <p class="text-slate-500 text-sm">Year-wise statement of your sales, fees and settlements for the Bangladesh financial year (1 July – 30 June).</p>
          </div>

          <div class="rounded-xl border border-indigo-100 bg-indigo-50/60 p-5 flex items-center justify-between gap-4">
            <div class="flex items-center gap-3">
              <div class="p-2 bg-indigo-100 rounded-lg">${ic('file-text', 'w-5 h-5 text-indigo-600')}</div>
              <div>
                <h3 class="text-sm font-semibold text-indigo-800 uppercase tracking-wider">Consolidated Summary</h3>
                <p class="text-xs text-indigo-600 font-medium">Financial year reports over ${FY_YEARS.length} years · ${STORES.length} stores</p>
              </div>
            </div>
            <div class="text-right">
              <div class="text-xs text-indigo-500 mb-0.5">Lifetime Net Settled</div>
              <div class="text-2xl font-bold text-indigo-800 tabular-nums">${fmtBDTShort(lifetime)}</div>
            </div>
          </div>

          <div class="space-y-4">${FY_YEARS.map(fyCard).join('')}</div>

          <p class="flex items-start gap-1.5 text-[11px] text-slate-500">${ic('info', 'w-3.5 h-3.5 mt-px shrink-0')}Statements are generated after the financial year closes on 30 June and can be used for VAT / income tax filing with NBR. The current year's statement is provisional. All figures here are mock data.</p>
        </div>`;
    }

    function fyDrawer({ y, storeId }) {
      const tot = fyTotals(y, storeId);
      const name = storeId === 'all' ? 'All stores (consolidated)' : STORES.find(s => s.id === storeId).name;
      const status = storeId === 'all'
        ? (y === CURRENT_FY ? 'In Progress' : fyStores(y).some(st => fyStatus(y, st.id) === 'Processing') ? 'Processing' : 'Generated')
        : fyStatus(y, storeId);
      const fmtMonth = (d) => `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
      return drawerShell({
        wide: true,
        title: `FY ${fyLabel(y)}`,
        sub: `<span>${esc(name)}</span>${fyBadge(status)}`,
        body: `
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Gross Sales', fmtBDTShort(tot.gross))}
            ${statBox('Fees + Refunds', fmtBDTShort(tot.fees + tot.refunds), 'text-rose-600')}
            ${statBox('Net Settled', fmtBDTShort(tot.net), 'text-emerald-600')}
          </div>
          ${section('Monthly Breakdown', miniTable(
            ['Month', 'Transactions', 'Gross Sales', 'Gateway Fees', 'Refunds', 'Net Settled'],
            tot.months.map(m => [fmtMonth(m.start), m.txns.toLocaleString(), fmtBDT0(m.gross), fmtBDT0(m.fees), fmtBDT0(m.refunds), fmtBDT0(m.net)]),
            { right: [1, 2, 3, 4, 5], total: ['Total', tot.txns.toLocaleString(), fmtBDT0(tot.gross), fmtBDT0(tot.fees), fmtBDT0(tot.refunds), fmtBDT0(tot.net)] }))}
          ${y === CURRENT_FY ? `<p class="text-xs text-slate-500">Months after ${fmtMonth(NOW)} will appear as the year progresses. This statement is provisional until 30 Jun ${y + 1}.</p>` : ''}`,
        footer: status === 'Processing'
          ? `<span class="inline-flex items-center gap-2 text-sm text-amber-600 font-medium">${ic('loader', 'w-4 h-4')}Statement is being generated</span>`
          : `<button data-action="toast" data-msg="Prototype: Excel statement is not wired up." class="${BTN_SECONDARY}">${ic('sheet', 'w-4 h-4')}Download Excel</button>
             <button data-action="toast" data-msg="Prototype: PDF statement is not wired up." class="${BTN_PRIMARY}">${ic('file-down', 'w-4 h-4')}Download ${status === 'In Progress' ? 'Provisional ' : ''}PDF</button>`,
      });
    }

    // =====================================================================
    // Payment Products — shared form pieces
    // =====================================================================
    const LINKS_PATH = '/products/payment-links';
    const INVOICES_PATH = '/products/digital-invoices';
    const QR_PATH = '/products/payment-qr';
    const EMI_PATH = '/products/digital-emi';

    const INPUT = 'w-full px-3 py-2 bg-white border border-slate-200 rounded-md text-sm text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500';
    const field = (label, control, { hint = '', required = false, error = '' } = {}) => `
      <label class="block">
        <span class="block text-xs font-bold text-slate-700 mb-1.5">${label}${required ? ' <span class="text-rose-500">*</span>' : ''}</span>
        ${control}
        ${error ? `<span class="block text-[11px] font-medium text-rose-600 mt-1">${error}</span>` : hint ? `<span class="block text-[11px] text-slate-500 mt-1">${hint}</span>` : ''}
      </label>`;
    const options = (list, value) => list.map(o => {
      const [v, l] = Array.isArray(o) ? o : [o, o];
      return `<option value="${esc(v)}" ${v === value ? 'selected' : ''}>${esc(l)}</option>`;
    }).join('');
    const storeOptions = (value) => options(STORES.map(s => [s.id, s.name]), value);
    const safeColor = (c, fallback) => /^#[0-9a-f]{6}$/i.test(c || '') ? c : fallback;
    let formErrors = {};

    // =====================================================================
    // Payment Links
    // =====================================================================
    const activeBadge = (on) => `<span class="${STATUS_BADGE} ${on ? 'bg-emerald-50 text-emerald-600' : 'bg-slate-100 text-slate-500'}">${on ? 'Active' : 'Inactive'}</span>`;
    const linkCollected = (l) => l.payments.reduce((s, p) => s + p.amount, 0);

    function linkRows(s) {
      const q = s.search.trim().toLowerCase();
      return PAYMENT_LINKS.filter(l =>
        (s.store === 'all' || l.store === s.store) &&
        inRange(l, s.range) &&
        (!q || l.name.toLowerCase().includes(q) || l.ref.toLowerCase().includes(q)) &&
        (s.status === 'all' || (s.status === 'active') === l.active)
      );
    }

    function renderPaymentLinks() {
      const s = pageState();
      const rows = linkRows(s);
      const base = linkRows({ ...s, status: 'all' });
      const { totalPages, start, pageRows } = paginate(s, rows);
      const statusOpts = [{ label: 'All Status', value: 'all' }, { label: 'Active', value: 'active' }, { label: 'Inactive', value: 'inactive' }];
      const cols = [
        { label: 'Payment Name', cell: l => `<div class="font-medium text-slate-800">${esc(l.name)}</div><div class="text-[11px] font-mono text-slate-500">${l.ref}</div>` },
        { label: 'Store', cls: 'hidden lg:table-cell', cell: l => esc(l.storeName) },
        { label: 'Amount', cell: l => `<div class="font-semibold text-slate-900 whitespace-nowrap">${l.amountType === 'Fixed' ? fmtBDT(l.amount) : 'Any amount'}</div><div class="text-xs text-slate-500">${l.paymentType}${l.convFee ? ` · +${l.convFee}% fee` : ''}</div>` },
        { label: 'Payments', cls: 'hidden xl:table-cell', right: true, cell: l => `<div class="font-medium text-slate-800">${l.payments.length}</div><div class="text-xs text-slate-500 whitespace-nowrap">${fmtBDT(linkCollected(l))}</div>` },
        { label: 'Created On', cell: l => dateCell(l.date) },
        { label: 'Status', cell: l => activeBadge(l.active) },
        { label: 'Link', cell: l => `<button data-action="copy" data-value="${linkUrl(l.ref)}" class="inline-flex items-center gap-1 px-2 py-1 rounded border border-slate-200 bg-white text-xs font-medium text-slate-600 hover:bg-slate-50 whitespace-nowrap">${ic('copy', 'w-3.5 h-3.5')}Copy</button>` },
      ];
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Payment Links</h1>
              <p class="text-slate-500 text-sm">Share a link by SMS, WhatsApp or email and collect payments without a website.</p>
            </div>
            <button data-action="new-link" class="${BTN_PRIMARY} shrink-0">${ic('plus', 'w-4 h-4')}Create Payment Link</button>
          </div>
          <div class="flex flex-col">
            ${listFilterBar(s, 'Payment Name or Refer Id', selectPill('list', 'status', 'Status', statusOpts, s.status, 'circle-dot'))}
            <div class="flex flex-col gap-4 pt-4">
              <h2 class="text-sm font-semibold text-slate-900">Overview</h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                ${metricCard({ title: 'Total Links', value: base.length.toLocaleString(), status: 'all', selected: s.status === 'all' })}
                ${metricCard({ title: 'Active Links', value: base.filter(l => l.active).length.toLocaleString(), status: 'active', selected: s.status === 'active' })}
                ${metricCard({ title: 'Payments Received', value: base.reduce((n, l) => n + l.payments.length, 0).toLocaleString() })}
                ${metricCard({ title: 'Amount Collected', value: fmtBDTShort(base.reduce((n, l) => n + linkCollected(l), 0)) })}
              </div>
            </div>
            <div class="space-y-4 pt-6">
              ${listToolbar(rows.length, 'payment links', s)}
              ${dataTable({ cols, rows: pageRows, rowAttrs: l => `data-action="open-link" data-value="${l.ref}"`, emptyTitle: 'No payment links found' })}
              ${pager(s, rows.length, start, pageRows.length, totalPages)}
            </div>
          </div>
        </div>`;
    }

    function payPagePreview(l) {
      const c = {
        leftBg: safeColor(l.colors.leftBg, DEFAULT_LINK_COLORS.leftBg), leftText: safeColor(l.colors.leftText, DEFAULT_LINK_COLORS.leftText),
        btnBg: safeColor(l.colors.btnBg, DEFAULT_LINK_COLORS.btnBg), btnText: safeColor(l.colors.btnText, DEFAULT_LINK_COLORS.btnText),
      };
      const box = (text) => `<div class="h-8 rounded border border-slate-200 px-2 flex items-center text-[11px] text-slate-400">${text}</div>`;
      return `
        <div class="rounded-xl border border-slate-200 overflow-hidden grid grid-cols-5 shadow-sm">
          <div class="col-span-3 p-5" style="background:${c.leftBg};color:${c.leftText}">
            <p class="text-[10px] uppercase tracking-wider opacity-60">Demo Merchant Ltd.</p>
            <h4 class="text-lg font-bold mt-1 break-words">${esc(l.name || 'Payment name')}</h4>
            ${l.topMessage ? `<p class="text-xs mt-2 opacity-80">${esc(l.topMessage)}</p>` : ''}
            ${l.productDetails ? `<p class="text-xs mt-3 opacity-70 whitespace-pre-line">${esc(l.productDetails)}</p>` : ''}
            <p class="text-2xl font-bold mt-4">${l.amountType === 'Fixed' ? fmtBDT(Number(l.amount) || 0) : `<span class="text-sm font-medium opacity-70">${esc(l.amountText || 'Customer enters the amount')}</span>`}</p>
            ${Number(l.convFee) ? `<p class="text-[11px] opacity-70 mt-1">+ ${esc(l.convFee)}% convenience fee</p>` : ''}
          </div>
          <div class="col-span-2 p-4 bg-white space-y-2">
            ${box('Name')}${box('Mobile')}${box('Email (optional)')}
            ${l.amountType === 'Any' ? box('Amount (BDT)') : ''}
            <div class="h-9 rounded flex items-center justify-center text-sm font-semibold" style="background:${c.btnBg};color:${c.btnText}">${esc(l.buttonName || 'Pay Now')}</div>
            ${l.buttonMessage ? `<p class="text-[10px] text-slate-500 text-center">${esc(l.buttonMessage)}</p>` : ''}
          </div>
        </div>`;
    }

    const LINK_PARAMS = (l) => miniTable(['Parameter', 'Reason', 'Mandatory'], [
      ['Refer Id', 'Identifies this link', 'Yes'],
      ['Name', 'Customer name on the receipt', 'Yes'],
      ['Email Address', 'Receipt by email', 'No'],
      ['Mobile', 'Payment notification by SMS', 'Yes'],
      ['Amount', l.amountType === 'Fixed' ? 'Fixed by you' : 'Entered by the customer', 'Yes'],
      ['Currency', 'BDT', 'Yes'],
    ]);

    function linkDrawer(l) {
      const url = linkUrl(l.ref);
      const share = (icon, label) => `<button data-action="toast" data-msg="Prototype: nothing was sent via ${label}." class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full border border-slate-200 bg-white text-xs font-medium text-slate-600 hover:bg-slate-50">${ic(icon, 'w-3.5 h-3.5')}${label}</button>`;
      const last = l.payments[l.payments.length - 1];
      return drawerShell({
        wide: true,
        title: esc(l.name),
        sub: `<span class="font-mono text-xs">${l.ref}</span>${activeBadge(l.active)}`,
        body: `
          <div>
            <div class="flex items-center gap-2 rounded-lg border border-slate-200 bg-slate-50 px-3 py-2">
              ${ic('link', 'w-4 h-4 text-slate-400 shrink-0')}
              <span class="font-mono text-xs text-slate-700 truncate flex-1">${url}</span>
              <button data-action="copy" data-value="${url}" class="inline-flex items-center gap-1 px-2 py-1 rounded bg-white border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50">${ic('copy', 'w-3.5 h-3.5')}Copy</button>
            </div>
            <div class="flex flex-wrap gap-2 mt-2">${share('message-circle', 'WhatsApp')}${share('mail', 'Email')}${share('smartphone', 'SMS')}</div>
          </div>
          <div class="grid grid-cols-3 gap-3">
            ${statBox('Payments', l.payments.length)}
            ${statBox('Collected', fmtBDT(linkCollected(l)), 'text-emerald-600')}
            ${statBox('Last Payment', last ? fmtShort(last.date) : '—')}
          </div>
          ${section('Configuration', kvGrid([
            kv('Pay Type', l.payType),
            kv('Payment Type', l.paymentType),
            kv('Amount Type', l.amountType),
            kv(l.amountType === 'Fixed' ? 'Amount' : 'Amount Text', l.amountType === 'Fixed' ? fmtBDT(l.amount) : esc(l.amountText)),
            kv('Convenience Fee', l.convFee ? `${l.convFee}%` : 'Not charged'),
            kv('Pay Button Name', esc(l.buttonName)),
            kv('Store', esc(l.storeName)),
            kv('Domain URL', l.domainUrl ? esc(l.domainUrl) : '—', true),
            kv('Created On', `${fmtDate(l.date)}, ${fmtTime(l.date)}`),
          ]))}
          ${section('Customer Page Preview', payPagePreview(l))}
          ${section('Inputted Parameters', LINK_PARAMS(l))}
          ${section('Recent Payments', l.payments.length ? `<div class="divide-y divide-slate-100 rounded-lg border border-slate-200">
            ${l.payments.slice(-5).reverse().map(p => `
              <button data-action="open-txn" data-value="${p.txn.id}" class="w-full flex items-center justify-between gap-3 px-3 py-2 text-left hover:bg-slate-50">
                <span><span class="block text-sm text-slate-800">${esc(p.customer)}</span><span class="block text-xs text-slate-500">${fmtDate(p.date)}, ${fmtTime(p.date)}</span></span>
                <span class="text-sm font-semibold text-slate-900">${fmtBDT(p.amount)}</span>
              </button>`).join('')}
          </div>` : '<p class="text-sm text-slate-500">No payments yet.</p>')}`,
        footer: `
          <button data-action="toast" data-msg="Prototype: editing is not wired up." class="${BTN_SECONDARY}">${ic('pencil', 'w-4 h-4')}Edit</button>
          <button data-action="link-toggle" data-value="${l.ref}" class="${l.active ? BTN_SECONDARY : BTN_PRIMARY}">${ic(l.active ? 'circle-pause' : 'circle-play', 'w-4 h-4')}${l.active ? 'Deactivate' : 'Activate'}</button>`,
      });
    }

    let linkDraft = null;

    // =====================================================================

    const INVOICE_STATUSES = ['Draft', 'Sent', 'Paid', 'Overdue', 'Cancelled'];

    const dueText = (inv) => {
      if (inv.status === 'Paid') return { text: `Paid ${fmtShort(inv.paidAt)}`, cls: 'text-emerald-600' };
      if (inv.status === 'Cancelled' || inv.status === 'Draft') return { text: '', cls: '' };
      const days = Math.ceil((inv.due - NOW) / 864e5);
      if (days < 0) return { text: `${-days} day${days < -1 ? 's' : ''} overdue`, cls: 'text-rose-600' };

    function invoiceRows(s, withStatus = true) {
      const q = s.search.trim().toLowerCase();
      return INVOICES.filter(inv =>
        (s.store === 'all' || inv.store === s.store) &&
        inRange(inv, s.range) &&
        (!q || inv.no.toLowerCase().includes(q) || inv.customer.toLowerCase().includes(q)) &&
        (!withStatus || s.status === 'all' || (s.status === 'open' ? ['Sent', 'Overdue'].includes(inv.status) : inv.status === s.status))

    function invoicePaper(inv) {

              <div class="flex justify-between"><span class="text-slate-500">VAT</span><span class="tabular-nums">${fmtBDT(t.vat)}</span></div>

            </div>
          </div>
          ${field('Notes', `<textarea data-inv="notes" rows="2" class="${INPUT}" placeholder="(optional) Shown on the invoice">${esc(d.notes)}</textarea>`)}`,
        footer: `
          <button data-action="close-drawer" class="${BTN_SECONDARY}">Cancel</button>
          <button data-action="save-invoice" data-value="Draft" class="${BTN_SECONDARY}">${ic('save', 'w-4 h-4')}Save as Draft</button>
          <button data-action="save-invoice" data-value="Sent" class="${BTN_PRIMARY}">${ic('send', 'w-4 h-4')}Send Invoice</button>`,
      });
    }

    function syncInvoiceTotals() {
      const t = draftTotals();
      const el = $('#inv-totals');
      if (el) el.querySelectorAll('.tabular-nums').forEach((n, i) => { n.textContent = fmtBDT([t.subtotal, t.vat, t.total][i]); });

    function validateInvoice() {
      const d = invDraft, e = {};
      if (!d.customer.trim()) e.customer = 'Enter the customer name.';
      if (!/^01[3-9]\d{8}$/.test(d.phone.trim())) e.phone = 'Enter an 11-digit mobile number starting with 01.';
      if (d.email.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim())) e.email = 'Enter a valid email or leave it empty.';
      if (!d.items.some(it => it.desc.trim() && Number(it.qty) > 0 && Number(it.price) > 0)) e.items = 'Add at least one item with a description, quantity and price.';
      if (!d.due || d.due < toDateInput(NOW)) e.due = 'Pick today or a later date.';
      return e;
    }

    // =====================================================================
    // Payment QR (Bangla QR)
    // =====================================================================
    const qrGen = { store: STORES[0].id, amount: '', result: null, error: '' };

    // A QR-looking pattern for the mockup only — it encodes nothing and cannot be scanned.
    function sampleQr(seed, cls) {
      const n = 25;
      const r = mulberry32(idHash(seed));
      const inFinder = (x, y) => (x < 8 && y < 8) || (x >= n - 8 && y < 8) || (x < 8 && y >= n - 8);
      let path = '';
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (!inFinder(x, y) && r() < 0.5) path += `M${x} ${y}h1v1h-1z`;
      const finder = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#0f172a"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#0f172a"/>`;
      return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" class="${cls}" shape-rendering="crispEdges" role="img" aria-label="Sample QR pattern, not scannable"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${path}" fill="#0f172a"/>${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}</svg>`;
    }

    function qrFrame(seed, caption) {
      return `
        <div class="rounded-xl border-2 border-primary-600 bg-white p-3 text-center w-44 mx-auto">
          <p class="text-[10px] font-bold uppercase tracking-widest text-primary-600">Bangla QR</p>
          ${sampleQr(seed, 'w-36 h-36 mx-auto mt-1')}
          <p class="text-[11px] font-semibold text-slate-800 mt-1 truncate">${caption}</p>
          <p class="text-[9px] text-slate-400">Sample pattern — not scannable</p>
        </div>`;
    }

    function renderPaymentQr() {
      const qrTx = TXNS.filter(t => t.method === 'Bangla QR' && t.status === 'success');
      const monthStart = new Date(NOW.getFullYear(), NOW.getMonth(), 1);
      const today = qrTx.filter(t => t.date >= TODAY);
      const month = qrTx.filter(t => t.date >= monthStart);
      const sum = (list) => list.reduce((s, t) => s + t.amount, 0);
      const g = qrGen;
      return `
        <div class="space-y-6">
          <div class="flex items-start justify-between gap-4">
            <div>
              <h1 class="text-2xl font-bold text-slate-900">Payment QR</h1>
              <p class="text-slate-500 text-sm">Bangla QR codes for your stores — customers scan with any bank or MFS app.</p>
            </div>
            <button data-action="toast" data-msg="Prototype: QR request form is not wired up." class="${BTN_PRIMARY} shrink-0">${ic('plus', 'w-4 h-4')}Request New QR</button>
          </div>

            ${metricCard({ title: 'Collected Today', value: fmtBDTShort(sum(today)), sub: `${today.length} QR payments` })}
            ${metricCard({ title: 'This Month', value: fmtBDTShort(sum(month)), sub: `${month.length} QR payments` })}
            ${metricCard({ title: 'Average Ticket', value: fmtBDT(month.length ? sum(month) / month.length : 0) })}
            ${metricCard({ title: 'Active QR Codes', value: QR_CODES.length, sub: `${new Set(QR_CODES.map(q => q.store)).size} stores` })}
          </div>

          <div class="space-y-3">
            <h2 class="text-sm font-semibold text-slate-900">Your QR Codes</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
              ${QR_CODES.map(q => {
                const store = STORES.find(s => s.id === q.store);
                const todayStore = today.filter(t => t.store === q.store);
                return `
                  <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col">
                    <div class="px-4 py-3 border-b border-slate-100 flex items-start justify-between gap-2">
                      <div class="min-w-0"><p class="text-sm font-semibold text-slate-900 truncate">${esc(store.name)}</p><p class="text-xs text-slate-500">${q.label} · Static</p></div>
                      ${activeBadge(true)}
                    </div>
                    <div class="p-4">${qrFrame(q.id, 'Demo Merchant Ltd.')}</div>
                    <dl class="px-4 pb-3 grid grid-cols-2 gap-2 text-xs">
                      <div><dt class="text-slate-500">QR ID</dt><dd class="font-mono text-slate-800">${q.id}</dd></div>
                      <div><dt class="text-slate-500">Terminal</dt><dd class="font-mono text-slate-800">${q.terminal}</dd></div>

                      <button data-action="toast" data-msg="Prototype: QR download is not wired up." class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50">${ic('download', 'w-3.5 h-3.5')}Download</button>
                      <button data-action="toast" data-msg="Prototype: standee printing is not wired up." class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50">${ic('printer', 'w-3.5 h-3.5')}Standee</button>
                      <button data-action="qr-txns" data-value="${q.store}" class="inline-flex items-center gap-1 px-2.5 py-1.5 rounded border border-slate-200 text-xs font-medium text-primary-600 hover:bg-primary-50">${ic('list', 'w-3.5 h-3.5')}Payments</button>
                    </div>
                  </div>`;
              }).join('')}
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-lg border border-slate-200 shadow-sm">
              ${cardHead('Amount QR', 'One-time QR for a fixed amount, e.g. at the counter')}
              <div class="p-5 space-y-4">
                ${field('Store', `<select id="qr-store" class="${INPUT}">${storeOptions(g.store)}</select>`)}
                ${field('Amount (BDT)', `<input id="qr-amount" type="number" min="1" value="${esc(g.amount)}" placeholder="e.g. 1250" class="${INPUT}">`, { error: g.error })}
                <button data-action="qr-generate" class="${BTN_PRIMARY} w-full justify-center">${ic('qr-code', 'w-4 h-4')}Generate QR</button>
                ${g.result ? `
                  <div class="pt-2 text-center space-y-2">
                    ${qrFrame(g.result.ref, fmtBDT(g.result.amount))}
                    <p class="text-xs text-slate-500">${esc(STORES.find(s => s.id === g.result.store).name)} · <span class="font-mono">${g.result.ref}</span></p>
                    <p class="text-xs font-medium text-amber-600">Valid until ${fmtTime(new Date(g.result.at.getTime() + 15 * 60e3))} (15 minutes, mock)</p>
                  </div>` : ''}
              </div>
            </div>
            <div class="bg-white rounded-lg border border-slate-200 shadow-sm lg:col-span-2 overflow-hidden">
              ${cardHead('Recent QR Payments', 'Latest Bangla QR payments across your stores', `<a href="#/transactions/bangla-qr" class="text-xs font-medium text-primary-600 hover:text-primary-700 inline-flex items-center gap-1">View all${ic('arrow-right', 'w-3.5 h-3.5')}</a>`)}
              <table class="w-full text-left text-sm">
                <thead class="bg-slate-50 border-b border-slate-200"><tr>
                  ${['Date & Time', 'Transaction ID', 'Store', 'Amount'].map((h, i) => `<th class="h-10 px-4 text-xs font-semibold text-slate-500 uppercase tracking-wider whitespace-nowrap ${i === 3 ? 'text-right' : ''} ${i === 2 ? 'hidden md:table-cell' : ''}">${h}</th>`).join('')}
                </tr></thead>
                <tbody class="divide-y divide-slate-100">
                  ${qrTx.slice(0, 8).map(t => `
                    <tr data-action="open-txn" data-value="${t.id}" class="hover:bg-slate-50 cursor-pointer">
                      <td class="px-4 py-2.5">${dateCell(t.date)}</td>
                      <td class="px-4 py-2.5 font-mono text-xs text-slate-800">${t.id}</td>
